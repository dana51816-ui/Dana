name: Fetch Albert Levi artwork images
on:
  workflow_dispatch:
  push:
    branches: [claude/albert-price-simulator]
    paths: [albert-prices/tools/fetch-images.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download catalog and thumbnails
        run: python3 albert-prices/tools/fetch_images.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add albert-prices/img albert-prices/tools/products.json albert-prices/tools/fetch-log.txt
          git commit -m "Update artwork thumbnails from albertlevi.com" || echo "nothing to commit"
          git push
