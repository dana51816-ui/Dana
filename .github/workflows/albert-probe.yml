name: Probe US storefront prices
on:
  workflow_dispatch:
  push:
    branches: [claude/albert-price-simulator]
    paths: [albert-prices/tools/probe-trigger.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 albert-prices/tools/probe_us.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add albert-prices/tools/products-live.json albert-prices/tools/products-js.json
          git commit -m "Fetch live US catalog" || echo "nothing to commit"
          git pull --rebase origin claude/albert-price-simulator && git push
