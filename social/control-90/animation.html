<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;}
  .stage{
    position:relative;
    width:1080px;
    height:1350px;
    overflow:hidden;
    background:#000;
  }
  .bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform-origin:50% 38%;
    animation: kenburns 8.5s linear forwards;
    will-change:transform;
  }
  @keyframes kenburns{
    0%   { transform: scale(1.0); }
    100% { transform: scale(1.07); }
  }

  .intro-fade{
    position:absolute; inset:0;
    background:#0a0604;
    opacity:1;
    animation: introFade 0.8s ease-out forwards;
    pointer-events:none;
  }
  @keyframes introFade{
    0%{opacity:1;}
    100%{opacity:0;}
  }

  /* full-image diagonal shine sweep */
  .shine-sweep{
    position:absolute;
    top:-20%;
    left:-60%;
    width:45%;
    height:140%;
    background:linear-gradient(100deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.16) 45%,
      rgba(255,255,255,0.32) 50%,
      rgba(255,255,255,0.16) 55%,
      rgba(255,255,255,0) 100%);
    transform:translateX(-40%) rotate(8deg);
    opacity:0;
    animation: shineSweep 1.3s ease-in-out 1.0s forwards;
    mix-blend-mode:screen;
    pointer-events:none;
  }
  @keyframes shineSweep{
    0%{ transform:translateX(-40%) rotate(8deg); opacity:0; }
    12%{ opacity:1; }
    88%{ opacity:1; }
    100%{ transform:translateX(280%) rotate(8deg); opacity:0; }
  }

  /* spotlight over the CONTROL 90 offer block */
  .spot-offer{
    position:absolute;
    left:47%;
    top:27%;
    width:50%;
    height:24%;
    background:radial-gradient(ellipse at center,
      rgba(255,255,255,0.38) 0%,
      rgba(255,255,255,0.14) 45%,
      rgba(255,255,255,0) 72%);
    opacity:0;
    transform:scale(0.9);
    animation: spotPulse 1.7s ease-in-out 2.1s forwards;
    pointer-events:none;
  }
  @keyframes spotPulse{
    0%{ opacity:0; transform:scale(0.9); }
    35%{ opacity:1; transform:scale(1.04); }
    65%{ opacity:1; transform:scale(1.02); }
    100%{ opacity:0; transform:scale(1.06); }
  }

  /* CTA bar bounding box: left 8.47% top 85.38% width 83.33% height 8.91% */
  .cta-wrap{
    position:absolute;
    left:6.5%;
    top:83.6%;
    width:87.3%;
    height:12.5%;
    opacity:0;
    transform:scale(0.92);
    animation: ctaAppear 0.55s cubic-bezier(.2,1.4,.4,1) 3.55s forwards;
    pointer-events:none;
  }
  @keyframes ctaAppear{
    0%{ opacity:0; transform:scale(0.92); }
    100%{ opacity:1; transform:scale(1); }
  }

  .cta-glow{
    position:absolute;
    inset:8%;
    border-radius:999px;
    animation: ctaGlowPulse 1.15s ease-in-out 3.55s infinite;
  }
  @keyframes ctaGlowPulse{
    0%{   box-shadow:0 0 0px 0px rgba(255,214,214,0.0); }
    50%{  box-shadow:0 0 46px 14px rgba(255,214,214,0.55); }
    100%{ box-shadow:0 0 0px 0px rgba(255,214,214,0.0); }
  }

  .cta-shine-clip{
    position:absolute;
    inset:8%;
    border-radius:999px;
    overflow:hidden;
  }
  .cta-shine{
    position:absolute;
    top:-50%;
    left:-45%;
    width:35%;
    height:200%;
    background:linear-gradient(100deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.55) 50%,
      rgba(255,255,255,0) 100%);
    transform:translateX(-20%) rotate(10deg);
    animation: ctaShineSweep 0.9s ease-in-out 4.05s forwards;
    mix-blend-mode:screen;
  }
  @keyframes ctaShineSweep{
    0%{ transform:translateX(-20%) rotate(10deg); }
    100%{ transform:translateX(340%) rotate(10deg); }
  }

  /* notification pings near the WhatsApp icon inside the CTA bar */
  .ping{
    position:absolute;
    left:20.0%;
    top:90.0%;
    width:64px;
    height:64px;
    margin-left:-32px;
    margin-top:-32px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,0.85);
    opacity:0;
    transform:scale(0.6);
    animation: ping 1.8s ease-out infinite;
    pointer-events:none;
  }
  .ping.p2{ animation-delay:4.9s; }
  .ping.p1{ animation-delay:4.0s; }
  @keyframes ping{
    0%{ opacity:0.75; transform:scale(0.55); }
    70%{ opacity:0; transform:scale(1.9); }
    100%{ opacity:0; transform:scale(1.9); }
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="assets/ad.png" alt="">
    <div class="intro-fade"></div>
    <div class="shine-sweep"></div>
    <div class="spot-offer"></div>
    <div class="cta-wrap">
      <div class="cta-glow"></div>
      <div class="cta-shine-clip"><div class="cta-shine"></div></div>
    </div>
    <div class="ping p1"></div>
    <div class="ping p2"></div>
  </div>
</body>
</html>
