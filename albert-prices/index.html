<title>מחירון אלברט לוי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Archivo:wdth,wght@100..125,500..900&family=Josefin+Sans:wght@300;400&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: a pocket gallery — colourful tiles index the works; a work opens as a three-step picker over a live wall preview, with the price pinned in a bottom bar like a gallery wall label. */
:root{
  --wall:#f3f5fb; --card:#ffffff; --ink:#121a3d; --muted:#5f6789; --line:#dfe4f2; --soft:#e9edf8;
  --navy:#1d3a8f; --navy-deep:#14215e; --gold:#f2b33d; --on-gold:#14215e; --brand-fg:#ffffff;
  --cobalt:#2f4be0; --magenta:#e0337a; --sun:#f5b70a; --teal:#11a198; --tang:#f26b2a;
  --accent:var(--navy); --on-accent:#ffffff;
  --warn:#a8510b; --warn-bg:#fff2df; --ok:#1d7a4c; --sold:#b02142;
  --display:"Archivo","Rubik",system-ui,sans-serif;
  --script:"Mrs Saint Delafield",cursive; --thin:"Josefin Sans","Rubik",sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(20,22,40,.06),0 8px 24px -12px rgba(20,22,40,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#0c1233; --card:#151d47; --ink:#eef1fb; --muted:#9aa3c8; --line:#26306a; --soft:#1c2557;
  --navy:#1d3a8f; --navy-deep:#0a0f2c; --gold:#f5bd52; --on-gold:#14215e;
  --accent:#9fb3ff; --on-accent:#0c1233; --warn:#ffb46b; --warn-bg:#2f2213; --ok:#6fd6a2; --sold:#ff8aa0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#0c1233; --card:#151d47; --ink:#eef1fb; --muted:#9aa3c8; --line:#26306a; --soft:#1c2557;
  --navy:#1d3a8f; --navy-deep:#0a0f2c; --gold:#f5bd52; --on-gold:#14215e;
  --accent:#9fb3ff; --on-accent:#0c1233; --warn:#ffb46b; --warn-bg:#2f2213; --ok:#6fd6a2; --sold:#ff8aa0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;direction:rtl;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
bdi{unicode-bidi:isolate}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
.latin{direction:ltr;unicode-bidi:isolate;font-family:var(--display)}

/* ---------- home ---------- */
.promo{background:var(--navy);color:#fff;text-align:center;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.72rem;letter-spacing:.08em;padding:9px 16px;line-height:1.5}
.promo b{color:var(--gold);font-weight:800}
.brandlogo{display:flex;align-items:center;gap:2px;direction:ltr;color:var(--ink)}
.brandlogo .A{font-family:var(--script);font-size:3.4rem;line-height:.6;margin-right:-10px;transform:translateY(6px)}
.brandlogo .t{display:grid}
.brandlogo .t b{font-family:var(--thin);font-weight:300;font-size:1.15rem;letter-spacing:.32em;line-height:1}
.brandlogo .t small{font-family:var(--thin);font-size:.66rem;letter-spacing:.08em;color:var(--muted);text-align:right;margin-top:3px}
.hero{padding-block:18px 6px;display:grid;gap:14px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:38px;height:38px;border-radius:11px;background:
  radial-gradient(circle at 28% 30%,var(--sun) 0 22%,transparent 23%),
  radial-gradient(circle at 72% 64%,var(--magenta) 0 30%,transparent 31%),
  radial-gradient(circle at 30% 78%,var(--teal) 0 18%,transparent 19%),var(--cobalt);flex:none}
.logo b{display:block;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;line-height:1.05}
.logo small{color:var(--muted);font-size:.8rem}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.82rem;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.pill.ok .dot{background:var(--ok)}
.greet{font-family:var(--body);font-weight:700;font-size:clamp(1.5rem,6.4vw,2.1rem);line-height:1.15;margin:4px 0 0;text-wrap:balance}
.greet em{font-style:normal;color:var(--accent);box-shadow:inset 0 -.32em 0 color-mix(in srgb,var(--gold) 55%,transparent)}
.eyebrow{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.7rem;letter-spacing:.14em;color:var(--muted);direction:ltr;text-align:right}
.searchbox{position:relative}
.searchbox input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:15px 48px 15px 44px;font-size:1.08rem;box-shadow:var(--shadow)}
.searchbox input:focus{border-color:var(--accent);outline:none}
.searchbox svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .clear{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:var(--soft);border-radius:999px;width:30px;height:30px;font-size:1rem;color:var(--muted)}
.themes{display:flex;gap:8px;overflow-x:auto;padding-block:4px 6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.themes::-webkit-scrollbar{display:none}
.theme{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px 8px 12px;font-size:.93rem;font-weight:500}
.theme i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.theme[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 10px}
.sec h2{margin:0;font-size:1rem;font-weight:600}
.sec span{color:var(--muted);font-size:.85rem}
.recent{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent button{flex:none;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 12px 6px 6px;max-width:230px}
.recent .sw{width:36px;height:36px;border-radius:9px;flex:none}
.recent .latin{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-bottom:40px}
.tile{display:grid;gap:8px;border:0;background:none;padding:0;text-align:right}
.art{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.art .badge{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);color:#16171d;font-size:.72rem;font-weight:600;border-radius:999px;padding:3px 9px}
.art .badge.sold{background:rgba(22,23,29,.82);color:#fff}
.tile .tn{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:1rem;line-height:1.2;direction:ltr;text-align:right;min-width:0;overflow-wrap:anywhere}
.tile .tp{font-size:.85rem;color:var(--muted);margin-top:-4px}
.tile .tp b{color:var(--ink);font-family:var(--display);font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
@media (hover:hover){.tile:hover .art{transform:translateY(-2px)}.art{transition:transform .2s}}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--wall);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.dhero{position:relative;padding-block:12px 22px;color:#fff;overflow:hidden}
.dhero .bg{position:absolute;inset:0}
.dhero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,20,.15),rgba(10,10,20,.55))}
.dhero .wrap{position:relative;display:grid;gap:14px}
.navrow{display:flex;justify-content:space-between;align-items:center}
.iconbtn{border:0;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:.92rem;text-decoration:none}
.dtitle{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(1.9rem,8vw,2.8rem);line-height:1;letter-spacing:-.025em;margin:18px 0 0;direction:ltr;text-align:right;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.dtags{display:flex;gap:6px;flex-wrap:wrap}
.dtags span{background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px;font-size:.8rem}
.dbody{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding-block:20px 190px}
.step{display:grid;gap:10px}
.step h3{margin:0;display:flex;align-items:center;gap:8px;font-size:1rem;font-weight:600}
.step h3 .n{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.78rem;font-family:var(--display)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.fcard{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px;text-align:right;display:grid;gap:4px;align-content:start}
.fcard b{font-weight:600;font-size:1rem}
.fcard small{color:var(--muted);font-size:.8rem;line-height:1.35}
.fcard .ic{font-size:1.25rem;line-height:1;margin-bottom:4px}
.fcard[aria-pressed="true"],.schip[aria-pressed="true"],.frame[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.schip{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 13px;display:grid;justify-items:center;gap:1px;min-width:86px}
.schip b{font-family:var(--display);font-weight:600;font-size:1.02rem;direction:ltr;font-variant-numeric:tabular-nums}
.schip small{color:var(--muted);font-size:.74rem;direction:ltr}
.schip.warned{border-style:dashed}
.wallbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:6px}
.wallbox svg{width:100%;height:auto;max-height:220px;display:block}
.wallbox p{margin:0;font-size:.82rem;color:var(--muted);text-align:center}
.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.frame{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 8px;display:grid;justify-items:center;gap:8px;text-align:center}
.frame .fx{width:46px;height:56px;border-radius:2px}
.frame b{font-weight:500;font-size:.88rem;line-height:1.2}
.matrix{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.matrix summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.matrix summary::-webkit-details-marker{display:none}
.matrix summary::after{content:"+";color:var(--muted)}
.matrix[open] summary::after{content:"–"}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 10px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.78rem}
td.sz{text-align:right;direction:ltr;font-family:var(--display);font-weight:600}
td button{border:0;background:none;padding:4px 6px;border-radius:8px;font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
td button.on{background:var(--navy);color:#fff}
td button.w{color:var(--warn);text-decoration:underline dotted}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:11px 13px;font-size:.88rem}
.site{color:var(--accent);font-size:.9rem;text-decoration:none;font-weight:500}

/* price bar */
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(180deg,var(--navy),var(--navy-deep));color:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px -18px rgba(0,0,0,.35);padding-bottom:env(safe-area-inset-bottom,0px)}
.pbar .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding-block:12px 14px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pinfo{flex:1 1 0;min-width:0;overflow:hidden}
.pinfo small{display:block;color:#b9c3ea;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.pval{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:2.3rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.pval s{font-size:.42em;color:#9fabdc;font-weight:600;margin-left:8px}
.pbtns{display:flex;gap:8px;flex:none}
.show{border:0;background:var(--gold);color:var(--on-gold);font-weight:700;border-radius:14px;padding:13px 16px;font-weight:600}
.ghost{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 13px;font-weight:500}
.disc{display:flex;gap:6px;align-items:center;font-size:.82rem;color:#b9c3ea;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.disc::-webkit-scrollbar{display:none}
.disc>*{flex:none}
.pbar .ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.coll{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.66rem;letter-spacing:.1em;color:var(--on-gold);background:var(--gold);border-radius:999px;padding:3px 9px;margin-inline-start:2px;vertical-align:middle}
.disc button{border:1px solid rgba(255,255,255,.28);background:transparent;border-radius:999px;padding:4px 11px;font-size:.8rem;color:#fff}
.disc button[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--navy-deep);font-weight:600}

/* original */
.olabel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.status{display:flex;gap:8px;flex-wrap:wrap}
.status button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:500}
.status button[aria-pressed="true"][data-st="avail"]{background:var(--ok);border-color:var(--ok);color:#fff}
.status button[aria-pressed="true"][data-st="hold"]{background:var(--sun);border-color:var(--sun);color:#16171d}
.status button[aria-pressed="true"][data-st="sold"]{background:var(--sold);border-color:var(--sold);color:#fff}
.field{display:grid;gap:5px}
.field label{font-size:.85rem;color:var(--muted)}
.field input{border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:12px;font-size:1.05rem;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{border:0;background:var(--navy);color:#fff;border-radius:14px;padding:13px 16px;font-weight:600}
.note{font-size:.86rem;color:var(--muted);margin:0}

/* settings */
.sbody{display:grid;gap:20px;padding-block:16px 60px}
.shead{display:flex;justify-content:space-between;align-items:center}
.shead h2{margin:0;font-size:1.4rem}
.back{border:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.panel h3{margin:0;font-size:1rem}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:9px 14px}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.flaglist{display:grid;gap:4px;font-size:.82rem;max-height:240px;overflow:auto;direction:ltr;text-align:right;color:var(--muted)}

/* customer view */
.cust{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 100% 0%,#2a4bb0 0,transparent 60%),linear-gradient(180deg,#1d3a8f,#0a0f2c);color:#f4f4f6;display:grid;place-items:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.cust .cc{width:min(520px,100%);display:grid;gap:18px;direction:ltr;text-align:left}
.cust .strip{height:6px;border-radius:999px}
.cust .who{display:flex;align-items:center;gap:4px;color:#fff}
.cust .who .A{font-family:var(--script);font-size:3rem;line-height:.6}
.cust .who b{font-family:var(--thin);font-weight:300;letter-spacing:.32em;font-size:1.05rem}
.cust .cpill{justify-self:start;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.72rem;letter-spacing:.12em;background:var(--gold);color:#14215e;border-radius:999px;padding:5px 12px}
.cust h2{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(2rem,9vw,3.2rem);line-height:1;margin:0;letter-spacing:-.02em}
.cust dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:1rem}
.cust dt{color:#aab6e6}
.cust dd{margin:0}
.cust .big{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(3.6rem,20vw,6rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cust .big s{display:block;font-size:.3em;color:#aab6e6;font-weight:600}
.cust .close{justify-self:start;border:1px solid rgba(255,255,255,.35);background:none;color:#f4f4f6;border-radius:999px;padding:9px 16px;direction:rtl}
.toast{position:fixed;bottom:calc(170px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--wall);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s cubic-bezier(.2,.8,.2,1)}
  .cust{animation:fade .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>

<div class="promo" id="promo"></div>
<div class="wrap" id="home">
  <section class="hero">
    <div class="topline">
      <div class="brandlogo" aria-label="Albert Levi, A splash of art"><span class="A" aria-hidden="true">A</span><span class="t"><b>Albert Levi</b><small>A splash of art</small></span></div>
      <button class="pill" id="rateBtn" type="button" aria-label="הגדרות שער ועיגול"><span class="dot"></span><bdi dir="ltr">$1 = ₪<span id="rateTxt">3.70</span></bdi><span aria-hidden="true">⚙︎</span></button>
    </div>
    <div class="eyebrow">USA TOUR · PRICE GUIDE</div>
    <h1 class="greet" style="margin-top:-6px">על איזו יצירה <em>הלקוח שואל?</em></h1>
    <div class="searchbox">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="שם היצירה, למשל Freedom" autocomplete="off" aria-label="חיפוש יצירה">
      <button class="clear" id="clearQ" type="button" aria-label="ניקוי החיפוש" hidden>✕</button>
    </div>
    <div class="themes" id="themes"></div>
  </section>
  <div id="recentWrap" hidden><div class="sec"><h2>נצפו לאחרונה</h2></div><div class="recent" id="recent"></div></div>
  <div class="sec"><h2 id="gridTitle">כל היצירות</h2><span id="count"></span></div>
  <div class="grid" id="grid"></div>
</div>

<section class="sheet" id="detail" hidden aria-label="תמחור יצירה"></section>
<div class="pbar" id="pbar" hidden></div>
<section class="sheet" id="settings" hidden aria-label="הגדרות"></section>

const ORDER=Object.keys(PAL);
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
ART.forEach(a=>{
  a.id=a.k.replace(/[^a-z0-9]+/g,'-');
  const h=hash(a.k);let cs=null;for(const [re,c] of KEY)if(re.test(a.k)){cs=c;break}

  const gid='g'+a.id;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="הדמיה: היצירה בגודל ${sz(s,'cm')} מעל ספה ברוחב 210 ס״מ">
  <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a.c[0]}"/><stop offset=".55" stop-color="${a.c[1]}"/><stop offset="1" stop-color="${a.c[2]}"/></linearGradient></defs>
  <rect x="0" y="0" width="${W}" height="${H}" fill="var(--soft)"/>
  <rect x="0" y="${H-4}" width="${W}" height="4" fill="var(--line)"/>
  <g fill="var(--muted)" opacity=".55"><rect x="${sx}" y="${H-sofaH}" width="210" height="45" rx="10"/><rect x="${sx-8}" y="${H-sofaH+20}" width="226" height="50" rx="12"/><rect x="${sx+8}" y="${H-15}" width="6" height="15"/><rect x="${sx+196}" y="${H-15}" width="6" height="15"/></g>
  <g fill="var(--muted)" opacity=".35"><circle cx="${W-24}" cy="${H-160}" r="11"/><rect x="${W-36}" y="${H-147}" width="24" height="147" rx="11"/></g>
  <rect x="${ax}" y="${ay}" width="${w}" height="${h}" fill="url(#${gid})" ${fs!=='none'?`stroke="${fs}" stroke-width="${Math.max(3,Math.min(w,h)*.04)}"`:''} ${frame==='rolled'?'stroke="var(--ink)" stroke-dasharray="4 3" stroke-width="1.2"':''}/>
  <text x="${W/2}" y="${ay-8}" text-anchor="middle" font-size="${Math.max(11,W/26)}" fill="var(--ink)" font-family="Archivo, sans-serif" font-weight="700" style="direction:ltr;unicode-bidi:plaintext">${sz(s,'in')} · ${sz(s,'cm')}</text>
  </svg>`}

function renderDetail(){
  const a=cur,u=S.unit,fs=fmts(a);
  const tags=[];if(a.T.has('tree'))tags.push('עץ החיים');if(a.T.has('jw'))tags.push('ישראל ויהדות');if(a.T.has('an'))tags.push('חיות וטבע');if(a.T.has('mv'))tags.push('תנועה');
  let h=`<header class="dhero"><div class="bg" style="background:${artBg(a,135)}"></div><div class="wrap">
    <div class="navrow"><button class="iconbtn" type="button" data-act="back">→ חזרה</button>${a.h?`<a class="iconbtn" href="https://www.albertlevi.com/products/${esc(a.h)}" target="_blank" rel="noopener">באתר ↗</a>`:''}</div>
    <h2 class="dtitle">${esc(a.n)}</h2>${tags.length?`<div class="dtags">${tags.map(t=>`<span>${t}</span>`).join('')}</div>`:''}</div></header>
  <div class="wrap dbody">
  <div class="step"><h3><span class="n">1</span>מה הלקוח רוצה?</h3><div class="cards">${fs.map(f=>`<button class="fcard" type="button" data-fmt="${f}" aria-pressed="${sel.fmt===f}"><span class="ic" aria-hidden="true">${FMT[f].ic}</span><b>${FMT[f].he}</b><small>${FMT[f].d}</small></button>`).join('')}</div></div>`;
  if(sel.fmt==='orig'){h+=origHTML(a);$('pbar').hidden=!orig(a).price}
  else{
    const F=a.f[sel.fmt],ss=Object.keys(F).sort((x,y)=>area(x)-area(y)),fr=F[sel.size],o=fr[sel.frame];
    h+=`<div class="step"><h3><span class="n">2</span>איזה גודל?</h3><div class="sizes">${ss.map(s=>`<button class="schip${Object.values(F[s]).every(x=>x.w)?' warned':''}" type="button" data-size="${s}" aria-pressed="${sel.size===s}"><b>${sz(s,u)}</b><small>${sz(s,u==='cm'?'in':'cm')}</small></button>`).join('')}</div>
      <div class="wallbox">${wallSVG(a,sel.size,sel.frame)}<p>כך זה ייראה מעל ספה ברוחב 2.1 מטר</p></div></div>
    <div class="step"><h3><span class="n">3</span>מסגרת וגימור</h3><div class="frames">${FRAME_ORDER.filter(f=>fr[f]).map(f=>`<button class="frame" type="button" data-frame="${f}" aria-pressed="${sel.frame===f}"><span class="fx" style="${FRAME[f].fx}"></span><b>${FRAME[f].he}</b></button>`).join('')}</div></div>
    ${o.w?`<div class="warn"><b>כדאי לבדוק לפני שאומרים ללקוח.</b> ${esc(o.w)}. זה המחיר שמופיע באתר (${ilsf(o.p)}), ונראה שיש בו טעות.</div>`:''}
    ${matrixHTML(a)}`;
    $('pbar').hidden=false;
  }
  h+=`</div>`;
  $('detail').innerHTML=h;renderBar();
}
function matrixHTML(a){const F=a.f[sel.fmt],ss=Object.keys(F).sort((x,y)=>area(x)-area(y));const cols=FRAME_ORDER.filter(f=>ss.some(s=>F[s][f]));
  return `<details class="matrix" id="mx"${ls('alp_mx')?' open':''}><summary>כל המחירים של ${FMT[sel.fmt].he} (לפני הנחה)</summary><div class="tscroll"><table><thead><tr><th>גודל</th>${cols.map(c=>`<th>${FRAME[c].he}</th>`).join('')}</tr></thead><tbody>${ss.map(s=>`<tr><td class="sz">${sz(s,S.unit)}</td>${cols.map(c=>{const o=F[s][c];return `<td>${o?`<button type="button" class="${s===sel.size&&c===sel.frame?'on':''}${o.w?' w':''}" data-cell="${s}|${c}">${$f(usd(o.p))}</button>`:'–'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></details>`}
function origHTML(a){const o=orig(a);
  return `<div class="step"><h3><span class="n">2</span>פרטי המקור</h3><div class="olabel">
    <div class="status">${Object.entries(ST).map(([k,v])=>`<button type="button" data-st="${k}" aria-pressed="${o.status===k}"${canWrite?'':' disabled'}>${v}</button>`).join('')}</div>
    <div class="row2"><div class="field"><label for="oPrice">מחיר בדולרים</label><input id="oPrice" inputmode="numeric" value="${o.price||''}" placeholder="למשל 4500"></div>
    <div class="field"><label for="oSize">מידה</label><input id="oSize" value="${esc(o.size||'')}" placeholder="40″×60″"></div></div>
    <button class="primary" type="button" data-act="saveOrig"${canWrite?'':' disabled'}>שמירת המחיר</button>
    <p class="note">באתר אין מחיר למקורים. מזינים פעם אחת, וזה מתעדכן אצל כל מי שהאפליקציה משותפת איתו.</p></div></div>`}

function collPct(list){return !S.coll?0:list>500?20:list>300?15:10}
function curPrice(){if(sel.fmt==='orig'){const o=orig(cur);if(!o.price)return null;const pct=disc==='auto'?0:disc;return {base:o.price,pct,coll:false,fin:pct?Math.round(o.price*(1-pct/100)):o.price}}
  const o=cur.f[sel.fmt][sel.size][sel.frame];const base=usd(o.p);const auto=disc==='auto';const pct=auto?collPct(base):disc;
  return {base,pct,coll:auto&&pct>0,fin:pct?usd(o.p*(1-pct/100)):base}}
function specEN(){if(sel.fmt==='orig'){const o=orig(cur);return 'Original painting'+(o.size?' · '+o.size:'')}return `${FMT[sel.fmt].en} · ${sz(sel.size,'in')} · ${FRAME[sel.frame].en}`}
function renderBar(){const p=curPrice();if(!p){$('pbar').hidden=true;return}
  $('pbar').innerHTML=`<div class="wrap"><div class="prow"><div class="pinfo"><small>${esc(specEN())}${sel.fmt!=='orig'?' · ₪'+Math.round(cur.f[sel.fmt][sel.size][sel.frame].p).toLocaleString('en-US'):''}</small><div class="pval">${$f(p.fin)}${p.pct?`<s>${$f(p.base)}</s>`:''}</div></div>
  <div class="pbtns"><button class="ghost" type="button" data-act="copy" aria-label="העתקה">העתקה</button><button class="show" type="button" data-act="cust">הצג ללקוח</button></div></div>
  <div class="disc">${p.coll?`<span class="coll">COLLECTOR'S RATE −${p.pct}%</span>`:'הנחה:'}${(S.coll&&sel.fmt!=='orig'?['auto']:[]).concat([0,10,15,20]).map(d=>`<button type="button" data-disc="${d}" aria-pressed="${disc===d||(d===0&&disc==='auto'&&(sel.fmt==='orig'||!S.coll))}">${d==='auto'?'אוטומטי':d?d+'%':'בלי'}</button>`).join('')}</div></div>`}

$('detail').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='back')return back();
  if(b.dataset.act==='saveOrig')return saveOrig();
  if(b.dataset.fmt){sel.fmt=b.dataset.fmt;disc='auto';defaults()}
  else if(b.dataset.size){sel.size=b.dataset.size;defaults()}
  else if(b.dataset.frame)sel.frame=b.dataset.frame;
  else if(b.dataset.cell){const [s,f]=b.dataset.cell.split('|');sel.size=s;sel.frame=f}
  else if(b.dataset.st){if(!ORIG[cur.id])ORIG[cur.id]={};const o=orig(cur);saveOrigRec(Object.assign({},o,{status:b.dataset.st}))}
  else return;
  const y=$('detail').scrollTop;renderDetail();$('detail').scrollTop=y});
$('detail').addEventListener('toggle',e=>{if(e.target.id==='mx')ls('alp_mx',e.target.open)},true);
$('pbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.disc!==undefined){disc=b.dataset.disc==='auto'?'auto':+b.dataset.disc;renderBar();return}
  if(b.dataset.act==='copy')return copyQ();
  if(b.dataset.act==='cust')return showCust()});
function quote(){const p=curPrice();return `${cur.n} — ${specEN().replace(/ · /g,', ')}${sel.fmt!=='orig'?' ('+sz(sel.size,'cm')+')':''} — ${p.pct?$f(p.fin)+' (was '+$f(p.base)+(p.coll?", Collector's Rate "+p.pct+'% off':', '+p.pct+'% off')+')':$f(p.fin)}`}
function copyQ(){const t=quote();try{navigator.clipboard.writeText(t).then(()=>toast('הועתק, אפשר להדביק ללקוח'),()=>toast(t))}catch(e){toast(t)}}
function showCust(){const p=curPrice();
  const rows=sel.fmt==='orig'?[['Edition','Original painting · one of a kind'],...(orig(cur).size?[['Size',orig(cur).size]]:[])]:[['Edition',FMT[sel.fmt].en],['Size',`${sz(sel.size,'in')}  (${sz(sel.size,'cm')})`],['Finish',FRAME[sel.frame].en]];
  $('cust').innerHTML=`<div class="cc"><div class="who"><span class="A">A</span><b>Albert Levi</b></div><div class="strip" style="background:linear-gradient(90deg,${cur.c.join(',')})"></div>${p.coll?`<span class="cpill">THE COLLECTOR'S RATE · ${p.pct}% OFF</span>`:''}<h2>${esc(cur.n)}</h2>
  <dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><div class="big">${p.pct?`<s>${$f(p.base)}</s>`:''}${$f(p.fin)}</div><button class="close" type="button" data-act="x">סגירה ←</button></div>`;
  $('cust').hidden=false;history.pushState({d:1,c:1},'')}
$('cust').addEventListener('click',()=>back());

async function saveOrig(){const p=parseInt(($('oPrice').value||'').replace(/[^\d]/g,''),10)||null;saveOrigRec(Object.assign({},orig(cur),{price:p,size:$('oSize').value.trim()}))}
async function saveOrigRec(o){const rec={price:o.price||null,size:o.size||'',status:o.status,updated:Date.now()};ORIG[cur.id]=rec;
  if(db){try{await db.doc('originals/'+cur.id).set(rec);toast('נשמר אצל כולם')}catch(err){if(err&&err.code==='invalid_argument'){canWrite=false;toast('אין לך הרשאה לשמור')}else toast('השמירה לא הצליחה, נסו שוב')}}
  else{ls('alp_orig',ORIG);toast('נשמר במכשיר הזה')}
  renderDetail()}

/* --- settings --- */
$('rateBtn').addEventListener('click',()=>{$('settings').hidden=false;renderSettings();history.pushState({d:1},'')});
function flags(){const out=[];for(const a of ART)for(const f in a.f)for(const s in a.f[f])for(const r in a.f[f][s]){const o=a.f[f][s][r];if(o.w)out.push(`${a.n} · ${FMT[f].en} · ${s.replace('x','×')} cm · ${FRAME[r].en} · ₪${o.p}`)}return out}
function renderSettings(){const fl=flags();
  $('settings').innerHTML=`<div class="wrap sbody"><div class="shead"><h2>הגדרות</h2><button class="back" type="button" data-act="back">סיום</button></div>
  <div class="panel"><h3>שער הדולר</h3><p class="note">המחירים באתר שמורים בשקלים, והאפליקציה ממירה אותם לדולרים. ${S.verified?'<b style="color:var(--ok)">השער אומת מול האתר.</b>':'<b style="color:var(--warn)">השער עוד לא אומת. כדאי לעשות כיול למטה.</b>'}</p>
    <div class="field"><label for="sRate">כמה שקלים שווה דולר אחד</label><input id="sRate" inputmode="decimal" value="${S.rate}"></div></div>
  <div class="panel"><h3>כיול מהיר מול האתר בארה״ב</h3><p class="note">בוחרים יצירה אחת. רושמים את המחיר בדולרים מהאתר האמריקאי ואת המחיר בשקלים של אותה מידה ומסגרת (הוא מופיע בשורה הקטנה מעל המחיר, בפס התחתון). השער יחושב לבד.</p>
    <div class="row2"><div class="field"><label for="cIls">מחיר בשקלים</label><input id="cIls" inputmode="decimal" placeholder="1059"></div><div class="field"><label for="cUsd">מחיר בדולרים</label><input id="cUsd" inputmode="decimal" placeholder="289"></div></div>
    <button class="ghost" type="button" data-act="calib">חישוב השער</button></div>
  <div class="panel"><h3>עיגול המחיר ללקוח</h3><div class="seg">${[['none','לדולר הקרוב'],['5','ל־5$'],['10','ל־10$'],['9','מסתיים ב־9']].map(([k,v])=>`<button type="button" data-round="${k}" aria-pressed="${S.round===k}">${v}</button>`).join('')}</div></div>
  <div class="panel"><h3>The Collector's Rate</h3><p class="note">ההנחה מהאתר: עד $300 מקבלים 10%, מעל $300 מקבלים 15%, ומעל $500 מקבלים 20%. כשהיא פעילה, האפליקציה מחשבת אותה אוטומטית על הדפסים. על מקורים היא לא חלה.</p><div class="seg">${[[true,'פעילה'],[false,'כבויה']].map(([k,v])=>`<button type="button" data-coll="${k}" aria-pressed="${S.coll===k}">${v}</button>`).join('')}</div></div>
  <div class="panel"><h3>מידות</h3><div class="seg">${[['in','אינצ׳ים קודם'],['cm','סנטימטרים קודם']].map(([k,v])=>`<button type="button" data-unit="${k}" aria-pressed="${S.unit===k}">${v}</button>`).join('')}</div></div>
  <button class="primary" type="button" data-act="saveS"${canWrite?'':' disabled'}>שמירה ${db?'אצל כולם':'במכשיר'}</button>
  <div class="panel"><h3>מחירים חשודים באתר (${fl.length})</h3><p class="note">מחירים שמופיעים כך באתר ונראים כמו טעות, למשל מידה גדולה שזולה ממידה קטנה. כדאי לתקן אותם בחנות.</p><div class="flaglist">${fl.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div></div>`}
$('settings').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='back')return back();
  if(b.dataset.round){readRate();S.round=b.dataset.round;return renderSettings()}
  if(b.dataset.unit){readRate();S.unit=b.dataset.unit;return renderSettings()}
  if(b.dataset.coll){readRate();S.coll=b.dataset.coll==='true';return renderSettings()}
  if(b.dataset.act==='calib'){const i=parseFloat($('cIls').value),u=parseFloat($('cUsd').value);if(i>0&&u>0){S.rate=Math.round(i/u*100)/100;S.verified=true;renderSettings();toast('השער: '+S.rate+'. לחצו שמירה')}else toast('צריך למלא את שני המחירים');return}
  if(b.dataset.act==='saveS'){readRate();const rec={rate:S.rate,round:S.round,unit:S.unit,verified:!!S.verified,coll:!!S.coll,updated:Date.now()};
    if(db){try{await db.doc('settings/main').set(rec);toast('נשמר אצל כולם')}catch(err){toast(err&&err.code==='invalid_argument'?'אין לך הרשאה לשמור':'השמירה לא הצליחה, נסו שוב')}}else{ls('alp_settings',rec);toast('נשמר במכשיר הזה')}
    renderHome()}});
function readRate(){const el=$('sRate');if(!el)return;const r=parseFloat(el.value);if(r>1&&r<10){if(r!==S.rate)S.verified=false;S.rate=r}}

/* --- boot --- */
const s0=ls('alp_settings');if(s0)Object.assign(S,s0);const o0=ls('alp_orig');if(o0)ORIG=o0;
renderHome();
(async()=>{if(!window.claude||!window.claude.use)return;
  try{db=await window.claude.use('db')}catch(e){db=null}if(!db)return;
  try{const user=await window.claude.use('user');if(user&&(await user.can('data.write'))===false)canWrite=false}catch(e){}
  db.doc('settings/main').onSnapshot(s=>{if(s.exists){Object.assign(S,s.data());renderHome();if(!$('detail').hidden)renderDetail();if(!$('settings').hidden)renderSettings()}},()=>{});
  db.collection('originals').onSnapshot(q=>{ORIG={};q.docs.forEach(d=>ORIG[d.id]=d.data());renderHome();if(!$('detail').hidden&&sel.fmt==='orig')renderDetail()},()=>{});
})();
})();
</script>
