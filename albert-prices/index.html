<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

</head><body><title>מחירון אלברט לוי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Archivo:wdth,wght@100..125,500..900&family=Josefin+Sans:wght@300;400&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: a pocket price guide — tour pieces first, every work opens as one "ID card" with all sizes and finishes priced at once; the chosen price and the package live in a navy bar pinned to the bottom. */
:root{
  --wall:#f3f5fb; --card:#ffffff; --ink:#121a3d; --muted:#5f6789; --line:#dfe4f2; --soft:#e9edf8;
  --navy:#1d3a8f; --navy-deep:#14215e; --gold:#f2b33d; --on-gold:#14215e;
  --cobalt:#2f4be0; --magenta:#e0337a; --sun:#f5b70a; --teal:#11a198; --tang:#f26b2a;
  --accent:var(--navy); --sel-bg:#1d3a8f; --sel-fg:#ffffff;
  --warn:#a8510b; --warn-bg:#fff2df; --ok:#1d7a4c; --sold:#b02142;
  --display:"Archivo","Rubik",system-ui,sans-serif;
  --script:"Mrs Saint Delafield",cursive; --thin:"Josefin Sans","Rubik",sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(20,30,80,.06),0 10px 26px -14px rgba(20,30,80,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#0c1233; --card:#151d47; --ink:#eef1fb; --muted:#9aa3c8; --line:#26306a; --soft:#1c2557;
  --navy:#1d3a8f; --navy-deep:#0a0f2c; --gold:#f5bd52; --on-gold:#14215e;
  --accent:#9fb3ff; --sel-bg:#f5bd52; --sel-fg:#14215e; --warn:#ffb46b; --warn-bg:#2f2213; --ok:#6fd6a2; --sold:#ff8aa0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#0c1233; --card:#151d47; --ink:#eef1fb; --muted:#9aa3c8; --line:#26306a; --soft:#1c2557;
  --navy:#1d3a8f; --navy-deep:#0a0f2c; --gold:#f5bd52; --on-gold:#14215e;
  --accent:#9fb3ff; --sel-bg:#f5bd52; --sel-fg:#14215e; --warn:#ffb46b; --warn-bg:#2f2213; --ok:#6fd6a2; --sold:#ff8aa0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;direction:rtl;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
bdi{unicode-bidi:isolate}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* home */
.promo{background:var(--navy);color:#fff;text-align:center;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.7rem;letter-spacing:.08em;padding:9px 16px;line-height:1.5;direction:ltr}
.promo b{color:var(--gold)}
.hero{padding-block:14px 4px;display:grid;gap:12px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brandlogo{display:flex;align-items:center;direction:ltr;color:var(--ink)}
.brandlogo .A{font-family:var(--script);font-size:3.4rem;line-height:.6;margin-right:-10px;transform:translateY(6px)}
.brandlogo .t{display:grid}
.brandlogo .t b{font-family:var(--thin);font-weight:300;font-size:1.15rem;letter-spacing:.32em;line-height:1}
.brandlogo .t small{font-family:var(--thin);font-size:.66rem;letter-spacing:.08em;color:var(--muted);text-align:right;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.8rem;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.pill.ok .dot{background:var(--ok)}
.eyebrow{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.68rem;letter-spacing:.14em;color:var(--muted);direction:ltr;text-align:right}
.greet{font-weight:700;font-size:clamp(1.45rem,6.2vw,2rem);line-height:1.15;margin:-6px 0 0;text-wrap:balance}
.greet em{font-style:normal;color:var(--accent);box-shadow:inset 0 -.32em 0 color-mix(in srgb,var(--gold) 55%,transparent)}
.searchbox{position:relative}
.searchbox input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px 46px 14px 44px;font-size:1.05rem;box-shadow:var(--shadow)}
.searchbox input:focus{border-color:var(--accent);outline:none}
.searchbox svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .clear{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:var(--soft);border-radius:999px;width:30px;height:30px;color:var(--muted)}
.themes{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.themes::-webkit-scrollbar{display:none}
.theme{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px 8px 12px;font-size:.92rem;font-weight:500}
.theme i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.theme[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px;gap:10px}
.sec h2{margin:0;font-size:1rem;font-weight:600}
.sec span{color:var(--muted);font-size:.85rem}
.tourrow{display:flex;gap:12px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-bottom:6px;scrollbar-width:none}
.tourrow::-webkit-scrollbar{display:none}
.tourrow .tile{flex:none;width:132px}
.tourempty{border:1.5px dashed var(--line);border-radius:16px;padding:14px;color:var(--muted);font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-bottom:110px}
.tile{display:grid;gap:7px;border:0;background:none;padding:0;text-align:right;align-content:start}
.art{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.art .badge{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.93);color:#14215e;font-size:.7rem;font-weight:600;border-radius:999px;padding:3px 9px}
.art .badge.sold{background:rgba(20,33,94,.85);color:#fff}
.art .star{position:absolute;bottom:8px;left:8px;background:var(--gold);color:#14215e;font-size:.7rem;font-weight:700;border-radius:999px;padding:3px 8px}
.tile .tn{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:.98rem;line-height:1.2;direction:ltr;text-align:right;overflow-wrap:anywhere}
.tile .tp{font-size:.82rem;color:var(--muted);margin-top:-3px}
.tile .tp b{color:var(--ink);font-family:var(--display);font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--wall);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.dhero{position:relative;padding-block:12px 18px;color:#fff;overflow:hidden}
.dhero .bg{position:absolute;inset:0}
.dhero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,44,.15),rgba(10,15,44,.62))}
.dhero .wrap{position:relative;display:grid;gap:12px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.navrow .r{display:flex;gap:8px}
.iconbtn{border:0;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:.9rem;text-decoration:none}
.iconbtn[aria-pressed="true"]{background:var(--gold);color:#14215e}
.dtitle{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(1.8rem,8vw,2.7rem);line-height:1;letter-spacing:-.02em;margin:10px 0 0;direction:ltr;text-align:right;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(255,255,255,.16);border-radius:16px;padding:5px}
.kind button{border:0;background:none;color:#fff;border-radius:12px;padding:10px;font-weight:600}
.kind button[aria-pressed="true"]{background:#fff;color:#14215e}
.kind button:disabled{opacity:.45}
.dbody{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-block:18px 220px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pcard header{padding:14px 16px 10px;display:grid;gap:2px}
.pcard header b{font-size:1.02rem}
.pcard header small{color:var(--muted);font-size:.82rem}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:6px 8px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.74rem;padding-block:8px}
td.sz{text-align:right;padding-inline-start:16px}
td.sz b{display:block;font-family:var(--display);font-weight:700;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
td.sz small{display:block;color:var(--muted);font-size:.72rem;direction:ltr;text-align:right}
td button{border:1.5px solid transparent;background:var(--soft);padding:8px 10px;border-radius:10px;font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;min-width:70px}
td button.on{background:var(--sel-bg);color:var(--sel-fg)}
td button.w{border-color:var(--warn);border-style:dashed;color:var(--warn)}
td.na{color:var(--muted)}
.custom{border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;gap:10px;background:color-mix(in srgb,var(--soft) 50%,transparent)}
.custom .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.custom label{font-size:.85rem;font-weight:600}
.custom input{width:72px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px;text-align:center;direction:ltr}
.custom .res{display:flex;gap:8px;flex-wrap:wrap}
.custom .res button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:.85rem}
.custom .res button.on{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.custom .res b{font-family:var(--display)}
.note{font-size:.84rem;color:var(--muted);margin:0}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 13px;font-size:.86rem}
.wallbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:grid;gap:4px}
.wallbox svg{width:100%;height:auto;max-height:170px;display:block}
.wallbox p{margin:0;font-size:.78rem;color:var(--muted);text-align:center}

/* originals */
.ocard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px}
.ocard h4{margin:0;font-size:.85rem;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:8px 12px;display:grid;gap:1px;text-align:center}
.chips button small{font-size:.7rem;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.chips button[aria-pressed="true"] small{color:inherit;opacity:.8}
.chips.st button[aria-pressed="true"][data-st="avail"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chips.st button[aria-pressed="true"][data-st="hold"]{background:var(--sun);border-color:var(--sun);color:#14215e}
.chips.st button[aria-pressed="true"][data-st="sold"]{background:var(--sold);border-color:var(--sold);color:#fff}
.obig{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:2.6rem;line-height:1;direction:ltr;text-align:right}
.field{display:grid;gap:5px}
.field label{font-size:.84rem;color:var(--muted)}
.field input{border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:11px;font-size:1rem;width:100%}

/* bottom bar */
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(180deg,var(--navy),var(--navy-deep));color:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px -18px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom,0px)}
.pbar .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;padding-block:12px 12px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pinfo{flex:1 1 0;min-width:0;overflow:hidden}
.pinfo small{display:block;color:#b9c3ea;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.pval{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:2.15rem;line-height:1;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.pval s{font-size:.42em;color:#9fabdc;font-weight:600;margin-left:8px}
.pbtns{display:flex;gap:8px;flex:none}
.gold{border:0;background:var(--gold);color:#14215e;border-radius:14px;padding:12px 14px;font-weight:700}
.line{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:14px;padding:11px 12px;font-weight:500}
.disc{display:flex;gap:6px;align-items:center;font-size:.8rem;color:#b9c3ea;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.disc::-webkit-scrollbar{display:none}
.disc>*{flex:none}
.disc button{border:1px solid rgba(255,255,255,.28);background:transparent;border-radius:999px;padding:4px 11px;font-size:.8rem;color:#fff}
.disc button[aria-pressed="true"]{background:#fff;border-color:#fff;color:#14215e;font-weight:600}
.coll{display:inline-flex;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.64rem;letter-spacing:.1em;color:#14215e;background:var(--gold);border-radius:999px;padding:3px 9px}
.pkgfab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:22;border:0;background:var(--navy);color:#fff;border-radius:999px;padding:12px 16px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.pkgfab b{background:var(--gold);color:#14215e;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}

/* package + settings */
.sbody{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 60px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead h2{margin:0;font-size:1.35rem}
.back{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.panel h3{margin:0;font-size:1rem}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:9px 13px}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.items{display:grid;gap:0}
.item{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-family:var(--display);font-weight:700;direction:ltr;text-align:right}
.item small{grid-column:1;color:var(--muted);font-size:.78rem;direction:ltr;text-align:right}
.item .pr{grid-row:1/3;grid-column:2;text-align:left;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.item .pr s{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
.item .x{grid-row:1/3;grid-column:3;border:0;background:var(--soft);border-radius:999px;width:30px;height:30px;color:var(--muted)}
.totals{display:grid;gap:4px;font-size:.92rem}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:2rem;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.tiers{overflow-x:auto}
.tiers table td,.tiers table th{border-top:1px solid var(--line);padding:6px}
.tiers input{width:84px;border:1.5px solid var(--line);background:var(--wall);border-radius:10px;padding:8px;text-align:center;direction:ltr}
textarea{width:100%;min-height:80px;border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:10px;font:inherit;font-size:.8rem;direction:ltr;color:inherit}
.primary{border:0;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;font-weight:600}
.ghost{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font-weight:500;color:var(--ink)}
.flaglist{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}

/* customer */
.cust{position:fixed;inset:0;z-index:50;overflow-y:auto;background:radial-gradient(120% 80% at 100% 0%,#2a4bb0 0,transparent 60%),linear-gradient(180deg,#1d3a8f,#0a0f2c);color:#f4f4f6;display:grid;place-items:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.cust .cc{width:min(520px,100%);display:grid;gap:16px;direction:ltr;text-align:left}
.cust .who{display:flex;align-items:center;gap:4px}
.cust .who .A{font-family:var(--script);font-size:3rem;line-height:.6}
.cust .who b{font-family:var(--thin);font-weight:300;letter-spacing:.32em;font-size:1.05rem}
.cust .strip{height:6px;border-radius:999px}
.cust .cpill{justify-self:start;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.7rem;letter-spacing:.12em;background:var(--gold);color:#14215e;border-radius:999px;padding:5px 12px}
.cust h2{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(1.9rem,9vw,3rem);line-height:1;margin:0}
.cust dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.cust dt{color:#aab6e6}.cust dd{margin:0}
.cust .lines{display:grid;gap:8px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.cust .lines div{display:flex;justify-content:space-between;gap:12px}
.cust .lines span:last-child{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cust .big{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(3.4rem,19vw,5.8rem);line-height:1;font-variant-numeric:tabular-nums}
.cust .big s{display:block;font-size:.3em;color:#aab6e6;font-weight:600}
.cust .close{justify-self:start;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:999px;padding:9px 16px;direction:rtl}
.toast{position:fixed;bottom:calc(180px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--wall);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s cubic-bezier(.2,.8,.2,1)}.cust{animation:fade .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>

<div class="promo" id="promo"></div>
<div class="wrap" id="home">
  <section class="hero">
    <div class="topline">
      <div class="brandlogo" aria-label="Albert Levi, A splash of art"><span class="A" aria-hidden="true">A</span><span class="t"><b>Albert Levi</b><small>A splash of art</small></span></div>

<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const STD=D.std, ART=D.art;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LSK='alp3';
function load(){try{return JSON.parse(localStorage.getItem(LSK))||{}}catch(e){return {}}}
function persist(){try{localStorage.setItem(LSK,JSON.stringify({S,ORIG,T,tour,pkg}))}catch(e){}}

/* ---------- palette per work (decorative) ---------- */
const PAL={cobalt:'#2f4be0',magenta:'#e0337a',sun:'#f5b70a',teal:'#11a198',tang:'#f26b2a',violet:'#7b3fe4',pink:'#ff7eb6',sky:'#41b6ff',leaf:'#3fae5a',earth:'#a8683a',sand:'#e8c48a',navy:'#1b2a6b',ruby:'#c81d3f',lime:'#b6e33b',ink:'#20212b',gold:'#d9a21b',coral:'#ff6f61',mint:'#7ee0c3'};
const KEY=[[/blue|sky|ocean|wave/,['cobalt','sky','teal']],[/pink/,['pink','magenta','sun']],[/purple|tranquil/,['violet','pink','sky']],[/turquoise/,['teal','mint','cobalt']],[/earth|natural|deer|forest/,['earth','leaf','sand']],[/midnight|silent|silence|monochrome|black/,['navy','ink','sky']],[/glow/,['lime','violet','navy']],[/fiery|fire|explos|burst|roar|lion/,['tang','ruby','sun']],[/love|heart/,['ruby','pink','sun']],[/tropical|frog|koi/,['leaf','tang','sky']],[/gold|light|hope|star|chanuka|hanukkah/,['gold','sun','navy']],[/jerusalem|israel|yisrael|hamsa|shield/,['cobalt','gold','sky']],[/peacock|butterfly|wings|wing|flight/,['teal','violet','sun']],[/elephant|power|stride|strong/,['magenta','cobalt','sun']],[/colorful|color|happiness|bouquet|joy|dance/,['magenta','sun','teal']]];
const ORDER=Object.keys(PAL);
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
ART.forEach(a=>{a.id=a.k.replace(/[^a-z0-9]+/g,'-');const h=hash(a.k);let cs=null;for(const [re,c] of KEY)if(re.test(a.k)){cs=c;break}
  if(!cs)cs=[ORDER[h%7],ORDER[(h>>>3)%ORDER.length],ORDER[(h>>>7)%5]];a.c=cs.map(x=>PAL[x]);a.h1=h;
  const t=new Set(a.t||[]),k=a.k;
  if(/tree of (life|happi)/.test(k))t.add('tree');
  if(/israel|yisrael|jerusalem|hamsa|judah|chanuka|rabbi|shield|nova|together we|proud of us|strong together|peace will|map of/.test(k))t.add('jw');
  if(/elephant|deer|peacock|koi|lion|butterfly|frog|wing|flight|stride|majest|roar|jump|aviation|bird/.test(k))t.add('an');
  a.T=t});
function artBg(a,deg){const [c1,c2,c3]=a.c,h=a.h1;const x1=20+h%50,y1=15+(h>>>4)%40,x2=40+(h>>>8)%50,y2=50+(h>>>12)%40,x3=(h>>>16)%90,y3=(h>>>20)%90;
  return `radial-gradient(circle at ${x1}% ${y1}%,${c2} 0 18%,transparent 19%),radial-gradient(circle at ${x3}% ${y3}%,#ffffff 0 5%,transparent 5.5%),radial-gradient(ellipse at ${x2}% ${y2}%,${c3} 0 26%,transparent 27%),radial-gradient(circle at ${100-x1}% ${100-y2}%,${c2}99 0 30%,transparent 31%),linear-gradient(${deg||(h%360)}deg,${c1},${c3})`}

/* ---------- vocab ---------- */
const FMT={canvas:{he:'הדפס על קנבס',en:'Canvas print',d:'הדפס על קנבס. המחיר זהה לכל היצירות לפי גודל וגימור'},emb:{he:'Embellished Edition',en:'Embellished Edition',d:'הדפס שאלברט מוסיף עליו עבודת יד. נשלח מגולגל'},float:{he:'מסגרת צפה',en:'Floating framed canvas',d:'מחירים מיוחדים ליצירה הזאת'}};
const FR={stretch:{he:'מתוח',en:'Stretched canvas'},black:{he:'מסגרת שחורה',en:'Black frame'},white:{he:'מסגרת לבנה',en:'White frame'},rolled:{he:'מגולגל',en:'Rolled canvas'},espresso:{he:'אספרסו',en:'Espresso frame'},natural:{he:'עץ טבעי',en:'Natural frame'}};
const FRO=['stretch','black','white','rolled','espresso','natural'];
const SC=[['S','קטן','עד 60 ס״מ'],['M','בינוני','עד 100 ס״מ'],['L','גדול','עד 150 ס״מ'],['XL','ענק','מעל 150 ס״מ']];
const CX=[['1','רגילה'],['2','מורכבת'],['3','מורכבת מאוד']];
const ST={avail:'זמין',hold:'שמור ללקוח',sold:'נמכר'};
const THEMES=[['all','הכול','var(--ink)'],['tree','עץ החיים','var(--teal)'],['jw','ישראל ויהדות','var(--cobalt)'],['an','חיות וטבע','var(--tang)'],['emb','Embellished','var(--sun)'],['orig','מקורים','#7b3fe4']];

/* ---------- state ---------- */
const L=load();
let S=Object.assign({rate:3.7,round:'5',unit:'in',verified:false,coll:true,second:25},L.S||{});
let ORIG=L.ORIG||{}, T=L.T||{}, tour=L.tour||[], pkg=L.pkg||[];
let theme='all',cur=null,kind='print',sel=null,disc='auto',custom={w:'',h:''};

/* ---------- pricing ---------- */
const dims=s=>s.split('x').map(Number);
const keyOf=s=>{const [a,b]=dims(s);return Math.min(a,b)+'x'+Math.max(a,b)};
const area=s=>dims(s).reduce((x,y)=>x*y,1);
const inch=cm=>Math.round(cm/2.54);
function sz(s,u){const [a,b]=dims(s);return u==='cm'?`${a}×${b} cm`:`${inch(a)}″×${inch(b)}″`}
function rnd(v){if(S.round==='5')return Math.round(v/5)*5;if(S.round==='10')return Math.round(v/10)*10;if(S.round==='9')return Math.max(9,Math.round(v/10)*10-1);return Math.round(v)}
const usd=ils=>rnd(ils/S.rate);
const $f=n=>'$'+Math.round(n).toLocaleString('en-US');
function cell(a,f,s,fr){const v=a.f[f]&&a.f[f][s]&&a.f[f][s][fr];if(v===undefined)return null;
  if(f==='float'||v>0)return {ils:v,w:null,own:f!=='float'};const o=STD[f][keyOf(s)][fr];return {ils:o.p,w:o.w||null}}
function customILS(f,fr,w,h){const pts=Object.entries(STD[f]).filter(([k,v])=>v[fr]&&!v[fr].w).map(([k,v])=>[area(k),v[fr].p]).sort((x,y)=>x[0]-y[0]);
  if(pts.length<2)return null;const A=w*h;
  if(A<=pts[0][0])return pts[0][1]*Math.max(.6,A/pts[0][0]);
  for(let i=1;i<pts.length;i++)if(A<=pts[i][0]){const [a0,p0]=pts[i-1],[a1,p1]=pts[i];return p0+(p1-p0)*(A-a0)/(a1-a0)}
  const [aL,pL]=pts[pts.length-1];return pL*A/aL}
function origInfo(a){const o=Object.assign({sc:'',cx:'',status:a.os===false?'sold':'avail',ovr:null},ORIG[a.id]||{});o.tier=(o.sc&&o.cx&&T[o.sc]&&T[o.sc][o.cx])||null;o.price=o.ovr||o.tier;return o}
function minUSD(a){let m=Infinity;for(const f in a.f)for(const s in a.f[f])for(const fr in a.f[f][s]){const c=cell(a,f,s,fr);if(c&&!c.w&&c.ils<m)m=c.ils}return isFinite(m)?usd(m):null}
const collPct=list=>!S.coll?0:list>500?20:list>300?15:10;

/* ---------- home ---------- */
function renderPromo(){$('promo').innerHTML=S.coll?`THE COLLECTOR'S RATE · UP TO $300: <b>10%</b> · OVER $300: <b>15%</b> · OVER $500: <b>20%</b>`:`USA TOUR · PRICE GUIDE`}
$('themes').innerHTML=THEMES.map(([k,l,c])=>`<button class="theme" type="button" data-t="${k}" aria-pressed="${k===theme}" style="--c:${c}"><i></i>${l}</button>`).join('');
$('themes').addEventListener('click',e=>{const b=e.target.closest('.theme');if(!b)return;theme=b.dataset.t;for(const x of $('themes').children)x.setAttribute('aria-pressed',x===b);renderHome()});
$('q').addEventListener('input',()=>{$('clearQ').hidden=!$('q').value;renderHome()});
$('clearQ').addEventListener('click',()=>{$('q').value='';$('clearQ').hidden=true;renderHome();$('q').focus()});
function inTheme(a){if(theme==='all')return true;if(theme==='emb')return !!a.f.emb;if(theme==='orig')return a.o;return a.T.has(theme)}
function tileHTML(a){const o=a.o?origInfo(a):null,m=minUSD(a),onTour=tour.includes(a.id);
  const badge=o?`<span class="badge${o.status==='sold'?' sold':''}">מקור${o.status==='sold'?' · נמכר':o.status==='hold'?' · שמור':''}</span>`:'';
  const pr=m!=null?`הדפס מ־<b>${$f(m)}</b>`:(o&&o.price?`מקור · <b>${$f(o.price)}</b>`:'מקור · לפי קבוצת מחיר');
  return `<button class="tile" type="button" data-id="${a.id}"><div class="art" style="background:${artBg(a)}">${badge}${onTour?'<span class="star">⭐ בטור</span>':''}</div><div class="tn">${esc(a.n)}</div><div class="tp">${pr}</div></button>`}
function renderHome(){
  renderPromo();$('rateTxt').textContent=S.rate.toFixed(2);$('setBtn').classList.toggle('ok',!!S.verified);
  const q=$('q').value.trim().toLowerCase().replace(/[^a-z0-9 ]/g,'');
  const tr=tour.map(id=>ART.find(a=>a.id===id)).filter(Boolean);
  $('tourWrap').hidden=!!q;
  $('tourCount').textContent=tr.length?tr.length+' יצירות':'';
  $('tour').innerHTML=tr.length?tr.map(tileHTML).join(''):`<div class="tourempty">פותחים יצירה ולוחצים ⭐ כדי להוסיף אותה לרשימת היצירות שאלברט מביא לטור. הן יופיעו כאן, ראשונות.</div>`;
  const items=ART.filter(a=>(!q||a.k.includes(q))&&inTheme(a)).sort((x,y)=>(tour.includes(y.id)-tour.includes(x.id)));
  const th=THEMES.find(t=>t[0]===theme)[1];
  $('gridTitle').textContent=q?'תוצאות חיפוש':theme==='all'?'כל היצירות':th;
  $('count').textContent=items.length+' יצירות';
  $('grid').innerHTML=items.length?items.map(tileHTML).join(''):`<div class="empty">לא מצאנו יצירה כזאת.<br>נסו חלק מהשם, למשל "tree" או "hamsa".</div>`;
  renderFab();
}
document.addEventListener('click',e=>{const b=e.target.closest('#grid [data-id],#tour [data-id]');if(b)openArt(b.dataset.id)});

/* ---------- detail: ID card ---------- */
function openArt(id){cur=ART.find(a=>a.id===id);kind=Object.keys(cur.f).length?'print':'orig';sel=null;disc='auto';custom={w:'',h:''};
  if(kind==='print')pickFirst();
  $('detail').hidden=false;$('detail').scrollTop=0;renderDetail();history.pushState({d:1},'')}
function pickFirst(){for(const f of ['canvas','emb','float'])if(cur.f[f]){const ss=Object.keys(cur.f[f]).sort((x,y)=>area(x)-area(y));for(const s of ss)for(const fr of FRO){const c=cell(cur,f,s,fr);if(c&&!c.w){sel={f,s,fr};return}}}}
function closeAll(){for(const id of ['detail','settings','pkg','cust'])$(id).hidden=true;$('pbar').hidden=true;renderHome()}
window.addEventListener('popstate',()=>{if(!$('cust').hidden){$('cust').hidden=true;return}if(!$('pkg').hidden&&!$('detail').hidden){$('pkg').hidden=true;renderFab();return}closeAll()});
function back(){if(history.state&&history.state.d)history.back();else closeAll()}

function tableHTML(f){const F=cur.f[f],ss=Object.keys(F).sort((x,y)=>area(x)-area(y)),cols=FRO.filter(fr=>ss.some(s=>F[s][fr]!==undefined));
  let h=`<section class="pcard"><header><b>${FMT[f].he}</b><small>${FMT[f].d}</small></header><div class="tscroll"><table><thead><tr><th style="text-align:right;padding-inline-start:16px">גודל</th>${cols.map(c=>`<th>${FR[c].he}</th>`).join('')}</tr></thead><tbody>`;
  for(const s of ss){h+=`<tr><td class="sz"><b>${sz(s,S.unit)}</b><small>${sz(s,S.unit==='cm'?'in':'cm')}</small></td>`;
    for(const fr of cols){const c=cell(cur,f,s,fr);const on=sel&&!sel.custom&&sel.f===f&&sel.s===s&&sel.fr===fr;
      h+=c?`<td><button type="button" class="${on?'on':''}${c.w?' w':''}" data-c="${f}|${s}|${fr}">${$f(usd(c.ils))}</button></td>`:'<td class="na">–</td>'}
    h+='</tr>'}

  <div class="panel"><h3>תצוגה</h3><div class="seg">${[['5','עיגול ל־5$'],['10','ל־10$'],['9','מסתיים ב־9'],['none','לדולר']].map(([k,v])=>`<button type="button" data-round="${k}" aria-pressed="${S.round===k}">${v}</button>`).join('')}</div>
    <div class="seg">${[['in','אינצ׳ים קודם'],['cm','ס״מ קודם']].map(([k,v])=>`<button type="button" data-unit="${k}" aria-pressed="${S.unit===k}">${v}</button>`).join('')}</div></div>
  <div class="panel"><h3>מחירים חשודים במחירון (${fl.length})</h3><p class="note">אלה מחירים מהאתר שנראים כמו טעות, וכדאי לתקן אותם בחנות. באפליקציה הם מסומנים במסגרת כתומה מקווקוות.</p><div class="flaglist">${fl.map(x=>`<div dir="ltr" style="text-align:right">${esc(x)}</div>`).join('')}</div></div></div>`}
function readInputs(){const r=parseFloat(($('sRate')||{}).value);if(r>1&&r<10&&r!==S.rate){S.rate=r;S.verified=false}
  const sc=parseInt(($('sSecond')||{}).value,10);if(sc>=0&&sc<=90)S.second=sc;
  document.querySelectorAll('#settings [data-t]').forEach(i=>{const [s,c]=i.dataset.t.split('|');const v=parseInt(i.value.replace(/[^\d]/g,''),10)||null;T[s]=T[s]||{};T[s][c]=v});persist()}
$('settings').addEventListener('change',()=>{readInputs();renderHome()});
$('settings').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;readInputs();
  if(d.act==='back')return back();
  if(d.round)S.round=d.round;else if(d.unit)S.unit=d.unit;else if(d.coll)S.coll=d.coll==='true';
  else if(d.act==='calib'){const i=parseFloat($('cIls').value),u=parseFloat($('cUsd').value);if(i>0&&u>0){S.rate=Math.round(i/u*100)/100;S.verified=true;toast('השער עודכן: '+S.rate)}else return toast('צריך למלא את שני המחירים')}
  else if(d.act==='exp')return copy(syncCode(),'הקוד הועתק. שלחו אותו בוואטסאפ');
  else if(d.act==='imp'){const v=($('imp').value||'').trim();try{if(!v.startsWith('ALP1:'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));Object.assign(S,o.S||{});ORIG=o.ORIG||{};T=o.T||{};tour=o.tour||[];toast('הנתונים נטענו. עכשיו שני המכשירים זהים')}catch(err){return toast('הקוד לא תקין. צריך להעתיק אותו בשלמותו')}}
  else return;persist();renderSettings();renderHome()});

/* ---------- utils + boot ---------- */
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function copy(t,msg){try{navigator.clipboard.writeText(t).then(()=>toast(msg||'הועתק'),()=>toast('ההעתקה נחסמה'))}catch(e){toast('ההעתקה נחסמה')}}
renderHome();
if('serviceWorker' in navigator&&/github\.io$|localhost/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
</body></html>
