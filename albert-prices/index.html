<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: a gallery wall — a searchable index of works; tapping one opens its wall label, where the price is set like museum signage. */
:root{
  --wall:#f6f6f2; --paper:#ffffff; --ink:#17181c; --muted:#6a6c74; --line:#e3e3dc;
  --accent:#2340d8; --accent-ink:#ffffff; --warn:#b4540a; --warn-bg:#fff3e4; --ok:#1f7a4d; --sold:#a3243b;
  --display:"Bricolage Grotesque","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#121318; --paper:#1b1d24; --ink:#f0f0ec; --muted:#9a9ca6; --line:#2c2f39;
  --accent:#7d93ff; --accent-ink:#0d1030; --warn:#ffb168; --warn-bg:#2e2114; --ok:#6fd3a0; --sold:#ff8597; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#121318; --paper:#1b1d24; --ink:#f0f0ec; --muted:#9a9ca6; --line:#2c2f39;
  --accent:#7d93ff; --accent-ink:#0d1030; --warn:#ffb168; --warn-bg:#2e2114; --ok:#6fd3a0; --sold:#ff8597; color-scheme:dark}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;direction:rtl}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--wall);padding-block:14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.brand h1 span{color:var(--muted);font-weight:500}
.rate{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.rate b{font-family:var(--display);font-variant-numeric:tabular-nums}
.rate .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.rate.ok .dot{background:var(--ok)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font-size:1.05rem}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;font-size:.92rem;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.count{color:var(--muted);font-size:.85rem;padding-top:12px}
ul.list{list-style:none;margin:0;padding:0;display:grid}
ul.list li button{width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.wname{font-family:var(--display);font-weight:700;font-size:1.12rem;direction:ltr;text-align:right;min-width:0;overflow-wrap:anywhere}
.wmeta{grid-column:1;display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.tag.orig{border-color:var(--accent);color:var(--accent)}
.from{grid-row:1/3;grid-column:2;text-align:left;font-size:.78rem;color:var(--muted)}
.from b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--wall);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{padding-block:12px 64px;display:grid;gap:18px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{border:0;background:none;padding:8px 0;font-weight:600;color:var(--accent);font-size:1rem}
.site{font-size:.85rem;color:var(--muted)}
.title{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.05;letter-spacing:-.02em;margin:0;direction:ltr;text-align:right;text-wrap:balance}
.step{display:grid;gap:8px}
.step h3{margin:0;font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;text-align:center;min-width:0;line-height:1.2}
.opt.size small{direction:ltr}
bdi{unicode-bidi:isolate}
.opt small{display:block;color:var(--muted);font-size:.75rem;margin-top:3px}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-pressed="true"] small{color:var(--accent)}
.opt.size b{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:1.02rem;direction:ltr;display:block}
.opt.warned{border-style:dashed}
/* wall label */
.label{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px 20px 16px;display:grid;gap:10px;box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(0,0,0,.25)}
.label .lname{font-family:var(--display);font-weight:700;direction:ltr;text-align:right}
.label .lspec{color:var(--muted);font-size:.9rem;direction:ltr;text-align:right}
.price{font-family:var(--display);font-weight:800;font-size:clamp(3rem,15vw,4.6rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.price .was{font-size:.32em;color:var(--muted);text-decoration:line-through;font-weight:500;margin-inline-end:10px;vertical-align:middle}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.copy{border:1px solid var(--line);background:var(--wall);border-radius:999px;padding:6px 12px;font-size:.85rem}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.88rem}
.disc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.disc span{font-size:.85rem;color:var(--muted);margin-inline-end:4px}
.field{display:grid;gap:4px}
.field label{font-size:.85rem;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:1rem;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.note{font-size:.85rem;color:var(--muted);margin:0}
.status-avail{color:var(--ok)} .status-sold{color:var(--sold)}
.flaglist{display:grid;gap:6px;font-size:.85rem;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper)}
.flaglist div{direction:ltr;text-align:right}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--wall);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:40}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}
</style>

  const items=ART.filter(a=>{
    if(q&&!a.n.toLowerCase().includes(q))return false;
    if(filter==='orig')return !!a.o; if(filter==='emb')return !!a.f.emb; if(filter==='canvas')return !!a.f.canvas; return true});
  $('count').textContent=`${items.length} יצירות`;
  $('list').innerHTML=items.length?items.map(a=>{
    const tags=[];if(a.f.canvas)tags.push('<span class="tag">הדפס</span>');if(a.f.emb)tags.push('<span class="tag">Embellished</span>');if(a.f.float)tags.push('<span class="tag">מסגרת צפה</span>');
    const o=origOf(a);if(o)tags.push(`<span class="tag orig">מקור${o.status==='sold'?' · נמכר':o.status==='hold'?' · שמור':''}</span>`);
    const m=minPrice(a);
    return `<li><button type="button" data-k="${esc(a.k)}"><span class="wname">${esc(a.n)}</span><span class="from">${isFinite(m)?'החל מ־<b>'+fmt$(usd(m))+'</b>':(o&&o.price?'מקור<b>'+fmt$(o.price)+'</b>':'')}</span><span class="wmeta">${tags.join('')}</span></button></li>`}).join('')
    :`<li class="empty">לא נמצאה יצירה בשם "${esc(q)}"</li>`;
}
$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b)openArt(b.dataset.k)});
$('q').addEventListener('input',renderList);
$('filters').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.f;for(const c of $('filters').children)c.setAttribute('aria-pressed',c===b);renderList()});

function formatsOf(a){const fs=['canvas','emb','float'].filter(f=>a.f[f]);if(a.o)fs.push('orig');return fs}
function openArt(k){cur=ART.find(a=>a.k===k);disc=0;const fs=formatsOf(cur);sel={fmt:fs[0]};pickDefaults();$('detail').hidden=false;$('detail').scrollTop=0;renderDetail();history.pushState({d:1},'')}
function pickDefaults(){
  if(sel.fmt==='orig')return;
  const sizes=Object.keys(cur.f[sel.fmt]).sort((x,y)=>area(x)-area(y));
  if(!sel.size||!cur.f[sel.fmt][sel.size])sel.size=sizes.find(s=>Object.values(cur.f[sel.fmt][s]).some(o=>!o.w))||sizes[0];
  const frs=cur.f[sel.fmt][sel.size];
  if(!sel.frame||!frs[sel.frame])sel.frame=FRAME_ORDER.find(f=>frs[f])||Object.keys(frs)[0];
}
function closeSheets(){$('detail').hidden=true;$('settings').hidden=true;renderList()}
window.addEventListener('popstate',closeSheets);
function back(){if(history.state&&history.state.d)history.back();else closeSheets()}

function renderDetail(){
  const a=cur,fs=formatsOf(a),u=S.unit;
  let h=`<div class="bar"><button class="back" type="button" data-act="back">→ כל היצירות</button>${a.h?`<a class="site" href="https://www.albertlevi.com/products/${esc(a.h)}" target="_blank" rel="noopener">בעמוד באתר ↗</a>`:''}</div>
  <h2 class="title">${esc(a.n)}</h2>
  <div class="step"><h3>סוג</h3><div class="seg">${fs.map(f=>`<button class="opt" type="button" data-fmt="${f}" aria-pressed="${sel.fmt===f}">${FMT[f].he}<small>${FMT[f].sub}</small></button>`).join('')}</div></div>`;
  if(sel.fmt==='orig'){h+=origBlock(a)}
  else{
    const F=a.f[sel.fmt];const sizes=Object.keys(F).sort((x,y)=>area(x)-area(y));
    h+=`<div class="step"><h3>גודל</h3><div class="seg">${sizes.map(s=>{const w=Object.values(F[s]).every(o=>o.w);return `<button class="opt size${w?' warned':''}" type="button" data-size="${s}" aria-pressed="${sel.size===s}"><b>${sizeTxt(s,u)}</b><small>${sizeAlt(s,u)}</small></button>`}).join('')}</div></div>`;
    const frs=F[sel.size];const fl=FRAME_ORDER.filter(f=>frs[f]);
    h+=`<div class="step"><h3>מסגרת וגימור</h3><div class="seg">${fl.map(f=>`<button class="opt" type="button" data-frame="${f}" aria-pressed="${sel.frame===f}">${FRAME[f].he}<small>${FRAME[f].sub}</small></button>`).join('')}</div></div>`;
    const o=frs[sel.frame];const base=usd(o.p);const fin=disc?usd(o.p*(1-disc/100)):base;
    h+=`<div class="label" aria-live="polite">
      <div class="lname">${esc(a.n)}</div>
      <div class="lspec">${FMT[sel.fmt].sub} · ${sizeTxt(sel.size,'in')} (${sizeTxt(sel.size,'cm')}) · ${FRAME[sel.frame].sub}</div>
      <div class="price">${disc?`<span class="was">${fmt$(base)}</span>`:''}${fmt$(fin)}</div>
      <div class="lfoot"><span>באתר: ${fmtILS(o.p)}${o.a===false?' · לא זמין כרגע באתר':''}</span><button class="copy" type="button" data-act="copy">העתקה ללקוח</button></div>
    </div>
    ${o.w?`<div class="warn"><b>לבדוק לפני שאומרים ללקוח:</b> ${esc(o.w)}. זה המחיר שמופיע באתר, וכנראה יש בו טעות.</div>`:''}
    <div class="disc"><span>הנחה:</span>${[0,5,10,15].map(d=>`<button class="chip" type="button" data-disc="${d}" aria-pressed="${disc===d}">${d?d+'%':'בלי'}</button>`).join('')}</div>`;
  }
  $('detailBody').innerHTML=h;
}
function origBlock(a){
  const o=origOf(a);const st={avail:'זמין',hold:'שמור ללקוח',sold:'נמכר'};
  const fin=o.price?(disc?Math.round(o.price*(1-disc/100)):o.price):null;
  return `<div class="label" aria-live="polite">
    <div class="lname">${esc(a.n)}</div>
    <div class="lspec">Original · Acrylic on canvas${o.size?' · '+esc(o.size):''} · <span class="status-${o.status==='sold'?'sold':'avail'}">${st[o.status]}</span></div>
    <div class="price">${o.price?(disc?`<span class="was">${fmt$(o.price)}</span>`:'')+fmt$(fin):'<span style="font-size:.4em;color:var(--muted)">עוד לא הוזן מחיר</span>'}</div>
    ${o.price?`<div class="lfoot"><span>מחיר מקור קבוע בדולרים</span><button class="copy" type="button" data-act="copy">העתקה ללקוח</button></div>`:''}
  </div>
  ${o.price?`<div class="disc"><span>הנחה:</span>${[0,5,10,15].map(d=>`<button class="chip" type="button" data-disc="${d}" aria-pressed="${disc===d}">${d?d+'%':'בלי'}</button>`).join('')}</div>`:''}
  <div class="step"><h3>פרטי המקור · נשמר לשניכם</h3>
    <p class="note">באתר אין מחיר ומידה למקורים. מזינים פעם אחת, והנתונים מופיעים גם אצל אלברט וגם אצל המלווה.</p>
    <div class="row2"><div class="field"><label for="oPrice">מחיר ($)</label><input id="oPrice" inputmode="numeric" value="${o.price||''}" placeholder="4500"></div>
    <div class="field"><label for="oSize">מידה</label><input id="oSize" value="${esc(o.size||'')}" placeholder="40″×60″"></div></div>
    <div class="field"><label for="oStatus">סטטוס</label><select id="oStatus">${Object.entries(st).map(([k,v])=>`<option value="${k}"${o.status===k?' selected':''}>${v}</option>`).join('')}</select></div>
    <button class="primary" type="button" data-act="saveOrig"${canWrite?'':' disabled'}>שמירה</button>
  </div>`;
}
$('detailBody').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='back')return back();
  if(b.dataset.fmt){sel.fmt=b.dataset.fmt;disc=0;pickDefaults()}
  else if(b.dataset.size){sel.size=b.dataset.size;pickDefaults()}
  else if(b.dataset.frame){sel.frame=b.dataset.frame}
  else if(b.dataset.disc!==undefined){disc=+b.dataset.disc}
  else if(b.dataset.act==='copy'){return copyQuote(b)}
  else if(b.dataset.act==='saveOrig'){return saveOrig()}
  renderDetail();
});
function quoteText(){const a=cur;
  if(sel.fmt==='orig'){const o=origOf(a);const p=disc?Math.round(o.price*(1-disc/100)):o.price;return `${a.n} — Original painting${o.size?', '+o.size:''} — ${fmt$(p)}`}
  const o=a.f[sel.fmt][sel.size][sel.frame];const p=disc?usd(o.p*(1-disc/100)):usd(o.p);
  return `${a.n} — ${FMT[sel.fmt].sub}, ${sizeTxt(sel.size,'in')} (${sizeTxt(sel.size,'cm')}), ${FRAME[sel.frame].sub} — ${fmt$(p)}`}
function copyQuote(){const t=quoteText();
  try{navigator.clipboard.writeText(t).then(()=>toast('הועתק'),()=>toast(t))}catch(e){toast(t)}}
async function saveOrig(){
  const p=parseInt(($('oPrice').value||'').replace(/[^\d]/g,''),10)||null;
  const rec={price:p,size:$('oSize').value.trim(),status:$('oStatus').value,updated:Date.now()};
  ORIG[cur.id]=rec;
  if(db){try{await db.doc('originals/'+cur.id).set(rec);toast('נשמר לשניכם')}catch(err){if(err&&err.code==='invalid_argument'){canWrite=false;toast('אין לך הרשאת עריכה')}else toast('השמירה נכשלה, נסו שוב')}}
  else{ls('alp_orig',ORIG);toast('נשמר במכשיר הזה')}
  renderDetail();
}

/* settings */
function openSettings(){$('settings').hidden=false;renderSettings();history.pushState({d:1},'')}
$('rateBtn').addEventListener('click',openSettings);
function allFlags(){const out=[];for(const a of ART)for(const f in a.f)for(const s in a.f[f])for(const fr in a.f[f][s]){const o=a.f[f][s][fr];if(o.w)out.push(`${a.n} · ${FMT[f].sub} · ${s.replace('x','×')} cm · ${FRAME[fr].sub} · ₪${o.p}`)}return out}
function renderSettings(){
  const fl=allFlags();
  $('settingsBody').innerHTML=`<div class="bar"><button class="back" type="button" data-act="back">→ חזרה</button></div>
  <h2 class="title" style="direction:rtl;text-align:right">הגדרות מחיר</h2>
  <div class="step"><h3>שער המרה</h3>
    <p class="note">המחירים באתר שמורים בשקלים. האפליקציה ממירה לדולרים לפי השער הזה. ${S.verified?'<b class="status-avail">השער אומת.</b>':'<b style="color:var(--warn)">השער עוד לא אומת מול האתר בארה״ב.</b>'}</p>
    <div class="field"><label for="sRate">כמה שקלים שווה דולר אחד</label><input id="sRate" inputmode="decimal" value="${S.rate}"></div>
  </div>
  <div class="step"><h3>כיול מול האתר בארה״ב</h3>
    <p class="note">פותחים יצירה כלשהי באתר מארה״ב, ומעתיקים את מחיר הדולר ואת מחיר השקל של אותה מידה ומסגרת (מחיר השקל מופיע בתווית שבאפליקציה). השער יחושב לבד.</p>
    <div class="row2"><div class="field"><label for="cIls">מחיר בשקלים</label><input id="cIls" inputmode="decimal" placeholder="1059"></div><div class="field"><label for="cUsd">מחיר בדולרים באתר</label><input id="cUsd" inputmode="decimal" placeholder="289"></div></div>
    <button class="chip" type="button" data-act="calib">חישוב שער</button>
  </div>
  <div class="step"><h3>עיגול מחיר</h3><div class="seg">${[['none','לדולר'],['5','ל־$5'],['10','ל־$10'],['9','מסתיים ב־9']].map(([k,v])=>`<button class="opt" type="button" data-round="${k}" aria-pressed="${S.round===k}">${v}</button>`).join('')}</div></div>
  <div class="step"><h3>יחידת מידה ראשית</h3><div class="seg">${[['in','אינצ׳ים'],['cm','סנטימטרים']].map(([k,v])=>`<button class="opt" type="button" data-unit="${k}" aria-pressed="${S.unit===k}">${v}</button>`).join('')}</div></div>
  <button class="primary" type="button" data-act="saveS"${canWrite?'':' disabled'}>שמירה ${db?'לשניכם':'במכשיר'}</button>
  <div class="step"><h3>מחירים חשודים באתר · ${fl.length}</h3><p class="note">מחירים שמופיעים כך באתר ונראים כמו טעות, למשל מידה גדולה שזולה ממידה קטנה. כדאי לתקן אותם בחנות.</p><div class="flaglist">${fl.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`;
}
$('settingsBody').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='back')return back();
  if(b.dataset.round){S.round=b.dataset.round;keepRate();renderSettings();return}
  if(b.dataset.unit){S.unit=b.dataset.unit;keepRate();renderSettings();return}
  if(b.dataset.act==='calib'){const i=parseFloat($('cIls').value),u=parseFloat($('cUsd').value);if(i>0&&u>0){S.rate=Math.round(i/u*100)/100;S.verified=true;renderSettings();toast('השער חושב: '+S.rate+'. אפשר לשמור')}else toast('צריך למלא את שני המחירים');return}
  if(b.dataset.act==='saveS'){keepRate();await saveSettings();}
});
function keepRate(){const r=parseFloat(($('sRate')||{}).value);if(r>1&&r<10){if(r!==S.rate)S.verified=false;S.rate=r}}
async function saveSettings(){
  const rec={rate:S.rate,round:S.round,unit:S.unit,verified:!!S.verified,updated:Date.now()};
  if(db){try{await db.doc('settings/main').set(rec);toast('נשמר לשניכם')}catch(err){toast(err&&err.code==='invalid_argument'?'אין לך הרשאת עריכה':'השמירה נכשלה, נסו שוב')}}
  else{ls('alp_settings',rec);toast('נשמר במכשיר הזה')}
  renderRate();renderList();
}

/* boot */
const lsS=ls('alp_settings');if(lsS)Object.assign(S,lsS);const lsO=ls('alp_orig');if(lsO)ORIG=lsO;
renderRate();renderList();
(async()=>{
  if(!window.claude||!window.claude.use)return;
  try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db)return;
  try{const user=await window.claude.use('user');if(user){const c=await user.can('data.write');if(c===false)canWrite=false}}catch(e){}
  db.doc('settings/main').onSnapshot(s=>{if(s.exists){Object.assign(S,s.data());renderRate();renderList();if(!$('detail').hidden)renderDetail();if(!$('settings').hidden)renderSettings()}},()=>{});
  db.collection('originals').onSnapshot(q=>{ORIG={};q.docs.forEach(d=>ORIG[d.id]=d.data());renderList();if(!$('detail').hidden&&sel.fmt==='orig')renderDetail()},()=>{});
})();
})();
</script>
