<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Albert Levi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body><title>מחירון אלברט לוי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Assistant:wght@300;400;600&family=Bellefair&family=Heebo:wght@300;400;500;600&family=Rubik:wght@400;500;600;700&family=Archivo:wdth,wght@100..125,500..900&family=Josefin+Sans:wght@300;400&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: a pocket price guide — tour pieces first, every work opens as one "ID card" with all sizes and finishes priced at once; the chosen price and the package live in a navy bar pinned to the bottom. */
:root{
  --wall:#f6f7fa; --card:#ffffff; --ink:#2a3048; --muted:#6c7390; --line:#e6e9f0; --soft:#eef1f6;
  --navy:#3d5a99; --navy-deep:#2e4677; --gold:#e9bd6b; --on-gold:#2e3a5e;
  --cobalt:#5b7bd5; --magenta:#d86b96; --sun:#ebc06a; --teal:#4aa8a0; --tang:#e38b5e;
  --accent:var(--navy); --sel-bg:#3d5a99; --sel-fg:#ffffff;
  --warn:#b0652a; --warn-bg:#fdf3e7; --ok:#3d8a62; --sold:#b5485f;
  --display:"Archivo","Rubik",system-ui,sans-serif;
  --script:"Mrs Saint Delafield",cursive; --thin:"Josefin Sans","Rubik",sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(40,50,90,.05),0 8px 22px -14px rgba(40,50,90,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#161b2b; --card:#1e2438; --ink:#e9ecf4; --muted:#a2a9c2; --line:#2e3550; --soft:#252c44;
  --navy:#4a67a8; --navy-deep:#2b3b66; --gold:#e3bd78; --on-gold:#26304d;
  --accent:#a9bbef; --sel-bg:#e3bd78; --sel-fg:#26304d; --warn:#f0b07a; --warn-bg:#33281c; --ok:#86cfa8; --sold:#f2a0b0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#161b2b; --card:#1e2438; --ink:#e9ecf4; --muted:#a2a9c2; --line:#2e3550; --soft:#252c44;
  --navy:#4a67a8; --navy-deep:#2b3b66; --gold:#e3bd78; --on-gold:#26304d;
  --accent:#a9bbef; --sel-bg:#e3bd78; --sel-fg:#26304d; --warn:#f0b07a; --warn-bg:#33281c; --ok:#86cfa8; --sold:#f2a0b0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;direction:rtl;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
bdi{unicode-bidi:isolate}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* home */
.promo{background:var(--navy-deep);font-size:.62rem!important;padding:7px 12px!important;color:#fff;text-align:center;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.7rem;letter-spacing:.08em;padding:9px 16px;line-height:1.5;direction:ltr}
.promo b{color:var(--gold)}
.hero{padding-block:10px 4px;display:grid;gap:10px}
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--wall);margin-inline:-16px;padding:8px 16px 10px;box-shadow:0 8px 16px -14px rgba(40,50,90,.35)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brandlogo{display:flex;align-items:center;direction:ltr;color:var(--ink)}
.brandlogo .A{font-family:var(--script);font-size:3.4rem;line-height:.6;margin-right:-10px;transform:translateY(6px)}
.brandlogo .t{display:grid}
.brandlogo .t b{font-family:var(--thin);font-weight:300;font-size:1.15rem;letter-spacing:.32em;line-height:1}
.brandlogo .t small{font-family:var(--thin);font-size:.66rem;letter-spacing:.08em;color:var(--muted);text-align:right;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.8rem;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.pill.ok .dot{background:var(--ok)}
.eyebrow{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.68rem;letter-spacing:.14em;color:var(--muted);direction:ltr;text-align:right}
.greet{font-weight:700;font-size:clamp(1.45rem,6.2vw,2rem);line-height:1.15;margin:-6px 0 0;text-wrap:balance}
.greet em{font-style:normal;color:var(--accent);box-shadow:inset 0 -.32em 0 color-mix(in srgb,var(--gold) 55%,transparent)}
.searchbox{position:relative}
.searchbox input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px 46px 14px 44px;font-size:1.05rem;box-shadow:var(--shadow)}
.searchbox input:focus{border-color:var(--accent);outline:none}
.searchbox svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .clear{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:var(--soft);border-radius:999px;width:30px;height:30px;color:var(--muted)}
.themes{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.themes::-webkit-scrollbar{display:none}
.theme{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px 8px 12px;font-size:.92rem;font-weight:500}
.theme i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.theme[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px;gap:10px}
.sec h2{margin:0;font-size:1rem;font-weight:600}
.sec span{color:var(--muted);font-size:.85rem}
.tourrow{display:flex;gap:12px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-bottom:6px;scrollbar-width:none}
.tourrow::-webkit-scrollbar{display:none}
.tourrow .tile{flex:none;width:132px}
.tourempty{border:1.5px dashed var(--line);border-radius:16px;padding:14px;color:var(--muted);font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-bottom:110px}
.tile{display:grid;gap:7px;border:0;background:none;padding:0;text-align:right;align-content:start}
.art{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12px;filter:drop-shadow(0 6px 10px rgba(20,30,80,.18))}
.art.ph{background:var(--card)!important}
.art .badge{z-index:1;position:absolute;top:8px;right:8px;background:rgba(255,255,255,.93);color:#14215e;font-size:.7rem;font-weight:600;border-radius:999px;padding:3px 9px}
.art .badge.sold{background:rgba(20,33,94,.85);color:#fff}
.art .star{z-index:1;position:absolute;bottom:8px;left:8px;background:var(--gold);color:#14215e;font-size:.7rem;font-weight:700;border-radius:999px;padding:3px 8px}
.tile .tn{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:.98rem;line-height:1.2;direction:ltr;text-align:right;overflow-wrap:anywhere}
.tile .tp{font-size:.8rem;color:var(--muted);margin-top:-3px;display:flex;gap:4px 10px;flex-wrap:wrap}
.tile .tp b{color:var(--ink);font-family:var(--display);font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--wall);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.dhero{position:relative;padding-block:12px 18px;color:#fff;overflow:hidden}
.dhero .bg{position:absolute;inset:0;overflow:hidden}
.dhero .bg img{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(26px) saturate(1.3)}
.heroimg{display:block;max-width:100%;max-height:min(26vh,210px);margin:4px auto 0;object-fit:contain;filter:drop-shadow(0 14px 28px rgba(0,0,0,.4))}
.dhero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,44,.15),rgba(10,15,44,.62))}
.dhero .wrap{position:relative;display:grid;gap:12px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.navrow .r{display:flex;gap:8px}
.iconbtn{border:0;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:.9rem;text-decoration:none}
.iconbtn[aria-pressed="true"]{background:var(--gold);color:#14215e}
.dtitle{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(1.45rem,6.4vw,2.2rem);line-height:1;letter-spacing:-.02em;margin:10px 0 0;direction:ltr;text-align:right;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.kind{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:rgba(255,255,255,.16);border-radius:16px;padding:5px}
.kind button{border:0;background:none;color:#fff;border-radius:12px;padding:10px 6px;font-weight:600;font-size:.9rem;line-height:1.15}
.kind button small{display:block;font-weight:400;font-size:.7rem;opacity:.8}
.kind button[aria-pressed="true"]{background:#fff;color:#14215e}
.kind button:disabled{opacity:.45}
.dbody{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 170px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pcard header{padding:14px 16px 10px;display:grid;gap:2px}
.pcard header b{font-size:1.02rem}
.pcard header small{color:var(--muted);font-size:.82rem}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:6px 8px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.74rem;padding-block:8px}
td.sz{text-align:right;padding-inline-start:16px}
td.sz b{display:block;font-family:var(--display);font-weight:700;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
td.sz small{display:block;color:var(--muted);font-size:.72rem;direction:ltr;text-align:right}
td button{border:1.5px solid transparent;background:transparent;color:var(--ink);padding:8px 10px;border-radius:10px;font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;min-width:70px}
td button.on{background:var(--sel-bg);color:var(--sel-fg);box-shadow:0 4px 12px -6px rgba(40,60,120,.5)}
tr.sel td{background:color-mix(in srgb,var(--navy) 6%,transparent)}
tbody tr{cursor:pointer}
@media (hover:hover){td button:hover:not(.on){background:var(--soft)}}
td button.w{border-color:var(--warn);border-style:dashed;color:var(--warn)}
td.na{color:var(--muted)}
.custom summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent);list-style:none}
.custom summary::-webkit-details-marker{display:none}
.custom summary::before{content:'＋ '}
.custom[open] summary::before{content:'－ '}
.custom{border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;gap:10px;background:color-mix(in srgb,var(--soft) 50%,transparent)}
.custom .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.custom label{font-size:.85rem;font-weight:600}
.custom input{width:72px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px;text-align:center;direction:ltr}
.custom .res{display:flex;gap:8px;flex-wrap:wrap}
.custom .res button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:.85rem}
.custom .res button.on{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.custom .res b{font-family:var(--display)}
.note{font-size:.84rem;color:var(--muted);margin:0}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 13px;font-size:.86rem}
.wallbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:grid;gap:4px}
.wallbox svg{width:100%;height:auto;max-height:170px;display:block}
.wallbox p{margin:0;font-size:.78rem;color:var(--muted);text-align:center}

/* originals */
.ocard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px}
.ocard h4{margin:0;font-size:.85rem;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:8px 12px;display:grid;gap:1px;text-align:center}
.chips button small{font-size:.7rem;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.chips button[aria-pressed="true"] small{color:inherit;opacity:.8}
.chips.st button[aria-pressed="true"][data-st="avail"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chips.st button[aria-pressed="true"][data-st="hold"]{background:var(--sun);border-color:var(--sun);color:#14215e}
.chips.st button[aria-pressed="true"][data-st="sold"]{background:var(--sold);border-color:var(--sold);color:#fff}
.obig{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:2.6rem;line-height:1;direction:ltr;text-align:right}
.field{display:grid;gap:5px}
.field label{font-size:.84rem;color:var(--muted)}
.field input{border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:11px;font-size:1rem;width:100%}

/* bottom bar */
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(180deg,var(--navy),var(--navy-deep));color:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px -18px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom,0px)}
.pbar .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-block:10px 10px}
.dtog{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:4px 10px;font-size:.74rem;margin-top:5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;max-width:100%}
.dtog .coll{padding:2px 7px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pinfo{flex:1 1 0;min-width:0;overflow:hidden}
.pinfo small{display:block;color:#b9c3ea;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.pval{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:1.95rem;line-height:1;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.pval s{font-size:.42em;color:#9fabdc;font-weight:600;margin-left:8px}
.pbtns{display:flex;gap:8px;flex:none}
.gold{border:0;background:var(--gold);color:#14215e;border-radius:14px;padding:12px 14px;font-weight:700}
.line{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:14px;padding:11px 12px;font-weight:500}
.disc{display:flex;gap:6px;align-items:center;font-size:.8rem;color:#b9c3ea;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.disc::-webkit-scrollbar{display:none}
.disc>*{flex:none}
.disc button{border:1px solid rgba(255,255,255,.28);background:transparent;border-radius:999px;padding:4px 11px;font-size:.8rem;color:#fff}
.disc button[aria-pressed="true"]{background:#fff;border-color:#fff;color:#14215e;font-weight:600}
.coll{display:inline-flex;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.64rem;letter-spacing:.1em;color:#14215e;background:var(--gold);border-radius:999px;padding:3px 9px}
.pkgfab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:22;border:0;background:var(--navy);color:#fff;border-radius:999px;padding:12px 16px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.pkgfab b{background:var(--gold);color:#14215e;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}

/* package + settings */
.sbody{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 60px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead h2{margin:0;font-size:1.35rem}
.back{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.panel h3{margin:0;font-size:1rem}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:9px 13px}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.items{display:grid;gap:0}
.item{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-family:var(--display);font-weight:700;direction:ltr;text-align:right}
.item small{grid-column:1;color:var(--muted);font-size:.78rem;direction:ltr;text-align:right}
.item .pr{grid-row:1/3;grid-column:2;text-align:left;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.item .pr s{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
.item .x{grid-row:1/3;grid-column:3;border:0;background:var(--soft);border-radius:999px;width:30px;height:30px;color:var(--muted)}
.totals{display:grid;gap:4px;font-size:.92rem}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:2rem;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.tiers{overflow-x:auto}
.tiers table td,.tiers table th{border-top:1px solid var(--line);padding:6px}
.tiers input{width:84px;border:1.5px solid var(--line);background:var(--wall);border-radius:10px;padding:8px;text-align:center;direction:ltr}
textarea{width:100%;min-height:80px;border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:10px;font:inherit;font-size:.8rem;direction:ltr;color:inherit}
.primary{border:0;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;font-weight:600}
.ghost{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font-weight:500;color:var(--ink)}
.flaglist{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}

/* customer */
.cust{position:fixed;inset:0;z-index:50;overflow-y:auto;background:radial-gradient(120% 80% at 100% 0%,#4a67a8 0,transparent 60%),linear-gradient(180deg,#3d5a99,#1f2a47);color:#f4f4f6;display:grid;place-items:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.cust .cc{width:min(520px,100%);display:grid;gap:16px;direction:ltr;text-align:left}
.cust .who{display:flex;align-items:center;gap:4px}
.cust .who .A{font-family:var(--script);font-size:3rem;line-height:.6}
.cust .who b{font-family:var(--thin);font-weight:300;letter-spacing:.32em;font-size:1.05rem}
.cust .strip{height:6px;border-radius:999px}
.cust .cimg{max-width:100%;max-height:34vh;justify-self:center;object-fit:contain;filter:drop-shadow(0 16px 30px rgba(0,0,0,.45))}
.cust .cpill{justify-self:start;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.7rem;letter-spacing:.12em;background:var(--gold);color:#14215e;border-radius:999px;padding:5px 12px}
.cust h2{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(1.9rem,9vw,3rem);line-height:1;margin:0}
.cust dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.cust dt{color:#aab6e6}.cust dd{margin:0}
.cust .lines{display:grid;gap:8px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.cust .lines div{display:flex;justify-content:space-between;gap:12px}
.cust .lines span:last-child{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cust .big{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(3.4rem,19vw,5.8rem);line-height:1;font-variant-numeric:tabular-nums}
.cust .big s{display:block;font-size:.3em;color:#aab6e6;font-weight:600}
.cust .close{justify-self:start;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:999px;padding:9px 16px;direction:rtl}
.toast{position:fixed;bottom:calc(180px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--wall);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#close{z-index:55}
/* micro-interactions */
button{transition:transform .12s ease,background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease}
button:active:not(:disabled){transform:scale(.965)}
.tile:active .art{transform:scale(.98)}
/* viewing room */
.cust.vrmode{display:block;padding:0;background:#151926;overflow-y:auto}
.vr{min-height:100%;display:grid;grid-template-rows:auto auto 1fr;color:#eef0f5;padding-bottom:env(safe-area-inset-bottom,0px)}
.vr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;position:relative;z-index:2}
.vr-top .who{display:flex;align-items:center;direction:ltr;white-space:nowrap;min-width:0}
.vr-top .who .A{font-family:var(--script);font-size:2.6rem;line-height:.6;margin-right:-6px}
.vr-top .who b{font-family:var(--thin);font-weight:300;letter-spacing:.32em;font-size:.95rem}
.vr-tag{white-space:nowrap;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.62rem;letter-spacing:.28em;color:#c9a35a;border:1px solid rgba(201,163,90,.45);border-radius:999px;padding:5px 10px}
.glassbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);color:#fff;border-radius:999px;min-width:38px;height:38px;padding:0 12px;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.glassbtn[aria-pressed="true"]{background:rgba(255,255,255,.88);color:#111;border-color:#fff}
.vr-stage{position:relative;height:min(60vh,560px);min-height:320px;touch-action:pan-y}
.vr-stage canvas{display:block;width:100%;height:100%;direction:ltr}
.wallbox canvas{direction:ltr}
.vr-ctl{position:absolute;inset-inline:12px;top:12px;direction:ltr;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.vr-ctl>*{pointer-events:auto}
.vr-env{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(20,20,24,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);direction:ltr}
.vr-env button{border:0;background:none;color:#fff;border-radius:999px;padding:7px 12px;font-size:.78rem;font-weight:600;letter-spacing:.02em}
.vr-env button[aria-pressed="true"]{background:#fff;color:#111}
.vr-tools{display:flex;gap:6px}
.vr-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:.74rem;color:#fff;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;white-space:nowrap;animation:hint 3.2s ease forwards;pointer-events:none}
@keyframes hint{0%,70%{opacity:1}100%{opacity:0}}
.vr-info{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:18px 16px 26px;max-width:640px;width:100%;margin:0 auto;direction:ltr;text-align:left}
.vr-ed{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.64rem;letter-spacing:.24em;color:#c9a35a}
.vr-title{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(2rem,9vw,3.1rem);line-height:.95;letter-spacing:-.02em;margin:2px 0 0}
.vr-sizes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.vr-sizes::-webkit-scrollbar{display:none}
.vr-sizes button{flex:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#f4f2ee;border-radius:14px;padding:9px 13px;text-align:left;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:.92rem}
.vr-sizes button small{display:block;font-family:var(--body);font-weight:400;font-size:.68rem;color:#9a9caa}
.vr-sizes button[aria-pressed="true"]{background:#f4f2ee;color:#0b0d14;border-color:#f4f2ee}
.vr-sizes button[aria-pressed="true"] small{color:#555}
.vr-fin{display:flex;gap:8px;flex-wrap:wrap}
.vr-fin button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#f4f2ee;border-radius:999px;padding:7px 12px 7px 8px;display:inline-flex;align-items:center;gap:8px;font-size:.84rem}
.vr-fin i{width:18px;height:18px;border-radius:5px;display:block}
.vr-fin button[aria-pressed="true"]{border-color:#c9a35a;box-shadow:0 0 0 1px #c9a35a inset}
.vr-card{border-radius:22px;padding:16px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.vr-card .cpill{display:inline-block;margin-bottom:8px;white-space:nowrap;font-size:.6rem;letter-spacing:.08em}
.vr-price{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(3rem,15vw,4.6rem);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.vr-price s{display:block;font-size:.28em;color:#9a9caa;font-weight:600;letter-spacing:0;margin-bottom:4px}
.vr-cta{display:grid;grid-template-columns:1fr auto;gap:8px;direction:rtl}
.vr-cta .gold{padding:15px;font-size:1rem;background:linear-gradient(180deg,#f6c55a,#e0a32e);box-shadow:0 10px 24px -10px rgba(242,179,61,.6)}
.vr-cta .line{border-color:rgba(255,255,255,.25)}
.wallbox canvas{display:block;width:100%;height:220px;border-radius:14px}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:right;justify-items:start;text-align:righer;box-shadow:var(--shadow)}
.qa b{font-size:.86rem;font-weight:600}
.qa small{font-size:.72rem;color:var(--muted);font-family:var(--display);font-variant-numeric:tabular-nums}
.qa .ic{grid-row:1/3;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.95rem}
.qa b{font-size:.8rem!important;line-height:1.2}
/* quick sheet */
.qtabs{display:flex;gap:8px}
.qtabs button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-weight:600}
.qtabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
td .cp{display:block;font-size:.68rem;color:var(--ok);font-weight:600;margin-top:2px}
/* sales */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:linear-gradient(160deg,var(--navy),var(--navy-deep));color:#fff;border-radius:16px;padding:12px;display:grid;gap:2px}
.kpi small{color:#b9c3ea;font-size:.72rem}
.kpi b{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.deal{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.deal:last-child{border-bottom:0}
.deal time{grid-row:1/3;font-family:var(--display);font-weight:700;color:var(--muted);font-size:.85rem}
.deal .nm{font-weight:600;font-size:.92rem;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal small{color:var(--muted);font-size:.76rem}
.deal .amt{grid-row:1/3;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.deal .del{border:0;background:none;color:var(--sold);font-size:.75rem;padding:0;justify-self:start}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;font-size:.85rem}
.bar i{display:block;height:12px;border-radius:999px;background:var(--gold)}
.bar span:last-child{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
/* close deal */
.cthumbs{display:flex;gap:8px;overflow-x:auto}
.cthumbs img{width:64px;height:64px;object-fit:contain;background:var(--soft);border-radius:12px;flex:none}
.bigtotal{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:2.6rem;direction:ltr;text-align:right;line-height:1}
.green{border:0;background:var(--ok);color:#fff;border-radius:14px;padding:14px 16px;font-weight:700;font-size:1.02rem}
/* showroom */
.cust{place-items:start center}
.room{width:100%;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -25px rgba(0,0,0,.6);background:#e8e2d8}
.room svg{display:block;width:100%;height:auto}
.room image{transition:all .45s cubic-bezier(.2,.8,.2,1)}
.srow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.srow::-webkit-scrollbar{display:none}
.srow button{flex:none;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:8px 12px;font-family:var(--display);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.srow button small{display:block;font-weight:500;font-size:.66rem;color:#aab6e6}
.srow button[aria-pressed="true"]{background:#fff;color:#14215e;border-color:#fff}
.srow button[aria-pressed="true"] small{color:#5f6789}
.srow.fr button{font-family:var(--body);font-weight:500}
.slabel{font-size:.7rem;letter-spacing:.14em;color:#aab6e6;font-family:var(--display);font-stretch:125%;font-weight:800}
.pricebox{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.qr{background:#fff;border-radius:14px;padding:8px;display:grid;gap:2px;justify-items:center;flex:none}
.qr svg{width:84px;height:84px;display:block}
.qr small{color:#14215e;font-size:.6rem;font-weight:700;letter-spacing:.06em;font-family:var(--display)}
.cbtns{display:flex;gap:8px;flex-wrap:wrap;direction:rtl}
.cbtns .line{padding:10px 14px}
.lines .th{width:46px;height:46px;object-fit:contain;background:rgba(255,255,255,.08);border-radius:10px;flex:none}
.lines .li{display:flex;gap:10px;align-items:center;min-width:0}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#1d3a8f,#0a0f2c);display:grid;place-items:center;color:#fff;transition:opacity .45s ease}
#splash .lg{display:flex;align-items:center;direction:ltr}
#splash .A{font-family:var(--script);font-size:7rem;line-height:.6;clip-path:inset(0 100% 0 0);animation:draw 1s .1s ease-out forwards}
#splash b{font-family:var(--thin);font-weight:300;letter-spacing:.4em;font-size:1.5rem;opacity:0;animation:fadein .6s .7s ease forwards}
#splash small{display:block;text-align:center;color:var(--gold);font-family:var(--display);font-stretch:125%;font-weight:800;letter-spacing:.2em;font-size:.7rem;margin-top:22px;opacity:0;animation:fadein .6s 1s ease forwards}
@keyframes draw{to{clip-path:inset(0 0 0 0)}}@keyframes fadein{to{opacity:1}}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.tile{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.tile:nth-child(2){animation-delay:.04s}.tile:nth-child(3){animation-delay:.08s}.tile:nth-child(4){animation-delay:.12s}.tile:nth-child(n+5){animation-delay:.16s}@keyframes rise{from{transform:translateY(10px)}to{transform:none}}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s cubic-bezier(.2,.8,.2,1)}.cust{animation:fade .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}}

/* ===================== GALLERY WHITE ===================== */
/* Layout: a white-walled gallery — hairlines instead of boxes, works hung on a soft wall tone, names and prices set in a gallery serif, ink-black controls, one bronze note for discounts. */
:root{
  --wall:#ffffff; --card:#ffffff; --ink:#141414; --muted:#767676; --line:#e9e7e3; --soft:#f5f4f1; --hang:#f3f2ef;
  --navy:#141414; --navy-deep:#141414; --gold:#9c7a42; --on-gold:#ffffff; --bronze:#9c7a42;
  --accent:#141414; --sel-bg:#141414; --sel-fg:#ffffff;
  --warn:#9a5a1c; --warn-bg:#fbf4ea; --ok:#2f6b4f; --sold:#9b3a3a;
  --serif:"Bellefair","Frank Ruhl Libre",Georgia,serif; --body:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:var(--serif);
  --shadow:none; --art-shadow:0 1px 1px rgba(0,0,0,.04),0 14px 28px -18px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#121212; --card:#121212; --ink:#efede8; --muted:#9a9894; --line:#2a2a2a; --soft:#1b1b1b; --hang:#1a1a1a;
  --navy:#efede8; --navy-deep:#efede8; --gold:#c9a66b; --bronze:#c9a66b; --on-gold:#121212;
  --accent:#efede8; --sel-bg:#efede8; --sel-fg:#121212; --warn:#e0a467; --warn-bg:#2a2016; --ok:#7fc7a1; --sold:#e08a8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#121212; --card:#121212; --ink:#efede8; --muted:#9a9894; --line:#2a2a2a; --soft:#1b1b1b; --hang:#1a1a1a;
  --navy:#efede8; --navy-deep:#efede8; --gold:#c9a66b; --bronze:#c9a66b; --on-gold:#121212;
  --accent:#efede8; --sel-bg:#efede8; --sel-fg:#121212; --warn:#e0a467; --warn-bg:#2a2016; --ok:#7fc7a1; --sold:#e08a8a; color-scheme:dark}
body{font-family:var(--body);font-weight:400;letter-spacing:.005em}
.cap{font-family:var(--body);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
button{border-radius:0}

/* promo + header */
.promo{background:var(--wall)!important;color:var(--muted)!important;border-bottom:1px solid var(--line);font-family:var(--body)!important;font-stretch:normal!important;font-weight:500!important;letter-spacing:.16em!important;font-size:.6rem!important;padding:9px 14px!important}
.promo b{color:var(--bronze)!important}
.hero{padding-block:18px 0;gap:14px}
.topline{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.brandlogo{grid-column:2;justify-content:center;flex-direction:column;gap:4px;color:var(--ink)}
.brandlogo .A{display:none}
.brandlogo .t{justify-items:center}
.brandlogo .t b{font-family:var(--serif);font-weight:400;font-size:1.45rem;letter-spacing:.34em;line-height:1;padding-left:.34em}
.brandlogo .t small{font-family:var(--body);font-size:.58rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0}
#setBtn{grid-column:1;grid-row:1;width:40px;height:40px;padding:0;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:0;justify-content:center}
#setBtn span{font-size:1rem}
.stick{background:var(--wall);box-shadow:none;padding-block:6px 0;border-bottom:0}
.searchbox input{border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;box-shadow:none;padding:12px 30px 12px 34px;font-size:1rem;font-weight:300}
.searchbox input:focus{border-bottom-width:2px}
.searchbox svg{right:2px}
.searchbox .clear{background:transparent;left:0}
/* quick links */
.qa{display:flex;gap:0;margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.qa button{flex:1;border:0;border-inline-start:1px solid var(--line);background:transparent;border-radius:0;box-shadow:none;padding:12px 6px;display:grid;grid-template-columns:none;justify-items:center;text-align:center;gap:2px}
.qa button:first-child{border-inline-start:0}
.qa .ic{display:none}
.qa b{font-weight:500!important;font-size:.8rem!important}
.qa small{font-family:var(--serif);font-size:.95rem;color:var(--ink)}
/* filters */
.themes{gap:22px;border-bottom:1px solid var(--line);margin-inline:-16px;padding:0 16px;margin-top:6px!important}
.theme{border:0;background:transparent;border-radius:0;padding:14px 0 12px;font-size:.88rem;font-weight:400;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.theme i{display:none}
.theme[aria-pressed="true"]{background:transparent;color:var(--ink);border-color:var(--ink);font-weight:500}
.sec{margin:26px 0 14px}
.sec h2{font-family:var(--serif);font-weight:400;font-size:1.5rem;letter-spacing:.01em}
.sec span{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
/* tour carousel */
.tourrow{gap:16px;scroll-snap-type:x mandatory}
.tourrow .tile{width:72%;max-width:300px;scroll-snap-align:start}
.tourempty{display:none}
/* grid */
.grid{gap:34px 16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{gap:10px}
.art{border-radius:0;box-shadow:none;background:var(--hang)!important;aspect-ratio:1}
.art.ph{background:var(--hang)!important}
.art img{padding:14%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.22))}
.art .star{background:var(--wall);color:var(--ink);border-radius:0;font-weight:500;font-size:.62rem;letter-spacing:.12em;top:10px;bottom:auto;left:10px;padding:4px 7px}
.tile .tn{font-family:var(--serif);font-weight:400;font-stretch:normal;font-size:1.12rem;line-height:1.15}
.tile .tp{font-size:.74rem;color:var(--muted);gap:2px 12px}
.tile .tp b{font-family:var(--body);font-weight:500;color:var(--ink)}
@media (hover:hover){.tile:hover .art img{transform:scale(1.03)}.art img{transition:transform .5s ease}}

/* work page */
.sheet{background:var(--wall)}
.dhero{color:var(--ink);padding-block:0;background:var(--wall)}
.dhero .bg{display:none}
.dhero .wrap{gap:0;padding-inline:0;max-width:none}
.navrow{position:sticky;top:0;z-index:4;background:var(--wall);padding:12px 16px;border-bottom:1px solid var(--line)}
.iconbtn{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line);border-radius:0;padding:8px 12px;font-weight:400;font-size:.82rem;-webkit-backdrop-filter:none;backdrop-filter:none}
.iconbtn[aria-pressed="true"]{background:var(--ink)!important;color:var(--wall)!important;border-color:var(--ink)}
.heroimg{max-height:min(38vh,320px);margin:0 auto;padding:28px 0;box-sizing:content-box;filter:drop-shadow(0 18px 22px rgba(0,0,0,.25))}

.dhero .wrap>.heroimg{object-position:center}
.dtitle{font-family:var(--serif);font-weight:400;font-stretch:normal;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.05;text-shadow:none;margin:22px 16px 6px;color:var(--ink);letter-spacing:.005em}
.kind{background:transparent;border-radius:0;padding:0 16px;gap:0;border-bottom:1px solid var(--line);margin-top:14px;grid-auto-columns:auto;justify-content:start;column-gap:26px}
.kind button{color:var(--muted);background:transparent!important;border-radius:0;padding:14px 0 12px;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:400;font-size:.92rem}
.kind button small{display:none}
.kind button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:500}
.dbody{padding-block:6px 150px;gap:22px}
.pcard{border:0;border-radius:0;background:transparent}
.pcard header{padding:16px 0 10px}
.pcard header b{font-family:var(--serif);font-weight:400;font-size:1.35rem}
.pcard header small{font-size:.8rem}
table{font-size:.95rem}
th{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;padding-block:10px;border-top:0;border-bottom:1px solid var(--ink)}
th,td{border-top:0;border-bottom:1px solid var(--line)}
td.sz{padding-inline-start:0}
th[style]{padding-inline-start:0!important}
td.sz b{font-family:var(--serif);font-weight:400;font-size:1.15rem}
td.sz small{font-size:.7rem}
td button{font-family:var(--serif);font-weight:400;font-size:1.1rem;border-radius:0;padding:8px 10px;min-width:74px}
td button.on{background:var(--ink);color:var(--wall);box-shadow:none}
td button.w{border:0;border-bottom:1px dashed var(--warn);color:var(--warn)}
tr.sel td{background:var(--soft)}
.custom{background:transparent;border-top:0;padding:14px 0}
.custom summary{color:var(--ink);font-weight:500;font-size:.85rem}
.custom input{border-radius:0;border:0;border-bottom:1px solid var(--ink);background:transparent}
.custom .res button{border-radius:0}
.custom .res button.on{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.wallbox{border:0;border-radius:0;padding:0;background:transparent}
.wallbox canvas{border-radius:0}
.wallbox p{font-size:.72rem;letter-spacing:.06em}
.warn{border-radius:0;border-inline-start:2px solid var(--warn)}
.ocard{border:0;border-radius:0;padding:0}

/* price bar */
.pbar{background:var(--wall)!important;color:var(--ink);border-radius:0;border-top:1px solid var(--line);box-shadow:0 -12px 24px -20px rgba(0,0,0,.35)}
.pinfo small{color:var(--muted)!important;font-size:.72rem;letter-spacing:.02em}
.pval{font-family:var(--serif);font-weight:400;font-stretch:normal;font-size:2.1rem;color:var(--ink)}
.pval s{color:var(--muted)!important;font-family:var(--body);font-weight:300;font-size:.42em}
.gold{background:var(--ink)!important;color:var(--wall)!important;border-radius:0;font-weight:500;letter-spacing:.04em;box-shadow:none!important}
.line{border:1px solid var(--ink)!important;color:var(--ink)!important;border-radius:0;background:transparent}
.dtog{background:transparent!important;color:var(--bronze)!important;border:0;border-radius:0;padding:2px 0;font-size:.74rem;font-weight:500}
.disc{color:var(--muted)}
.disc button{color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:0;background:transparent}
.disc button[aria-pressed="true"]{background:var(--ink)!important;color:var(--wall)!important;border-color:var(--ink)!important}
.coll{background:transparent;color:var(--bronze);border:1px solid var(--bronze);border-radius:0;font-family:var(--body);font-stretch:normal;letter-spacing:.14em}
.pkgfab{background:var(--ink);color:var(--wall);border-radius:0;box-shadow:0 10px 24px -14px rgba(0,0,0,.5)}
.pkgfab b{background:var(--wall);color:var(--ink);border-radius:0}

/* sheets: price list, sales, package, settings, close */
.sbody{gap:22px}
.shead h2{font-family:var(--serif);font-weight:400;font-size:2rem}
.back{border:1px solid var(--line);border-radius:0;background:transparent}
.panel{border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0 0;background:transparent}
.panel h3{font-family:var(--body);font-weight:500;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.seg button,.qtabs button{border-radius:0;background:transparent;border:1px solid var(--line)}
.seg button[aria-pressed="true"],.qtabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--wall)}
.primary{background:var(--ink);color:var(--wall);border-radius:0;font-weight:500}
.ghost{border-radius:0;border:1px solid var(--ink);background:transparent}
.green{background:var(--ink);color:var(--wall);border-radius:0;font-weight:500;letter-spacing:.04em}
.field input,textarea,.tiers input{border-radius:0;border:0;border-bottom:1px solid var(--ink);background:transparent}
.kpis{gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{background:transparent;color:var(--ink);border-radius:0;padding:14px 8px;border-inline-start:1px solid var(--line)}
.kpi:first-child{border-inline-start:0}
.kpi small{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:.6rem}
.kpi b{font-family:var(--serif);font-weight:400;font-stretch:normal;font-size:1.8rem}
.bar i{background:var(--ink);border-radius:0;height:6px}
.bar span:last-child{font-family:var(--serif);font-weight:400;font-size:1rem}
.deal .amt{font-family:var(--serif);font-weight:400;font-size:1.2rem}
.deal time{font-family:var(--body);font-weight:300}
.item .nm{font-family:var(--serif);font-weight:400;font-size:1.1rem}
.item .pr{font-family:var(--serif);font-weight:400;font-size:1.15rem}
.item .x{border-radius:0;background:transparent;border:1px solid var(--line)}
.totals .grand{font-family:var(--serif);font-weight:400;font-stretch:normal;font-size:2.4rem;border-top:1px solid var(--ink)}
.bigtotal{font-family:var(--serif);font-weight:400;font-stretch:normal;font-size:3rem}
.cthumbs img{border-radius:0;background:var(--hang)}
td .cp{color:var(--bronze);font-family:var(--body)}
.toast{border-radius:0;background:var(--ink);color:var(--wall)}

/* viewing room: white chrome around the scene */
.cust.vrmode{background:var(--wall)!important;color:var(--ink)}
.vr{color:var(--ink)}
.vr-top{border-bottom:1px solid var(--line)}
.vr-top .who .A{display:none}
.vr-top .who b{font-family:var(--serif);font-weight:400;letter-spacing:.34em;font-size:1.05rem}
.vr-tag{color:var(--muted);border:0;font-family:var(--body);font-stretch:normal;letter-spacing:.24em;font-weight:500}
.glassbtn{border:1px solid var(--line);background:var(--wall);color:var(--ink);border-radius:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.glassbtn[aria-pressed="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.vr-top .glassbtn{border-radius:50%;width:40px;padding:0}
.vr-env{background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.08);border-radius:0;padding:2px}
.vr-env button{color:#141414;border-radius:0;font-weight:400}
.vr-env button[aria-pressed="true"]{background:#141414;color:#fff}
.vr-tools .glassbtn{background:rgba(255,255,255,.88);color:#141414;border-color:rgba(0,0,0,.08)}
.vr-tools .glassbtn[aria-pressed="true"]{background:#141414;color:#fff}
.vr-hint{border-radius:0;background:rgba(20,20,20,.7)}
.vr-ed{color:var(--muted);font-family:var(--body);font-stretch:normal;font-weight:500;letter-spacing:.2em}
.vr-title{font-family:var(--serif);font-weight:400;font-stretch:normal;font-size:clamp(2rem,9vw,3rem);letter-spacing:.005em}
.vr-sizes button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:0;font-family:var(--serif);font-weight:400;font-size:1.05rem}
.vr-sizes button small{color:var(--muted)}
.vr-sizes button[aria-pressed="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.vr-sizes button[aria-pressed="true"] small{color:var(--wall);opacity:.7}
.vr-fin button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:0}
.vr-fin button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.vr-fin i{border-radius:0}
.vr-card{background:transparent;border:0;border-top:1px solid var(--ink);border-radius:0;padding:16px 0 0}
.vr-card .cpill{background:transparent;color:var(--bronze);border:1px solid var(--bronze);border-radius:0;font-family:var(--body);font-stretch:normal}
.vr-price{font-family:var(--serif);font-weight:400;font-stretch:normal;font-size:clamp(3rem,15vw,4.4rem)}
.vr-price s{color:var(--muted);font-family:var(--body);font-weight:300}
.vr-cta .gold{background:var(--ink)!important;color:var(--wall)!important;box-shadow:none!important}
.vr-cta .line{border-color:var(--ink)!important;color:var(--ink)!important}
.qr{border-radius:0;border:1px solid var(--line)}
.qr small{color:#141414;font-family:var(--body);letter-spacing:.16em}
/* package customer view keeps a calm dark gallery */
.cust:not(.vrmode){background:#121212!important}
.cust:not(.vrmode) h2,.cust:not(.vrmode) .big{font-family:var(--serif);font-weight:400;font-stretch:normal}
.cust:not(.vrmode) .who .A{display:none}
.cust:not(.vrmode) .who b{font-family:var(--serif);font-weight:400}
.cust:not(.vrmode) .gold{background:#efede8!important;color:#121212!important}
/* splash */
#splash{background:#fff!important;color:#141414!important}
#splash .A{display:none}
#splash b{font-family:var(--serif)!important;font-weight:400!important;letter-spacing:.4em!important;font-size:1.8rem!important;opacity:1!important;animation:fadein .9s ease both!important}
#splash small{color:#767676!important;font-family:var(--body)!important;font-stretch:normal!important;font-weight:500!important}


/* ===== wow layer ===== */
.exhibit{position:relative;margin-inline:-16px;height:min(66vh,560px);min-height:380px;background:var(--hang);overflow:hidden;touch-action:pan-y;cursor:pointer}
.exhibit .sl{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;display:grid;grid-template-rows:1fr auto}
.exhibit .sl.on{opacity:1}
.exhibit .frame{position:relative;min-height:0;display:grid;place-items:center;padding:34px 13% 8px}
.exhibit .frame img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 22px 26px rgba(0,0,0,.28)) drop-shadow(0 2px 3px rgba(0,0,0,.12));transform-origin:50% 60%}
.exhibit .sl.on .frame img{animation:kb 7s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.055)}}
.exhibit .light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 46% at 50% 38%,rgba(255,255,255,.55),transparent 70%)}
.exhibit .excap{padding:6px 22px 26px;display:grid;gap:4px;text-align:right;background:linear-gradient(180deg,transparent,var(--hang) 30%)}
.exhibit .excap .k{font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.exhibit .excap .n{font-family:var(--serif);font-size:clamp(1.9rem,8.5vw,2.8rem);line-height:1.02;direction:ltr;text-align:right;color:var(--ink)}
.exhibit .excap .p{font-size:.8rem;color:var(--muted);display:flex;gap:14px;justify-content:flex-start}
.exhibit .excap .p b{color:var(--ink);font-weight:500}
.exhibit .dots{position:absolute;right:22px;top:20px;display:flex;gap:6px;direction:ltr}
.exhibit .dots i{width:18px;height:2px;background:color-mix(in srgb,var(--ink) 25%,transparent);transition:background .3s,width .3s}
.exhibit .dots i.on{background:var(--ink);width:30px}
.exhibit .count{position:absolute;top:16px;left:22px;font-size:.62rem;letter-spacing:.2em;color:var(--muted);direction:ltr}
.stick{margin-top:8px}
/* editorial rhythm */
@media (prefers-reduced-motion:no-preference){
  .grid .tile{animation:none}
  .rv{transform:translateY(18px);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
  .rv.in{transform:none}
}
/* work page depth */
.navrow{display:grid!important;grid-template-columns:auto 1fr auto;gap:10px}
.navt{font-family:var(--serif);font-size:1.05rem;text-align:center;direction:ltr;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.navt.on{opacity:1;transform:none}
.dhero .wrap>.heroimg{will-change:transform}
#detail.flipping{animation:none!important}
.flipclone{position:fixed;z-index:40;object-fit:contain;pointer-events:none;filter:drop-shadow(0 18px 22px rgba(0,0,0,.25))}

/* ===================== VIEWING ROOM v2 ===================== */
/* Layout: a quiet viewing room — stone-toned walls, real room photographs as the opening, a uniform catalogue grid, and an Apple-style configurator: pick a finish, tap a size tile, the price waits at the bottom. Bordeaux is reserved for the one action that matters. */
:root{
  --wall:#f7f6f2; --card:#ffffff; --ink:#1a1814; --muted:#857f76; --line:#e4e0d8; --soft:#efede8; --hang:#ecebe6;
  --acc:#7a2e2a; --on-acc:#ffffff; --bronze:#8a6a3a; --sel-bg:#1a1814; --sel-fg:#f7f6f2;
  --serif:"Frank Ruhl Libre","Bellefair",Georgia,serif; --body:"Assistant","Heebo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#141311; --card:#1a1917; --ink:#eeeae3; --muted:#9c968c; --line:#2c2a26; --soft:#1f1e1b; --hang:#1d1c19;
  --acc:#c4705f; --on-acc:#141311; --bronze:#c9a66b; --sel-bg:#eeeae3; --sel-fg:#141311; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#141311; --card:#1a1917; --ink:#eeeae3; --muted:#9c968c; --line:#2c2a26; --soft:#1f1e1b; --hang:#1d1c19;
  --acc:#c4705f; --on-acc:#141311; --bronze:#c9a66b; --sel-bg:#eeeae3; --sel-fg:#141311; color-scheme:dark}
body{font-family:var(--body);font-size:16px}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
.brandlogo .t b{font-family:var(--serif);font-weight:400;font-size:1.25rem;letter-spacing:.36em}
#setBtn{border:0;width:44px;height:44px}
#setBtn .ico{width:22px;height:22px}
/* opening: real rooms */
.exhibit{height:min(58vh,500px);min-height:360px;background:#2a2723;margin-top:4px}
.exhibit .sl{display:block}
.exhibit .frame{position:absolute;inset:0;padding:0}
.exhibit .frame img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;filter:none}
.exhibit .sl.on .frame img{animation:kb 9s ease-out both}
.exhibit .light{background:linear-gradient(180deg,rgba(20,18,16,.05) 40%,rgba(20,18,16,.72))}
.exhibit .excap{position:absolute;inset:auto 0 0 0;padding:20px 22px 24px;background:none}
.exhibit .excap .k{color:rgba(255,255,255,.75)}
.exhibit .excap .n{color:#fff;font-family:var(--serif);font-weight:400}
.exhibit .excap .p{color:rgba(255,255,255,.8)}
.exhibit .excap .p b{color:#fff}
.exhibit .dots i{background:rgba(255,255,255,.35)}
.exhibit .dots i.on{background:#fff}
.exhibit .count{color:rgba(255,255,255,.8)}
/* catalogue grid: uniform */
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 12px}
.art{aspect-ratio:1;background:var(--hang)!important}
.art img{padding:15%;filter:drop-shadow(0 8px 10px rgba(26,24,20,.22)) drop-shadow(0 1px 1px rgba(26,24,20,.12))}
.tile .tn{font-family:var(--serif);font-size:1.05rem;font-weight:400}
.tile .tp{font-size:.78rem}
.tile .tp b{font-weight:600}
.sec h2,.shead h2,.pcard header b,.dtitle,.vr-title,.pval,.vr-price,.kpi b,.totals .grand,.bigtotal,.item .nm,.item .pr,.deal .amt,.tile .tn,.excap .n{font-family:var(--serif)!important}
/* work page */
.navrow{padding:8px 12px}
.iconbtn{border:0!important;display:inline-flex;align-items:center;gap:6px;padding:10px 8px;min-height:44px;font-size:.85rem}
.iconbtn[aria-pressed="true"]{background:transparent!important;color:var(--acc)!important}
.iconbtn[aria-pressed="true"] .ico{fill:currentColor}
.hgal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--hang)}
.hgal::-webkit-scrollbar{display:none}
.hgal figure{flex:none;width:100%;aspect-ratio:1/1;max-height:62vh;margin:0;scroll-snap-align:center;display:grid;place-items:center;overflow:hidden}
.hgal .g0{padding:13%}
.hgal .g0 img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(26,24,20,.28)) drop-shadow(0 2px 2px rgba(26,24,20,.15))}
.hgal .gv img{width:100%;height:100%;object-fit:cover}
.gdots{display:flex;justify-content:center;gap:6px;padding:12px 0 0}
.gdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.gdots i.on{background:var(--ink)}
.gnote{text-align:center;font-size:.72rem;color:var(--muted);padding-top:6px}
.dtitle{font-size:clamp(1.9rem,8vw,2.5rem);margin:18px 16px 2px;font-weight:400}
.dsub{margin:0 16px;color:var(--muted);font-size:.85rem}
.kind{display:grid!important;grid-auto-flow:column;grid-auto-columns:1fr;margin:18px 16px 0;padding:0;border:1px solid var(--line);border-bottom:1px solid var(--line);column-gap:0}
.kind button{padding:12px 4px;border:0!important;margin:0;font-size:.9rem;color:var(--muted)}
.kind button[aria-pressed="true"]{background:var(--ink)!important;color:var(--wall)!important}
.dbody{padding-top:4px;gap:20px}
.cfg{display:grid;gap:12px}
.cfg h4{margin:8px 0 0;font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.06em}
.fins{display:flex;gap:18px;flex-wrap:wrap}
.fins button{border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--muted);font-size:.9rem;min-height:44px}
.fins i{width:22px;height:22px;display:block;border:1px solid var(--line)}
.fins button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.fins button[aria-pressed="true"] i{outline:1.5px solid var(--ink);outline-offset:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sz2{border:1px solid var(--line);background:var(--card);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:60px;text-align:right}
.sz2 .s{font-family:var(--serif);font-size:1.12rem;direction:ltr;line-height:1.1}
.sz2 .s small{display:block;font-family:var(--body);font-size:.7rem;color:var(--muted);margin-top:3px}
.sz2 .p{font-family:var(--serif);font-size:1.08rem;color:var(--ink)}
.sz2[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sz2.w{border-style:dashed;border-color:var(--warn)}
.sz2.w .p{color:var(--warn)}
.cfg .note{font-size:.8rem}
.custom{padding:4px 0 0}
/* price bar: the one bordeaux action */
.pbar .gold{background:var(--acc)!important;color:var(--on-acc)!important}
.pbar .line{border:0!important;text-decoration:underline;text-underline-offset:4px;padding-inline:8px}
.vr-cta .gold{background:var(--acc)!important;color:var(--on-acc)!important}
.pval{font-size:2rem}
.toast{bottom:calc(120px + env(safe-area-inset-bottom,0px))}

/* ===================== v3: opening, price list, summary ===================== */
/* The opening is one full-bleed room photograph with the name set on it; the work page states every price at once
   as a clean price list (sizes down, finishes across) and spells out the chosen line like a receipt. */
.promo{display:none!important}
#home .hero{position:relative;padding-top:0}
#home .topline{position:absolute;inset:0 0 auto 0;z-index:4;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;background:none!important;border:0!important}
#home .topline .brandlogo,#home .topline .brandlogo *{color:#fff!important}
#home .topline .brandlogo small{opacity:.8}
#home .topline #setBtn{color:#fff;background:transparent!important}
.exhibit{height:min(78vh,640px);min-height:440px;margin:0 calc(-1*var(--gut,16px));width:auto}
.exhibit::before{content:"";position:absolute;inset:0 0 auto 0;height:140px;z-index:2;background:linear-gradient(180deg,rgba(15,13,11,.55),rgba(15,13,11,0));pointer-events:none}
.exhibit .excap{padding:0 22px 34px}
.exhibit .excap .n{font-size:clamp(2rem,9vw,2.8rem);line-height:1.05;margin:6px 0 10px}
.exhibit .excap .p{display:flex;gap:16px;font-size:.85rem}
.exhibit .dots{bottom:16px;top:auto}
.exhibit .count{top:auto;bottom:12px}
.qa{display:grid!important;grid-template-columns:repeat(3,1fr);gap:0;margin:22px 0 6px;border:0!important;background:none!important}
.qa button{background:none!important;border:0!important;border-inline-start:1px solid var(--line)!important;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;min-height:84px;color:var(--ink);border-radius:0!important;box-shadow:none!important}
.qa button:first-child{border-inline-start:0!important}
.qa .ic{display:block!important;background:none!important;width:auto;height:auto;color:var(--ink);margin-bottom:2px}
.qa .ic .ico{width:22px;height:22px}
.qa b{font-weight:600;font-size:.8rem;color:var(--muted)}
.qa small{font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
.tile{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tile:active{transform:scale(.975)}
/* work page */
.eyebrow{margin:20px 16px 0;font-size:.68rem;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.dtitle{margin-top:6px!important}
.kind{grid-auto-columns:1fr;gap:8px!important;border:0!important;margin:18px 16px 0!important}
.kind button{border:1px solid var(--line)!important;background:var(--card)!important;color:var(--ink)!important;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px!important;min-height:84px}
.kind button b{font-weight:600;font-size:.92rem}
.kind button small{display:block!important;font-size:.7rem;color:var(--muted);opacity:1}
.kind button em{font-style:normal;font-family:var(--serif);font-size:1.12rem;margin-top:4px}
.kind button[aria-pressed="true"]{background:var(--ink)!important;color:var(--wall)!important;border-color:var(--ink)!important}
.kind button[aria-pressed="true"] small{color:color-mix(in srgb,var(--wall) 70%,transparent)}
.plist{display:grid;gap:10px}
.plist h3{margin:6px 0 0;font-family:var(--serif);font-weight:400;font-size:1.45rem}
.plist .note{margin:0}
.pm{border-top:1.5px solid var(--ink)}
.pmr{display:grid;grid-template-columns:minmax(92px,1.25fr) repeat(var(--n),minmax(0,1fr));align-items:stretch;border-bottom:1px solid var(--line)}
.pmh{font-size:.72rem;color:var(--muted);font-weight:600}
.pmh>span{padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;line-height:1.2}
.pmh>span:first-child{align-items:flex-start;justify-content:flex-end}
.pmh i{width:16px;height:16px;border:1px solid var(--line);display:block}
.pmr .s{padding:12px 0;padding-left:10px;font-family:var(--serif);font-size:1.1rem;direction:ltr;text-align:right;line-height:1.1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.pmr .s small{font-family:var(--body);font-size:.7rem;color:var(--muted);margin-top:3px}
.pmr button,.pmr .na{border:0;background:transparent;font-family:var(--serif);font-size:1.08rem;color:var(--ink);min-height:56px;margin:4px 2px;display:grid;place-items:center;transition:background .2s,color .2s}
.pmr .na{color:var(--line)}
.pmr button[aria-pressed="true"]{background:var(--ink);color:var(--wall)}
.pmr.on{background:var(--soft)}
.pmr button.w{color:var(--warn);outline:1px dashed var(--warn);outline-offset:-5px}
.legend{font-size:.72rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.legend i{width:14px;height:10px;outline:1px dashed var(--warn);display:inline-block}
.sum{border:1px solid var(--line);background:var(--card);padding:18px 18px 16px;display:grid;gap:0}
.sum .h{font-size:.68rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0}
.sum dt,.sum dd{padding:9px 0;border-bottom:1px solid var(--line);margin:0;font-size:.92rem}
.sum dt{color:var(--muted)}
.sum dd{text-align:left;direction:ltr;font-weight:600;unicode-bidi:plaintext}
.sum dd.off{color:var(--bronze)}
.sum .tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px}
.sum .tot span{font-size:.9rem;font-weight:600}
.sum .tot b{font-family:var(--serif);font-weight:400;font-size:2.1rem;letter-spacing:-.01em}
.sum .rates{margin-top:10px;font-size:.72rem;color:var(--muted)}

/* ===================== v4: the banner ===================== */
/* A compact ink banner replaces the photo carousel: Albert's name set large in Frank Ruhl Libre, a bronze hairline frame,
   and the colour of one painting glowing softly behind it. It reads in a second and leaves the catalogue one thumb away. */
.exhibit{display:none!important}
.banner{position:relative;margin:0 calc(-1*var(--gut,16px));height:calc(clamp(220px,32vh,270px) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  background:#14120f;color:#f3efe8;overflow:hidden;display:grid;place-items:center;text-align:center;isolation:isolate}
.banner .glow{position:absolute;inset:-30%;width:160%;height:160%;object-fit:cover;filter:blur(42px) saturate(1.35);opacity:.5;z-index:-2;animation:bdrift 28s ease-in-out infinite alternate}
.banner::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 90% at 50% 40%,rgba(20,18,15,0) 0%,rgba(20,18,15,.55) 60%,rgba(14,12,10,.92) 100%)}

@keyframes brise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  const c=pkgCalc();h+=`<h2>Your collection</h2><div class="lines">${c.items.map(x=>{const a=ART.find(y=>y.id===x.id);return `<div><span class="li">${a?`<img class="th" src="${img(a)}" alt="">`:''}<span>${esc(x.n)}<br><small style="color:#aab6e6">${esc(x.spec)}</small></span></span><span>${x.fin!==x.list?`<s style="color:#aab6e6;font-weight:500">${$f(x.list)}</s> `:''}${$f(x.fin)}</span></div>`}).join('')}</div>
    <div class="big">${c.fin<c.list?`<s>${$f(c.list)}</s>`:''}${$f(c.fin)}</div><div class="cbtns"><button class="gold" type="button" data-cx="pdeal">✓ סגירת עסקה</button><button class="line" type="button" data-cx="x">סגירה</button></div>`;
  $('cust').innerHTML=h+`</div>`}
function vrSizes(){const F=cur.f[sel.f];return Object.keys(F).sort((x,y)=>area(x)-area(y)).filter(s=>Object.keys(F[s]).some(z=>{const c=cell(cur,sel.f,s,z);return c&&!c.w}))}
function vrSetSize(s){sel={f:sel.f,s,fr:cur.f[sel.f][s][sel.fr]!==undefined?sel.fr:FRO.find(z=>cur.f[sel.f][s][z]!==undefined)};renderCust();renderDetail();const b=$('vrInfo').querySelector(`[data-cs="${s}"]`);b&&b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}
$('cust').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.env){VR.env=d.env;renderCust();return}

  if(d.cx==='add'){const it=current();if(it){pkg.push(it);persist();toast('נוסף לחבילה · '+pkg.length)}return}
  if(d.cx==='deal'){const it=current();const p=single(it);return openClose([Object.assign({},it,{fin:p.fin})],false)}

(function(){let x0=null;$('cust').addEventListener('pointerdown',e=>{if(e.target.id==='vrc')x0=e.clientX});
  $('cust').addEventListener('pointerup',e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)<40)return;if(kind==='orig'){const ss=origInfo(cur).sizes.map(r=>r.s),i=ss.indexOf(osel),n=dx<0?Math.min(ss.length-1,i+1):Math.max(0,i-1);if(n!==i&&ss[n]){osel=ss[n];renderCust();renderDetail()}return}if(sel.custom)return;const ss=vrSizes(),i=ss.indexOf(sel.s);const n=dx<0?Math.min(ss.length-1,i+1):Math.max(0,i-1);if(n!==i&&ss[n])vrSetSize(ss[n])})})();
window.addEventListener('resize',()=>{if(!$('cust').hidden&&$('vrc'))vrDraw();if(!$('detail').hidden)drawMini()});

/* ---------- close deal + sales log ---------- */
const PAY=['אשראי','מזומן','Zelle','Venmo','אחר'];let CL=null;
function openClose(items,fromPkg){CL={items,fromPkg,pay:'אשראי',cust:'',note:''};$('close').hidden=false;renderClose();history.pushState({d:1},'')}
function renderClose(){const tot=CL.items.reduce((s,x)=>s+x.fin,0);
  $('close').innerHTML=`<div class="wrap sbody"><div class="shead"><h2>סגירת עסקה</h2><button class="back" type="button" data-act="back">ביטול</button></div>
  <div class="panel"><div class="cthumbs">${CL.items.map(x=>{const a=ART.find(y=>y.id===x.id);return a?`<img src="${img(a)}" alt="${esc(a.n)}">`:''}).join('')}</div>
    <div class="items">${CL.items.map(x=>`<div class="item" style="grid-template-columns:1fr auto"><span class="nm">${esc(x.n)}</span><small>${esc(x.spec)}</small><span class="pr">${$f(x.fin)}</span></div>`).join('')}</div>
    <div class="bigtotal">${$f(tot)}</div></div>
  <div class="panel"><h3>אמצעי תשלום</h3><div class="seg">${PAY.map(p=>`<button type="button" data-pay="${p}" aria-pressed="${CL.pay===p}">${p}</button>`).join('')}</div>
    <div class="field"><label for="clCust">שם הלקוח (לא חובה)</label><input id="clCust" value="${esc(CL.cust)}" placeholder="Sarah, Miami"></div>
    <div class="field"><label for="clNote">הערה (משלוח, הקדשה…)</label><input id="clNote" value="${esc(CL.note)}"></div>
    <p class="note">נמכר על ידי: <b>${S.me||'לא הוגדר'}</b>${S.me?'':' · מגדירים בהגדרות מי משתמש במכשיר'}</p></div>
  <button class="green" type="button" data-act="save">✓ אישור, נמכר</button></div>`}
$('close').addEventListener('input',e=>{if(e.target.id==='clCust')CL.cust=e.target.value;if(e.target.id==='clNote')CL.note=e.target.value});
$('close').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='back')return back();
  if(b.dataset.pay){CL.pay=b.dataset.pay;return renderClose()}
  if(b.dataset.act==='save'){const deal={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now(),items:CL.items.map(x=>({id:x.id,n:x.n,spec:x.spec,list:x.list,fin:x.fin,orig:!!x.orig})),total:CL.items.reduce((s,x)=>s+x.fin,0),pay:CL.pay,cust:CL.cust,note:CL.note,by:S.me||''};
    SALES.push(deal);
    if(CL.fromPkg)pkg=[];persist();celebrate();toast('נמכר! '+$f(deal.total)+' נרשם ביומן');
    for(const id of ['close','cust','pkg'])$(id).hidden=true;history.go(-1);setTimeout(()=>{if(!$('detail').hidden)renderDetail();renderHome()},60)}});
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
let salesRange='today';
function openSales(){$('sales').hidden=false;renderSales();history.pushState({d:1},'')}
function renderSales(){const today=dayKey(Date.now());const list=SALES.filter(s=>salesRange==='all'||dayKey(s.ts)===today).sort((a,b)=>b.ts-a.ts);
  const tot=list.reduce((s,x)=>s+x.total,0),pcs=list.reduce((s,x)=>s+x.items.length,0);
  const by={};list.forEach(s=>{const k=s.by||'לא ידוע';by[k]=(by[k]||0)+s.total});const pay={};list.forEach(s=>{pay[s.pay]=(pay[s.pay]||0)+s.total});
  const mx=Math.max(1,...Object.values(by),...Object.values(pay));
  const bars=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${Math.max(4,v/mx*100)}%"></i><span>${$f(v)}</span></div>`).join('');
  $('sales').innerHTML=`<div class="wrap sbody"><div class="shead"><h2>מכירות</h2><button class="back" type="button" data-act="back">סגירה</button></div>
  <div class="qtabs"><button type="button" data-r="today" aria-pressed="${salesRange==='today'}">היום</button><button type="button" data-r="all" aria-pressed="${salesRange==='all'}">כל הטור</button></div>
  <div class="kpis"><div class="kpi"><small>הכנסות</small><b>${$f(tot)}</b></div><div class="kpi"><small>עסקאות</small><b>${list.length}</b></div><div class="kpi"><small>יצירות</small><b>${pcs}</b></div></div>
  ${list.length?`<div class="panel"><h3>לפי מוכר</h3><div class="bars">${bars(by)}</div><h3>לפי תשלום</h3><div class="bars">${bars(pay)}</div></div>`:''}
  <div class="panel"><h3>עסקאות</h3>${list.length?list.map(s=>`<div class="deal"><time>${new Date(s.ts).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</time><span class="nm">${esc(s.items.map(x=>x.n).join(' + '))}</span><span class="amt">${$f(s.total)}</span><small>${esc([s.pay,s.by,s.cust].filter(Boolean).join(' · '))}${salesRange==='all'?' · '+new Date(s.ts).toLocaleDateString('he-IL'):''}</small>${CL&&CL.confirm===s.id?`<button class="del" type="button" data-delok="${s.id}">למחוק? לחצו שוב</button>`:`<button class="del" type="button" data-del="${s.id}">מחיקה</button>`}</div>`).join(''):'<p class="note">עוד אין מכירות. סוגרים עסקה מחדר התצוגה או מהחבילה, והיא נרשמת כאן.</p>'}</div>
  ${list.length?`<button class="primary" type="button" data-act="rep">העתקת דוח לוואטסאפ</button>`:''}</div>`}
$('sales').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.act==='back')return back();if(d.r){salesRange=d.r}
  else if(d.del){CL=Object.assign(CL||{},{confirm:d.del})}
  else if(d.delok){SALES=SALES.filter(s=>s.id!==d.delok);CL=null;persist()}
  else if(d.act==='rep'){const today=dayKey(Date.now());const list=SALES.filter(s=>salesRange==='all'||dayKey(s.ts)===today);
    const tot=list.reduce((s,x)=>s+x.total,0);return copy(`Albert Levi · ${salesRange==='all'?'כל הטור':'סיכום יום '+new Date().toLocaleDateString('he-IL')}\nהכנסות: ${$f(tot)} · ${list.length} עסקאות\n\n`+list.map(s=>`${new Date(s.ts).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})} ${s.items.map(x=>x.n).join(' + ')} — ${$f(s.total)} (${s.pay}${s.by?', '+s.by:''})`).join('\n'),'הדוח הועתק')}
  else return;renderSales()});

  ${ks.map(k=>`<tr><td class="sz"><b>${sz(k,S.unit)}</b><small>${sz(k,S.unit==='cm'?'in':'cm')}</small></td>${cols.map(c=>{const o=T2[k][c];if(!o)return '<td class="na">–</td>';const l=usd(o.p),pc=collPct(l);return `<td><button type="button" class="${o.w?'w':''}" tabindex="-1">${$f(l)}</button>${pc?`<span class="cp">${$f(usd(o.p*(1-pc/100)))}</span>`:''}</td>`}).join('')}</tr>`).join('')}

/* ---------- celebration ---------- */
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('fx');c.hidden=false;const x=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#f2b33d','#2f4be0','#e0337a','#11a198','#ffffff','#f26b2a'];const ps=Array.from({length:120},()=>({x:W/2,y:H*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*5+3,c:cols[Math.random()*cols.length|0],a:Math.random()*6}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(t-t0<1700)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true}})(t0)}

/* ---------- settings ---------- */
$('setBtn').addEventListener('click',()=>{$('settings').hidden=false;renderSettings();history.pushState({d:1},'')});
function flags(){const out=[];for(const f in STD)for(const k in STD[f])for(const fr in STD[f][k]){const o=STD[f][k][fr];if(o.w)out.push(`${FMT[f].en} · ${k.replace('x','″×')}″ · ${FR[fr].en} · $${o.p} — ${o.w}`)}return out}
function syncCode(){const {me,...shared}=S;const json=JSON.stringify({v:1,S:shared,ORIG,OS,tour,SALES});return 'ALP1:'+btoa(unescape(encodeURIComponent(json)))}
function renderSettings(){const fl=flags();
  $('settings').innerHTML=`<div class="wrap sbody"><div class="shead"><h2>הגדרות</h2><button class="back" type="button" data-act="back">סיום</button></div>
  <div class="panel"><h3>מי משתמש במכשיר הזה?</h3><div class="seg">${['אלברט','עירש'].map(n=>`<button type="button" data-me="${n}" aria-pressed="${S.me===n}">${n}</button>`).join('')}</div><p class="note">כך כל מכירה נרשמת על שם מי שסגר אותה.</p></div>
  <div class="panel"><h3>סנכרון בין אלברט לעירש</h3><p class="note">כדי ששניכם תדברו באותו קול: מי שמעדכן מחירים מעתיק את הקוד ושולח בוואטסאפ, והשני מדביק כאן. הקוד כולל את ההנחות, מחירי המקורים לפי גודל, רשימת הטור ויומן המכירות. מכירות משני המכשירים מתאחדות.</p>
    <div class="seg"><button class="primary" type="button" data-act="exp">העתקת קוד סנכרון</button></div>
    <textarea id="imp" placeholder="להדביק כאן קוד שמתחיל ב־ALP1:" aria-label="קוד סנכרון"></textarea><div class="seg"><button class="ghost" type="button" data-act="imp">טעינת הקוד</button></div></div>
  <div class="panel"><h3>מחירי מקורים לפי גודל ($)</h3><p class="note">אלברט ממלא בטופס ושולח קוד. אפשר גם לערוך כאן. מידה באינצ׳ים, למשל 30x40.</p>
    <div class="tiers"><table><thead><tr><th>מידה</th><th>מחיר</th><th></th></tr></thead><tbody>${OS.map((r,i)=>`<tr><td><input data-osz="${i}" value="${esc(r.s)}" placeholder="30x40"></td><td><input inputmode="numeric" data-osp="${i}" value="${r.p||''}" placeholder="$"></td><td><button class="ghost" type="button" data-osdel="${i}" aria-label="מחיקה">✕</button></td></tr>`).join('')}</tbody></table></div>
    <div class="seg"><button class="ghost" type="button" data-act="osadd">+ גודל</button></div></div>
  <div class="panel"><h3>הנחות</h3><div class="seg">${[[true,"Collector's Rate פעיל"],[false,'כבוי']].map(([k,v])=>`<button type="button" data-coll="${k}" aria-pressed="${S.coll===k}">${v}</button>`).join('')}</div>
    <p class="note">עד $300 מקבלים 10%, מעל $300 מקבלים 15%, ומעל $500 מקבלים 20%. ההנחה חלה על הדפסים בלבד.</p>
    <div class="field"><label for="sSecond">הנחה על יצירה נוספת בחבילה (%)</label><input id="sSecond" inputmode="numeric" value="${S.second}"></div></div>
  <div class="panel"><h3>תצוגה</h3><p class="note">המחירים והמידות נלקחים כמו שהם מהאתר: בדולרים ובאינצ׳ים.</p>
    <div class="seg">${[['in','אינצ׳ים קודם'],['cm','ס״מ קודם']].map(([k,v])=>`<button type="button" data-unit="${k}" aria-pressed="${S.unit===k}">${v}</button>`).join('')}</div></div>
  <div class="panel"><h3>מחירים חשודים במחירון (${fl.length})</h3><p class="note">אלה מחירים מהאתר שנראים כמו טעות, וכדאי לתקן אותם בחנות. באפליקציה הם מסומנים במסגרת כתומה מקווקוות.</p><div class="flaglist">${fl.map(x=>`<div dir="ltr" style="text-align:right">${esc(x)}</div>`).join('')}</div></div></div>`}
function readInputs(){
  const sc=parseInt(($('sSecond')||{}).value,10);if(sc>=0&&sc<=90)S.second=sc;
  document.querySelectorAll('#settings [data-osz]').forEach(i=>{const k=+i.dataset.osz,m=i.value.match(/(\d+(?:\.\d+)?)\s*[x×X*]\s*(\d+(?:\.\d+)?)/);if(OS[k]&&m)OS[k].s=m[1]+'x'+m[2]});
  document.querySelectorAll('#settings [data-osp]').forEach(i=>{const k=+i.dataset.osp;if(OS[k])OS[k].p=parseInt(i.value.replace(/[^\d]/g,''),10)||null});persist()}
$('settings').addEventListener('change',()=>{readInputs();renderHome()});
$('settings').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;readInputs();
  if(d.act==='back')return back();
  if(d.act==='osadd'){OS.push({s:'',p:null});persist();return renderSettings()}
  if(d.osdel!==undefined){OS.splice(+d.osdel,1);persist();return renderSettings()}
  if(d.me)S.me=d.me;else if(d.round)S.round=d.round;else if(d.unit)S.unit=d.unit;else if(d.coll)S.coll=d.coll==='true';
  else if(d.act==='calib'){const i=parseFloat($('cIls').value),u=parseFloat($('cUsd').value);if(i>0&&u>0){S.rate=Math.round(i/u*100)/100;S.verified=true;toast('השער עודכן: '+S.rate)}else return toast('צריך למלא את שני המחירים')}
  else if(d.act==='exp')return copy(syncCode(),'הקוד הועתק. שלחו אותו בוואטסאפ');
  else if(d.act==='imp'){const v=($('imp').value||'').trim();try{if(!v.startsWith('ALP1:'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));const me=S.me;if(o.S){Object.assign(S,o.S);S.me=me}if(o.ORIG)Object.entries(o.ORIG).forEach(([id,v])=>{ORIG[id]=Object.assign({},ORIG[id]||{},v)});if(o.T)T=o.T;if(o.OS)OS=o.OS;if(o.tour)tour=o.tour;const ids=new Set(SALES.map(s=>s.id));(o.SALES||[]).forEach(s=>{if(!ids.has(s.id))SALES.push(s)});toast('הנתונים נטענו. עכשיו שני המכשירים זהים')}catch(err){return toast('הקוד לא תקין. צריך להעתיק אותו בשלמותו')}}
  else return;persist();renderSettings();renderHome()});

/* ---------- utils + boot ---------- */
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function copy(t,msg){try{navigator.clipboard.writeText(t).then(()=>toast(msg||'הועתק'),()=>toast('ההעתקה נחסמה'))}catch(e){toast('ההעתקה נחסמה')}}
renderHome();
(function(){const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;let seen=false;try{seen=sessionStorage.getItem('alp_splash')}catch(e){}
  if(!standalone||seen||matchMedia('(prefers-reduced-motion: reduce)').matches)return;try{sessionStorage.setItem('alp_splash','1')}catch(e){}
  const s=document.createElement('div');s.id='splash';s.innerHTML='<div><div class="lg"><span class="A">A</span><b>Albert Levi</b></div><small>USA TOUR · PRICE GUIDE</small></div>';document.body.appendChild(s);
  setTimeout(()=>{s.style.opacity='0';setTimeout(()=>s.remove(),450)},1700)})();
if('serviceWorker' in navigator&&/github\.io$|localhost/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
