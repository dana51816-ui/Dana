<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d3a8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מחירון אלברט">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body><title>מחירון אלברט לוי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Archivo:wdth,wght@100..125,500..900&family=Josefin+Sans:wght@300;400&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: a pocket price guide — tour pieces first, every work opens as one "ID card" with all sizes and finishes priced at once; the chosen price and the package live in a navy bar pinned to the bottom. */
:root{
  --wall:#f3f5fb; --card:#ffffff; --ink:#121a3d; --muted:#5f6789; --line:#dfe4f2; --soft:#e9edf8;
  --navy:#1d3a8f; --navy-deep:#14215e; --gold:#f2b33d; --on-gold:#14215e;
  --cobalt:#2f4be0; --magenta:#e0337a; --sun:#f5b70a; --teal:#11a198; --tang:#f26b2a;
  --accent:var(--navy); --sel-bg:#1d3a8f; --sel-fg:#ffffff;
  --warn:#a8510b; --warn-bg:#fff2df; --ok:#1d7a4c; --sold:#b02142;
  --display:"Archivo","Rubik",system-ui,sans-serif;
  --script:"Mrs Saint Delafield",cursive; --thin:"Josefin Sans","Rubik",sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(20,30,80,.06),0 10px 26px -14px rgba(20,30,80,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#0c1233; --card:#151d47; --ink:#eef1fb; --muted:#9aa3c8; --line:#26306a; --soft:#1c2557;
  --navy:#1d3a8f; --navy-deep:#0a0f2c; --gold:#f5bd52; --on-gold:#14215e;
  --accent:#9fb3ff; --sel-bg:#f5bd52; --sel-fg:#14215e; --warn:#ffb46b; --warn-bg:#2f2213; --ok:#6fd6a2; --sold:#ff8aa0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#0c1233; --card:#151d47; --ink:#eef1fb; --muted:#9aa3c8; --line:#26306a; --soft:#1c2557;
  --navy:#1d3a8f; --navy-deep:#0a0f2c; --gold:#f5bd52; --on-gold:#14215e;
  --accent:#9fb3ff; --sel-bg:#f5bd52; --sel-fg:#14215e; --warn:#ffb46b; --warn-bg:#2f2213; --ok:#6fd6a2; --sold:#ff8aa0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;direction:rtl;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
bdi{unicode-bidi:isolate}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* home */
.promo{background:var(--navy);color:#fff;text-align:center;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.7rem;letter-spacing:.08em;padding:9px 16px;line-height:1.5;direction:ltr}
.promo b{color:var(--gold)}
.hero{padding-block:14px 4px;display:grid;gap:12px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brandlogo{display:flex;align-items:center;direction:ltr;color:var(--ink)}
.brandlogo .A{font-family:var(--script);font-size:3.4rem;line-height:.6;margin-right:-10px;transform:translateY(6px)}
.brandlogo .t{display:grid}
.brandlogo .t b{font-family:var(--thin);font-weight:300;font-size:1.15rem;letter-spacing:.32em;line-height:1}
.brandlogo .t small{font-family:var(--thin);font-size:.66rem;letter-spacing:.08em;color:var(--muted);text-align:right;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.8rem;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.pill.ok .dot{background:var(--ok)}
.eyebrow{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.68rem;letter-spacing:.14em;color:var(--muted);direction:ltr;text-align:right}
.greet{font-weight:700;font-size:clamp(1.45rem,6.2vw,2rem);line-height:1.15;margin:-6px 0 0;text-wrap:balance}
.greet em{font-style:normal;color:var(--accent);box-shadow:inset 0 -.32em 0 color-mix(in srgb,var(--gold) 55%,transparent)}
.searchbox{position:relative}
.searchbox input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px 46px 14px 44px;font-size:1.05rem;box-shadow:var(--shadow)}
.searchbox input:focus{border-color:var(--accent);outline:none}
.searchbox svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .clear{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:var(--soft);border-radius:999px;width:30px;height:30px;color:var(--muted)}
.themes{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.themes::-webkit-scrollbar{display:none}
.theme{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px 8px 12px;font-size:.92rem;font-weight:500}
.theme i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.theme[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px;gap:10px}
.sec h2{margin:0;font-size:1rem;font-weight:600}
.sec span{color:var(--muted);font-size:.85rem}
.tourrow{display:flex;gap:12px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-bottom:6px;scrollbar-width:none}
.tourrow::-webkit-scrollbar{display:none}
.tourrow .tile{flex:none;width:132px}
.tourempty{border:1.5px dashed var(--line);border-radius:16px;padding:14px;color:var(--muted);font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-bottom:110px}
.tile{display:grid;gap:7px;border:0;background:none;padding:0;text-align:right;align-content:start}
.art{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12px;filter:drop-shadow(0 6px 10px rgba(20,30,80,.18))}
.art.ph{background:var(--card)!important}
.art .badge{z-index:1;position:absolute;top:8px;right:8px;background:rgba(255,255,255,.93);color:#14215e;font-size:.7rem;font-weight:600;border-radius:999px;padding:3px 9px}
.art .badge.sold{background:rgba(20,33,94,.85);color:#fff}
.art .star{z-index:1;position:absolute;bottom:8px;left:8px;background:var(--gold);color:#14215e;font-size:.7rem;font-weight:700;border-radius:999px;padding:3px 8px}
.tile .tn{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:.98rem;line-height:1.2;direction:ltr;text-align:right;overflow-wrap:anywhere}
.tile .tp{font-size:.82rem;color:var(--muted);margin-top:-3px}
.tile .tp b{color:var(--ink);font-family:var(--display);font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--wall);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.dhero{position:relative;padding-block:12px 18px;color:#fff;overflow:hidden}
.dhero .bg{position:absolute;inset:0;overflow:hidden}
.dhero .bg img{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(26px) saturate(1.3)}
.heroimg{display:block;max-width:100%;max-height:min(42vh,320px);margin:4px auto 0;object-fit:contain;filter:drop-shadow(0 14px 28px rgba(0,0,0,.4))}
.dhero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,44,.15),rgba(10,15,44,.62))}
.dhero .wrap{position:relative;display:grid;gap:12px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.navrow .r{display:flex;gap:8px}
.iconbtn{border:0;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:.9rem;text-decoration:none}
.iconbtn[aria-pressed="true"]{background:var(--gold);color:#14215e}
.dtitle{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(1.8rem,8vw,2.7rem);line-height:1;letter-spacing:-.02em;margin:10px 0 0;direction:ltr;text-align:right;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(255,255,255,.16);border-radius:16px;padding:5px}
.kind button{border:0;background:none;color:#fff;border-radius:12px;padding:10px;font-weight:600}
.kind button[aria-pressed="true"]{background:#fff;color:#14215e}
.kind button:disabled{opacity:.45}
.dbody{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-block:18px 220px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pcard header{padding:14px 16px 10px;display:grid;gap:2px}
.pcard header b{font-size:1.02rem}
.pcard header small{color:var(--muted);font-size:.82rem}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:6px 8px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.74rem;padding-block:8px}
td.sz{text-align:right;padding-inline-start:16px}
td.sz b{display:block;font-family:var(--display);font-weight:700;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
td.sz small{display:block;color:var(--muted);font-size:.72rem;direction:ltr;text-align:right}
td button{border:1.5px solid transparent;background:var(--soft);padding:8px 10px;border-radius:10px;font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;min-width:70px}
td button.on{background:var(--sel-bg);color:var(--sel-fg)}
td button.w{border-color:var(--warn);border-style:dashed;color:var(--warn)}
td.na{color:var(--muted)}
.custom{border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;gap:10px;background:color-mix(in srgb,var(--soft) 50%,transparent)}
.custom .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.custom label{font-size:.85rem;font-weight:600}
.custom input{width:72px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px;text-align:center;direction:ltr}
.custom .res{display:flex;gap:8px;flex-wrap:wrap}
.custom .res button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:.85rem}
.custom .res button.on{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.custom .res b{font-family:var(--display)}
.note{font-size:.84rem;color:var(--muted);margin:0}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 13px;font-size:.86rem}
.wallbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:grid;gap:4px}
.wallbox svg{width:100%;height:auto;max-height:170px;display:block}
.wallbox p{margin:0;font-size:.78rem;color:var(--muted);text-align:center}

/* originals */
.ocard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px}
.ocard h4{margin:0;font-size:.85rem;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:8px 12px;display:grid;gap:1px;text-align:center}
.chips button small{font-size:.7rem;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.chips button[aria-pressed="true"] small{color:inherit;opacity:.8}
.chips.st button[aria-pressed="true"][data-st="avail"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chips.st button[aria-pressed="true"][data-st="hold"]{background:var(--sun);border-color:var(--sun);color:#14215e}
.chips.st button[aria-pressed="true"][data-st="sold"]{background:var(--sold);border-color:var(--sold);color:#fff}
.obig{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:2.6rem;line-height:1;direction:ltr;text-align:right}
.field{display:grid;gap:5px}
.field label{font-size:.84rem;color:var(--muted)}
.field input{border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:11px;font-size:1rem;width:100%}

/* bottom bar */
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(180deg,var(--navy),var(--navy-deep));color:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px -18px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom,0px)}
.pbar .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;padding-block:12px 12px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pinfo{flex:1 1 0;min-width:0;overflow:hidden}
.pinfo small{display:block;color:#b9c3ea;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.pval{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:2.15rem;line-height:1;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.pval s{font-size:.42em;color:#9fabdc;font-weight:600;margin-left:8px}
.pbtns{display:flex;gap:8px;flex:none}
.gold{border:0;background:var(--gold);color:#14215e;border-radius:14px;padding:12px 14px;font-weight:700}
.line{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:14px;padding:11px 12px;font-weight:500}
.disc{display:flex;gap:6px;align-items:center;font-size:.8rem;color:#b9c3ea;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.disc::-webkit-scrollbar{display:none}
.disc>*{flex:none}
.disc button{border:1px solid rgba(255,255,255,.28);background:transparent;border-radius:999px;padding:4px 11px;font-size:.8rem;color:#fff}
.disc button[aria-pressed="true"]{background:#fff;border-color:#fff;color:#14215e;font-weight:600}
.coll{display:inline-flex;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.64rem;letter-spacing:.1em;color:#14215e;background:var(--gold);border-radius:999px;padding:3px 9px}
.pkgfab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:22;border:0;background:var(--navy);color:#fff;border-radius:999px;padding:12px 16px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.pkgfab b{background:var(--gold);color:#14215e;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}

/* package + settings */
.sbody{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 60px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead h2{margin:0;font-size:1.35rem}
.back{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.panel h3{margin:0;font-size:1rem}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:9px 13px}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.items{display:grid;gap:0}
.item{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-family:var(--display);font-weight:700;direction:ltr;text-align:right}
.item small{grid-column:1;color:var(--muted);font-size:.78rem;direction:ltr;text-align:right}
.item .pr{grid-row:1/3;grid-column:2;text-align:left;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.item .pr s{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
.item .x{grid-row:1/3;grid-column:3;border:0;background:var(--soft);border-radius:999px;width:30px;height:30px;color:var(--muted)}
.totals{display:grid;gap:4px;font-size:.92rem}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:2rem;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.tiers{overflow-x:auto}
.tiers table td,.tiers table th{border-top:1px solid var(--line);padding:6px}
.tiers input{width:84px;border:1.5px solid var(--line);background:var(--wall);border-radius:10px;padding:8px;text-align:center;direction:ltr}
textarea{width:100%;min-height:80px;border:1.5px solid var(--line);background:var(--wall);border-radius:12px;padding:10px;font:inherit;font-size:.8rem;direction:ltr;color:inherit}
.primary{border:0;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;font-weight:600}
.ghost{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font-weight:500;color:var(--ink)}
.flaglist{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}

/* customer */
.cust{position:fixed;inset:0;z-index:50;overflow-y:auto;background:radial-gradient(120% 80% at 100% 0%,#2a4bb0 0,transparent 60%),linear-gradient(180deg,#1d3a8f,#0a0f2c);color:#f4f4f6;display:grid;place-items:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.cust .cc{width:min(520px,100%);display:grid;gap:16px;direction:ltr;text-align:left}
.cust .who{display:flex;align-items:center;gap:4px}
.cust .who .A{font-family:var(--script);font-size:3rem;line-height:.6}
.cust .who b{font-family:var(--thin);font-weight:300;letter-spacing:.32em;font-size:1.05rem}
.cust .strip{height:6px;border-radius:999px}
.cust .cimg{max-width:100%;max-height:34vh;justify-self:center;object-fit:contain;filter:drop-shadow(0 16px 30px rgba(0,0,0,.45))}
.cust .cpill{justify-self:start;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.7rem;letter-spacing:.12em;background:var(--gold);color:#14215e;border-radius:999px;padding:5px 12px}
.cust h2{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(1.9rem,9vw,3rem);line-height:1;margin:0}
.cust dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.cust dt{color:#aab6e6}.cust dd{margin:0}
.cust .lines{display:grid;gap:8px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.cust .lines div{display:flex;justify-content:space-between;gap:12px}
.cust .lines span:last-child{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cust .big{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(3.4rem,19vw,5.8rem);line-height:1;font-variant-numeric:tabular-nums}
.cust .big s{display:block;font-size:.3em;color:#aab6e6;font-weight:600}
.cust .close{justify-self:start;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:999px;padding:9px 16px;direction:rtl}
.toast{position:fixed;bottom:calc(180px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--wall);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#close{z-index:55}
/* micro-interactions */
button{transition:transform .12s ease,background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease}
button:active:not(:disabled){transform:scale(.965)}
.tile:active .art{transform:scale(.98)}
/* viewing room */
.cust.vrmode{display:block;padding:0;background:#090b12;overflow-y:auto}
.vr{min-height:100%;display:grid;grid-template-rows:auto auto 1fr;color:#f4f2ee;padding-bottom:env(safe-area-inset-bottom,0px)}
.vr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;position:relative;z-index:2}
.vr-top .who{display:flex;align-items:center;direction:ltr;white-space:nowrap;min-width:0}
.vr-top .who .A{font-family:var(--script);font-size:2.6rem;line-height:.6;margin-right:-6px}
.vr-top .who b{font-family:var(--thin);font-weight:300;letter-spacing:.32em;font-size:.95rem}
.vr-tag{white-space:nowrap;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.62rem;letter-spacing:.28em;color:#c9a35a;border:1px solid rgba(201,163,90,.45);border-radius:999px;padding:5px 10px}
.glassbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);color:#fff;border-radius:999px;min-width:38px;height:38px;padding:0 12px;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.glassbtn[aria-pressed="true"]{background:rgba(255,255,255,.88);color:#111;border-color:#fff}
.vr-stage{position:relative;height:min(60vh,560px);min-height:320px;touch-action:pan-y}
.vr-stage canvas{display:block;width:100%;height:100%;direction:ltr}
.wallbox canvas{direction:ltr}
.vr-ctl{position:absolute;inset-inline:12px;top:12px;direction:ltr;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.vr-ctl>*{pointer-events:auto}
.vr-env{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(20,20,24,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);direction:ltr}
.vr-env button{border:0;background:none;color:#fff;border-radius:999px;padding:7px 12px;font-size:.78rem;font-weight:600;letter-spacing:.02em}
.vr-env button[aria-pressed="true"]{background:#fff;color:#111}
.vr-tools{display:flex;gap:6px}
.vr-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:.74rem;color:#fff;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;white-space:nowrap;animation:hint 3.2s ease forwards;pointer-events:none}
@keyframes hint{0%,70%{opacity:1}100%{opacity:0}}
.vr-info{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:18px 16px 26px;max-width:640px;width:100%;margin:0 auto;direction:ltr;text-align:left}
.vr-ed{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:.64rem;letter-spacing:.24em;color:#c9a35a}
.vr-title{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(2rem,9vw,3.1rem);line-height:.95;letter-spacing:-.02em;margin:2px 0 0}
.vr-sizes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.vr-sizes::-webkit-scrollbar{display:none}
.vr-sizes button{flex:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#f4f2ee;border-radius:14px;padding:9px 13px;text-align:left;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:.92rem}
.vr-sizes button small{display:block;font-family:var(--body);font-weight:400;font-size:.68rem;color:#9a9caa}
.vr-sizes button[aria-pressed="true"]{background:#f4f2ee;color:#0b0d14;border-color:#f4f2ee}
.vr-sizes button[aria-pressed="true"] small{color:#555}
.vr-fin{display:flex;gap:8px;flex-wrap:wrap}
.vr-fin button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#f4f2ee;border-radius:999px;padding:7px 12px 7px 8px;display:inline-flex;align-items:center;gap:8px;font-size:.84rem}
.vr-fin i{width:18px;height:18px;border-radius:5px;display:block}
.vr-fin button[aria-pressed="true"]{border-color:#c9a35a;box-shadow:0 0 0 1px #c9a35a inset}
.vr-card{border-radius:22px;padding:16px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.vr-card .cpill{display:inline-block;margin-bottom:8px;white-space:nowrap;font-size:.6rem;letter-spacing:.08em}
.vr-price{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:clamp(3rem,15vw,4.6rem);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.vr-price s{display:block;font-size:.28em;color:#9a9caa;font-weight:600;letter-spacing:0;margin-bottom:4px}
.vr-cta{display:grid;grid-template-columns:1fr auto;gap:8px;direction:rtl}
.vr-cta .gold{padding:15px;font-size:1rem;background:linear-gradient(180deg,#f6c55a,#e0a32e);box-shadow:0 10px 24px -10px rgba(242,179,61,.6)}
.vr-cta .line{border-color:rgba(255,255,255,.25)}
.wallbox canvas{display:block;width:100%;height:220px;border-radius:14px}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 8px;display:grid;gap:2px;justify-items:center;text-align:center;box-shadow:var(--shadow)}
.qa b{font-size:.86rem;font-weight:600}
.qa small{font-size:.72rem;color:var(--muted);font-family:var(--display);font-variant-numeric:tabular-nums}
.qa .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:1rem;margin-bottom:2px}
/* quick sheet */
.qtabs{display:flex;gap:8px}
.qtabs button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-weight:600}
.qtabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
td .cp{display:block;font-size:.68rem;color:var(--ok);font-weight:600;margin-top:2px}
/* sales */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:linear-gradient(160deg,var(--navy),var(--navy-deep));color:#fff;border-radius:16px;padding:12px;display:grid;gap:2px}
.kpi small{color:#b9c3ea;font-size:.72rem}
.kpi b{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:1.35rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.deal{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.deal:last-child{border-bottom:0}
.deal time{grid-row:1/3;font-family:var(--display);font-weight:700;color:var(--muted);font-size:.85rem}
.deal .nm{font-weight:600;font-size:.92rem;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal small{color:var(--muted);font-size:.76rem}
.deal .amt{grid-row:1/3;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.deal .del{border:0;background:none;color:var(--sold);font-size:.75rem;padding:0;justify-self:start}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;font-size:.85rem}
.bar i{display:block;height:12px;border-radius:999px;background:var(--gold)}
.bar span:last-child{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}

.cthumbs{display:flex;gap:8px;overflow-x:auto}
.cthumbs img{width:64px;height:64px;object-fit:contain;background:var(--soft);border-radius:12px;flex:none}
.bigtotal{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:2.6rem;direction:ltr;text-align:right;line-height:1}
.green{border:0;background:var(--ok);color:#fff;border-radius:14px;padding:14px 16px;font-weight:700;font-size:1.02rem}
/* showroom */
.cust{place-items:start center}
.room{width:100%;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -25px rgba(0,0,0,.6);background:#e8e2d8}

.room image{transition:all .45s cubic-bezier(.2,.8,.2,1)}
.srow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}

.srow button[aria-pressed="true"]{background:#fff;color:#14215e;border-color:#fff}
.srow button[aria-pressed="true"] small{color:#5f6789}
.srow.fr button{font-family:var(--body);font-weight:500}
.slabel{font-size:.7rem;letter-spacing:.14em;color:#aab6e6;font-family:var(--display);font-stretch:125%;font-weight:800}
.pricebox{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.qr{background:#fff;border-radius:14px;padding:8px;display:grid;gap:2px;justify-items:center;flex:none}
.qr svg{width:84px;height:84px;display:block}
.qr small{color:#14215e;font-size:.6rem;font-weight:700;letter-spacing:.06em;font-family:var(--display)}
.cbtns{display:flex;gap:8px;flex-wrap:wrap;direction:rtl}
.cbtns .line{padding:10px 14px}
.lines .th{width:46px;height:46px;object-fit:contain;background:rgba(255,255,255,.08);border-radius:10px;flex:none}
.lines .li{display:flex;gap:10px;align-items:center;min-width:0}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#1d3a8f,#0a0f2c);display:grid;place-items:center;color:#fff;transition:opacity .45s ease}

const inch=cm=>Math.round(cm/2.54);

function rnd(v){if(S.round==='5')return Math.round(v/5)*5;if(S.round==='10')return Math.round(v/10)*10;if(S.round==='9')return Math.max(9,Math.round(v/10)*10-1);return Math.round(v)}
const usd=ils=>rnd(ils/S.rate);
const $f=n=>'$'+Math.round(n).toLocaleString('en-US');
function cell(a,f,s,fr){const v=a.f[f]&&a.f[f][s]&&a.f[f][s][fr];if(v===undefined)return null;
  if(f==='float'||v>0)return {ils:v,w:null,own:f!=='float'};const o=STD[f][keyOf(s)][fr];return {ils:o.p,w:o.w||null}}
function customILS(f,fr,w,h){const pts=Object.entries(STD[f]).filter(([k,v])=>v[fr]&&!v[fr].w).map(([k,v])=>[area(k),v[fr].p]).sort((x,y)=>x[0]-y[0]);
  if(pts.length<2)return null;const A=w*h;
  if(A<=pts[0][0])return pts[0][1]*Math.max(.6,A/pts[0][0]);
  for(let i=1;i<pts.length;i++)if(A<=pts[i][0]){const [a0,p0]=pts[i-1],[a1,p1]=pts[i];return p0+(p1-p0)*(A-a0)/(a1-a0)}
  const [aL,pL]=pts[pts.length-1];return pL*A/aL}
function origInfo(a){const o=Object.assign({sc:'',cx:'',status:a.os===false?'sold':'avail',ovr:null},ORIG[a.id]||{});o.tier=(o.sc&&o.cx&&T[o.sc]&&T[o.sc][o.cx])||null;o.price=o.ovr||o.tier;return o}
function minUSD(a){let m=Infinity;for(const f in a.f)for(const s in a.f[f])for(const fr in a.f[f][s]){const c=cell(a,f,s,fr);if(c&&!c.w&&c.ils<m)m=c.ils}return isFinite(m)?usd(m):null}
const collPct=list=>!S.coll?0:list>500?20:list>300?15:10;

/* ---------- home ---------- */
function renderPromo(){$('promo').innerHTML=S.coll?`THE COLLECTOR'S RATE · UP TO $300: <b>10%</b> · OVER $300: <b>15%</b> · OVER $500: <b>20%</b>`:`USA TOUR · PRICE GUIDE`}
$('themes').innerHTML=THEMES.map(([k,l,c])=>`<button class="theme" type="button" data-t="${k}" aria-pressed="${k===theme}" style="--c:${c}"><i></i>${l}</button>`).join('');
$('themes').addEventListener('click',e=>{const b=e.target.closest('.theme');if(!b)return;theme=b.dataset.t;for(const x of $('themes').children)x.setAttribute('aria-pressed',x===b);renderHome()});
$('q').addEventListener('input',()=>{$('clearQ').hidden=!$('q').value;renderHome()});
$('clearQ').addEventListener('click',()=>{$('q').value='';$('clearQ').hidden=true;renderHome();$('q').focus()});
function inTheme(a){if(theme==='all')return true;if(theme==='emb')return !!a.f.emb;if(theme==='orig')return a.o;return a.T.has(theme)}
function tileHTML(a){const o=a.o?origInfo(a):null,m=minUSD(a),onTour=tour.includes(a.id);
  const badge=o?`<span class="badge${o.status==='sold'?' sold':''}">מקור${o.status==='sold'?' · נמכר':o.status==='hold'?' · שמור':''}</span>`:'';
  const pr=m!=null?`הדפס מ־<b>${$f(m)}</b>`:(o&&o.price?`מקור · <b>${$f(o.price)}</b>`:'מקור · לפי קבוצת מחיר');
  return `<button class="tile" type="button" data-id="${a.id}"><div class="art ph" style="background:${artBg(a)}"><img src="${img(a)}" alt="" loading="lazy" decoding="async" onerror="this.remove();this.parentNode&&this.parentNode.classList.remove('ph')">${badge}${onTour?'<span class="star">⭐ בטור</span>':''}</div><div class="tn">${esc(a.n)}</div><div class="tp">${pr}</div></button>`}
function renderHome(){
  renderPromo();$('rateTxt').textContent=S.rate.toFixed(2);$('setBtn').classList.toggle('ok',!!S.verified);
  const q=$('q').value.trim().toLowerCase().replace(/[^a-z0-9 ]/g,'');
  const tr=tour.map(id=>ART.find(a=>a.id===id)).filter(Boolean);
  $('tourWrap').hidden=!!q;
  $('tourCount').textContent=tr.length?tr.length+' יצירות':'';
  $('tour').innerHTML=tr.length?tr.map(tileHTML).join(''):`<div class="tourempty">פותחים יצירה ולוחצים ⭐ כדי להוסיף אותה לרשימת היצירות שאלברט מביא לטור. הן יופיעו כאן, ראשונות.</div>`;
  const items=ART.filter(a=>(!q||a.k.includes(q))&&inTheme(a)).sort((x,y)=>(tour.includes(y.id)-tour.includes(x.id)));
  const th=THEMES.find(t=>t[0]===theme)[1];
  $('gridTitle').textContent=q?'תוצאות חיפוש':theme==='all'?'כל היצירות':th;
  $('count').textContent=items.length+' יצירות';
  $('grid').innerHTML=items.length?items.map(tileHTML).join(''):`<div class="empty">לא מצאנו יצירה כזאת.<br>נסו חלק מהשם, למשל "tree" או "hamsa".</div>`;
  const td=dayKey(Date.now()),tt=SALES.filter(s=>dayKey(s.ts)===td).reduce((s,x)=>s+x.total,0);
  $('qa').innerHTML=`<button type="button" data-qa="quick"><span class="ic" style="background:color-mix(in srgb,var(--gold) 30%,transparent)">$</span><b>מחירון מהיר</b><small>כל הגדלים</small></button>
  <button type="button" data-qa="sales"><span class="ic" style="background:color-mix(in srgb,var(--ok) 25%,transparent)">✓</span><b>מכירות היום</b><small>${$f(tt)}</small></button>
  <button type="button" data-qa="pkg"><span class="ic" style="background:color-mix(in srgb,var(--cobalt) 22%,transparent)">◫</span><b>חבילה</b><small>${pkg.length?pkg.length+' · '+$f(pkgCalc().fin):'ריקה'}</small></button>`;
  renderFab();
}
$('qa').addEventListener('click',e=>{const b=e.target.closest('[data-qa]');if(!b)return;const k=b.dataset.qa;if(k==='quick')openQuick();else if(k==='sales')openSales();else{$('pkg').hidden=false;renderPkg();renderFab();history.pushState({d:1},'')}});
document.addEventListener('click',e=>{const b=e.target.closest('#grid [data-id],#tour [data-id]');if(b)openArt(b.dataset.id)});

/* ---------- detail: ID card ---------- */
function openArt(id){cur=ART.find(a=>a.id===id);kind=Object.keys(cur.f).length?'print':'orig';sel=null;disc='auto';custom={w:'',h:''};
  if(kind==='print')pickFirst();
  $('detail').hidden=false;$('detail').scrollTop=0;renderDetail();history.pushState({d:1},'')}
function pickFirst(){for(const f of ['canvas','emb','float'])if(cur.f[f]){const ss=Object.keys(cur.f[f]).sort((x,y)=>area(x)-area(y));for(const s of ss)for(const fr of FRO){const c=cell(cur,f,s,fr);if(c&&!c.w){sel={f,s,fr};return}}}}
function closeAll(){for(const id of ['detail','settings','pkg','cust'])$(id).hidden=true;$('pbar').hidden=true;renderHome()}
window.addEventListener('popstate',()=>{if(!$('close').hidden){$('close').hidden=true;return}if(!$('cust').hidden){$('cust').hidden=true;renderFab();return}if(!$('quick').hidden||!$('sales').hidden){$('quick').hidden=true;$('sales').hidden=true;renderHome();return}if(!$('pkg').hidden&&!$('detail').hidden){$('pkg').hidden=true;renderFab();return}closeAll()});
function back(){if(history.state&&history.state.d)history.back();else closeAll()}

function tableHTML(f){const F=cur.f[f],ss=Object.keys(F).sort((x,y)=>area(x)-area(y)),cols=FRO.filter(fr=>ss.some(s=>F[s][fr]!==undefined));
  let h=`<section class="pcard"><header><b>${FMT[f].he}</b><small>${FMT[f].d}</small></header><div class="tscroll"><table><thead><tr><th style="text-align:right;padding-inline-start:16px">גודל</th>${cols.map(c=>`<th>${FR[c].he}</th>`).join('')}</tr></thead><tbody>`;
  for(const s of ss){h+=`<tr><td class="sz"><b>${sz(s,S.unit)}</b><small>${sz(s,S.unit==='cm'?'in':'cm')}</small></td>`;
    for(const fr of cols){const c=cell(cur,f,s,fr);const on=sel&&!sel.custom&&sel.f===f&&sel.s===s&&sel.fr===fr;
      h+=c?`<td><button type="button" class="${on?'on':''}${c.w?' w':''}" data-c="${f}|${s}|${fr}">${$f(usd(c.ils))}</button></td>`:'<td class="na">–</td>'}
    h+='</tr>'}
  h+=`</tbody></table></div>`;
  if(f!=='float'){const fr=FRO.filter(x=>Object.values(STD[f]).some(v=>v[x]));const w=parseFloat(custom.w),hh=parseFloat(custom.h);const k=S.unit==='cm'?1:2.54;
    let res='';if(w>0&&hh>0&&custom.f===f){res=`<div class="res">${fr.map(x=>{const p=customILS(f,x,w*k,hh*k);if(!p)return '';const on=sel&&sel.custom&&sel.f===f&&sel.fr===x;return `<button type="button" class="${on?'on':''}" data-cu="${f}|${x}">${FR[x].he} · <b>${$f(usd(p))}</b></button>`}).join('')}</div><p class="note">הערכה לפי מחירי הגדלים הסטנדרטיים. כדאי לאשר מול אלברט.</p>`}
    h+=`<div class="custom"><div class="row"><label>גודל מיוחד</label><input inputmode="decimal" aria-label="רוחב" data-cw="${f}" value="${custom.f===f?esc(custom.w):''}" placeholder="רוחב"><span>×</span><input inputmode="decimal" aria-label="גובה" data-ch="${f}" value="${custom.f===f?esc(custom.h):''}" placeholder="גובה"><span class="note">${S.unit==='cm'?'ס״מ':'אינץ׳'}</span></div>${res}</div>`}
  return h+`</section>`}
function roomSVG(a,w,h,fr,opt){opt=opt||{};const W=Math.max(380,w+150),floor=16,sofaH=82,gap=24,H=Math.max(270,floor+sofaH+gap+h+46);
  const fy=H-floor,ax=(W-w)/2,ay=fy-sofaH-gap-h,sx=(W-210)/2,id='r'+a.id+(opt.k||'');
  const fs={black:'#121318',white:'#f7f7f4',espresso:'#4a2f22',natural:'#c79a62'}[fr]||null;const fw=Math.max(2.5,Math.min(w,h)*.035);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Room preview ${sz(w+'x'+h,'cm')}">
  <defs><linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe9df"/><stop offset="1" stop-color="#ddd5c8"/></linearGradient>
  <radialGradient id="${id}l" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="${id}s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="${Math.max(2,h*.03)}" stdDeviation="${Math.max(2,h*.03)}" flood-color="#000" flood-opacity=".35"/></filter>
  <clipPath id="${id}c"><rect x="${ax}" y="${ay}" width="${w}" height="${h}"/></clipPath></defs>
  <rect width="${W}" height="${fy}" fill="url(#${id}w)"/><ellipse cx="${W/2}" cy="${ay+h*.4}" rx="${W*.55}" ry="${H*.45}" fill="url(#${id}l)"/>
  <rect y="${fy}" width="${W}" height="${floor}" fill="#a77b52"/><rect y="${fy}" width="${W}" height="2.5" fill="#f4efe7"/>
  ${Array.from({length:Math.ceil(W/38)},(_,i)=>`<rect x="${i*38}" y="${fy+2.5}" width=".8" height="${floor}" fill="#8e6641"/>`).join('')}
  <g transform="translate(${W-62},${fy})"><rect x="14" y="-150" width="2" height="150" fill="#2b2b2b"/><path d="M0 -150 L30 -150 L24 -178 L6 -178Z" fill="#f2e3c6"/><ellipse cx="15" cy="-1" rx="12" ry="2" fill="#2b2b2b"/></g>
  <g transform="translate(26,${fy})"><path d="M-10 0 L10 0 L13 -34 L-13 -34Z" fill="#c2643a"/><g fill="#3f7d4e"><ellipse cx="-12" cy="-60" rx="9" ry="26" transform="rotate(-25 -12 -60)"/><ellipse cx="10" cy="-66" rx="9" ry="30" transform="rotate(20 10 -66)"/><ellipse cx="0" cy="-74" rx="8" ry="34"/></g></g>
  <g><rect x="${sx}" y="${fy-sofaH}" width="210" height="48" rx="12" fill="#3e4f78"/><rect x="${sx-10}" y="${fy-sofaH+24}" width="230" height="44" rx="14" fill="#34436a"/>
  <rect x="${sx+8}" y="${fy-sofaH+14}" width="94" height="30" rx="10" fill="#4a5c88"/><rect x="${sx+108}" y="${fy-sofaH+14}" width="94" height="30" rx="10" fill="#4a5c88"/>
  <rect x="${sx+24}" y="${fy-sofaH+2}" width="34" height="28" rx="8" fill="${a.c[1]}" opacity=".9"/><rect x="${sx+152}" y="${fy-sofaH+2}" width="34" height="28" rx="8" fill="${a.c[2]}" opacity=".9"/>
  <rect x="${sx+6}" y="${fy-14}" width="6" height="14" fill="#222"/><rect x="${sx+198}" y="${fy-14}" width="6" height="14" fill="#222"/></g>
  <g filter="url(#${id}s)"><rect x="${ax}" y="${ay}" width="${w}" height="${h}" fill="${a.c[0]}"/><image href="${img(a)}" x="${ax-w*.08}" y="${ay-h*.08}" width="${w*1.16}" height="${h*1.16}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id}c)"/>
  ${fs?`<rect x="${ax-fw/2}" y="${ay-fw/2}" width="${w+fw}" height="${h+fw}" fill="none" stroke="${fs}" stroke-width="${fw}"/>`:''}${fr==='rolled'?`<rect x="${ax}" y="${ay}" width="${w}" height="${h}" fill="none" stroke="#fff" stroke-dasharray="5 4" stroke-width="1.4"/>`:''}</g>
  ${opt.label!==false?`<g transform="translate(${W/2},${ay-14})"><rect x="-58" y="-11" width="116" height="20" rx="10" fill="#14215e" opacity=".9"/><text y="3.5" text-anchor="middle" font-size="10" fill="#fff" font-family="Archivo, sans-serif" font-weight="700" style="direction:ltr;unicode-bidi:plaintext">${sz(w+'x'+h,'in')} · ${w}×${h} cm</text></g>`:''}
  </svg>`}
function wallSVG(){if(!sel)return '';return `<div class="wallbox"><canvas id="mini" aria-label="הדמיה בגלריה בקנה מידה"></canvas><p>הדמיה בקנה מידה · ב"הצג ללקוח" אפשר להחליף סביבה ותאורה</p></div>`}
function origHTML(){const o=origInfo(cur);
  const tiersSet=Object.keys(T).some(k=>Object.values(T[k]||{}).some(Boolean));
  return `<section class="ocard">
    <div><h4>מחיר המקור${o.dim?` · <bdi dir="ltr">${esc(o.dim)} cm</bdi>`:''}</h4><div class="obig">${o.price?$f(o.price):'<span style="font-size:.45em;color:var(--muted)">בחרו גודל ומורכבות</span>'}</div>${o.ovr?'<p class="note">מחיר ידני ליצירה הזאת</p>':''}</div>
    <div><h4>גודל</h4><div class="chips">${SC.map(([k,l,d])=>`<button type="button" data-sc="${k}" aria-pressed="${o.sc===k}">${l}<small>${d}</small></button>`).join('')}</div></div>
    <div><h4>מורכבות</h4><div class="chips">${CX.map(([k,l])=>`<button type="button" data-cx="${k}" aria-pressed="${o.cx===k}">${l}</button>`).join('')}</div></div>
    <div><h4>סטטוס</h4><div class="chips st">${Object.entries(ST).map(([k,v])=>`<button type="button" data-st="${k}" aria-pressed="${o.status===k}">${v}</button>`).join('')}</div></div>
    <div class="field"><label for="ovr">מחיר ידני ליצירה הזאת ($), לא חובה</label><input id="ovr" inputmode="numeric" value="${o.ovr||''}" placeholder="משאירים ריק = לפי הקבוצה"></div>
    ${tiersSet?'':'<div class="warn">עוד לא הוגדרו מחירים לקבוצות המקורים. מגדירים פעם אחת בהגדרות, בטבלה "מחירי מקורים".</div>'}
  </section>`}
function renderDetail(){const a=cur,hasP=Object.keys(a.f).length>0;
  let h=`<header class="dhero"><div class="bg" style="background:${artBg(a,135)}"><img src="${img(a)}" alt="" onerror="this.remove()"></div><div class="wrap">
    <div class="navrow"><button class="iconbtn" type="button" data-act="back">→ חזרה</button><div class="r"><button class="iconbtn" type="button" data-act="tour" aria-pressed="${tour.includes(a.id)}">${tour.includes(a.id)?'⭐ בטור':'☆ להוסיף לטור'}</button>${a.h?`<a class="iconbtn" href="https://www.albertlevi.com/products/${esc(a.h)}" target="_blank" rel="noopener">↗</a>`:''}</div></div>
    <img class="heroimg" src="${img(a)}" alt="${esc(a.n)}" onerror="this.remove()">
    <h2 class="dtitle">${esc(a.n)}</h2>
    <div class="kind"><button type="button" data-kind="print" aria-pressed="${kind==='print'}"${hasP?'':' disabled'}>הדפס / מהדורה</button><button type="button" data-kind="orig" aria-pressed="${kind==='orig'}"${a.o?'':' disabled'}>מקור${a.o?'':' · אין'}</button></div>
  </div></header><div class="wrap dbody">`;
  if(kind==='orig')h+=origHTML();
  else{h+=['canvas','emb','float'].filter(f=>a.f[f]).map(tableHTML).join('');
    const c=sel&&!sel.custom?cell(a,sel.f,sel.s,sel.fr):null;
    if(c&&c.w)h+=`<div class="warn"><b>כדאי לבדוק לפני שאומרים ללקוח.</b> במחירון באתר: ${esc(c.w)}.</div>`;
    h+=wallSVG()}
  $('detail').innerHTML=h+'</div>';renderBar();drawMini()}
function drawMini(){const cv=$('mini');if(!cv||!sel)return;const [w,h]=sel.custom?[sel.w,sel.h]:dims(sel.s);drawScene(cv,{a:cur,w,h,fr:sel.fr,env:'gallery',eve:false,dims:true,t:1})}

function current(){ // selected line item
  if(kind==='orig'){const o=origInfo(cur);if(!o.price)return null;return {id:cur.id,n:cur.n,spec:'Original painting · one of a kind',orig:true,list:o.price}}
  if(!sel)return null;
  if(sel.custom){const ils=customILS(sel.f,sel.fr,sel.w,sel.h);return {id:cur.id,n:cur.n,spec:`${FMT[sel.f].en} · ${inch(sel.w)}″×${inch(sel.h)}″ (custom) · ${FR[sel.fr].en}`,list:usd(ils),ils}}
  const c=cell(cur,sel.f,sel.s,sel.fr);return {id:cur.id,n:cur.n,spec:`${FMT[sel.f].en} · ${sz(sel.s,'in')} (${sz(sel.s,'cm')}) · ${FR[sel.fr].en}`,list:usd(c.ils),ils:c.ils}}
function single(it){const auto=disc==='auto';const pct=it.orig?(auto?0:disc):(auto?collPct(it.list):disc);
  return {pct,coll:auto&&pct>0,fin:pct?(it.ils?usd(it.ils*(1-pct/100)):rnd(it.list*(1-pct/100))):it.list}}
function renderBar(){const it=current();if(!it){$('pbar').hidden=true;renderFab();return}const p=single(it);
  const opts=(S.coll&&!it.orig?['auto']:[]).concat([0,10,15,20]);
  $('pbar').innerHTML=`<div class="wrap"><div class="prow"><div class="pinfo"><small>${esc(it.spec)}${it.ils?' · ₪'+Math.round(it.ils).toLocaleString('en-US'):''}</small><div class="pval"><span data-roll="${p.fin}">${$f(renderBar.last??p.fin)}</span>${p.pct?`<s>${$f(it.list)}</s>`:''}</div></div>
  <div class="pbtns"><button class="line" type="button" data-act="add">+ לחבילה</button><button class="gold" type="button" data-act="cust">הצג ללקוח</button></div></div>
  <div class="disc">${p.coll?`<span class="coll">COLLECTOR'S RATE −${p.pct}%</span>`:'<span>הנחה:</span>'}${opts.map(d=>`<button type="button" data-disc="${d}" aria-pressed="${disc===d||(d===0&&disc==='auto'&&!opts.includes('auto'))}">${d==='auto'?'אוטומטי':d?d+'%':'בלי'}</button>`).join('')}</div></div>`;
  $('pbar').hidden=false;roll($('pbar'));renderBar.last=p.fin;renderFab()}
function roll(root){root.querySelectorAll('[data-roll]').forEach(el=>{const to=+el.dataset.roll,from=parseFloat(el.textContent.replace(/[^\d.]/g,''))||to;
  if(from===to||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=$f(to);return}
  const t0=performance.now(),d=420;(function step(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=$f(from+(to-from)*e);if(k<1)requestAnimationFrame(step)})(t0)})}

$('detail').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.act==='back')return back();
  if(d.act==='tour'){tour=tour.includes(cur.id)?tour.filter(x=>x!==cur.id):[...tour,cur.id];persist();toast(tour.includes(cur.id)?'נוסף לרשימת הטור':'הוסר מהטור')}
  else if(d.kind){kind=d.kind;disc='auto';if(kind==='print'&&!sel)pickFirst()}
  else if(d.c){const [f,s,fr]=d.c.split('|');sel={f,s,fr}}
  else if(d.cu){const [f,fr]=d.cu.split('|');const k=S.unit==='cm'?1:2.54;sel={custom:true,f,fr,w:Math.round(parseFloat(custom.w)*k),h:Math.round(parseFloat(custom.h)*k)}}
  else if(d.sc||d.cx||d.st){const o=Object.assign({},ORIG[cur.id]||{});if(d.sc)o.sc=d.sc;if(d.cx)o.cx=d.cx;if(d.st)o.status=d.st;ORIG[cur.id]=o;persist()}
  else return;
  const y=$('detail').scrollTop;renderDetail();$('detail').scrollTop=y});

  else if(rule==='second'){const ord=[...items].sort((a,b)=>b.list-a.list);ord.slice(1).forEach(x=>x.fin=rnd(x.list*(1-S.second/100)));label=`כל יצירה נוספת −${S.second}%`}

  <div class="panel"><h3>שער הדולר</h3><p class="note">המחירים באתר שמורים בשקלים, והאפליקציה ממירה לדולרים. ${S.verified?'<b style="color:var(--ok)">השער אומת.</b>':'<b style="color:var(--warn)">השער עוד לא אומת מול האתר בארה״ב.</b>'}</p>
    <div class="field"><label for="sRate">כמה שקלים שווה דולר אחד</label><input id="sRate" inputmode="decimal" value="${S.rate}"></div>
    <p class="note">כיול: רושמים מחיר בדולרים מהאתר האמריקאי ואת מחיר השקל של אותה מידה וגימור (מופיע בשורה הקטנה בפס הכחול).</p>
    <div class="row2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label for="cIls">₪ שקלים</label><input id="cIls" inputmode="decimal" placeholder="1059"></div><div class="field"><label for="cUsd">$ באתר בארה״ב</label><input id="cUsd" inputmode="decimal" placeholder="289"></div></div>
    <div class="seg"><button class="ghost" type="button" data-act="calib">חישוב השער</button></div></div>
  <div class="panel"><h3>מחירי מקורים לפי קבוצה ($)</h3><p class="note">ממלאים פעם אחת. כל מקור משויך לגודל ולמורכבות, והמחיר נקבע מהטבלה.</p>
    <div class="tiers"><table><thead><tr><th></th>${CX.map(([k,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${SC.map(([s,l,d])=>`<tr><th style="text-align:right">${l}<br><small>${d}</small></th>${CX.map(([c])=>`<td><input inputmode="numeric" data-t="${s}|${c}" value="${(T[s]&&T[s][c])||''}" placeholder="$"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><h3>הנחות</h3><div class="seg">${[[true,"Collector's Rate פעיל"],[false,'כבוי']].map(([k,v])=>`<button type="button" data-coll="${k}" aria-pressed="${S.coll===k}">${v}</button>`).join('')}</div>
    <p class="note">עד $300 מקבלים 10%, מעל $300 מקבלים 15%, ומעל $500 מקבלים 20%. ההנחה חלה על הדפסים בלבד.</p>
    <div class="field"><label for="sSecond">הנחה על יצירה נוספת בחבילה (%)</label><input id="sSecond" inputmode="numeric" value="${S.second}"></div></div>
  <div class="panel"><h3>תצוגה</h3><div class="seg">${[['5','עיגול ל־5$'],['10','ל־10$'],['9','מסתיים ב־9'],['none','לדולר']].map(([k,v])=>`<button type="button" data-round="${k}" aria-pressed="${S.round===k}">${v}</button>`).join('')}</div>
    <div class="seg">${[['in','אינצ׳ים קודם'],['cm','ס״מ קודם']].map(([k,v])=>`<button type="button" data-unit="${k}" aria-pressed="${S.unit===k}">${v}</button>`).join('')}</div></div>
  <div class="panel"><h3>מחירים חשודים במחירון (${fl.length})</h3><p class="note">אלה מחירים מהאתר שנראים כמו טעות, וכדאי לתקן אותם בחנות. באפליקציה הם מסומנים במסגרת כתומה מקווקוות.</p><div class="flaglist">${fl.map(x=>`<div dir="ltr" style="text-align:right">${esc(x)}</div>`).join('')}</div></div></div>`}
function readInputs(){const r=parseFloat(($('sRate')||{}).value);if(r>1&&r<10&&r!==S.rate){S.rate=r;S.verified=false}
  const sc=parseInt(($('sSecond')||{}).value,10);if(sc>=0&&sc<=90)S.second=sc;
  document.querySelectorAll('#settings [data-t]').forEach(i=>{const [s,c]=i.dataset.t.split('|');const v=parseInt(i.value.replace(/[^\d]/g,''),10)||null;T[s]=T[s]||{};T[s][c]=v});persist()}
$('settings').addEventListener('change',()=>{readInputs();renderHome()});
$('settings').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;readInputs();
  if(d.act==='back')return back();
  if(d.me)S.me=d.me;else if(d.round)S.round=d.round;else if(d.unit)S.unit=d.unit;else if(d.coll)S.coll=d.coll==='true';
  else if(d.act==='calib'){const i=parseFloat($('cIls').value),u=parseFloat($('cUsd').value);if(i>0&&u>0){S.rate=Math.round(i/u*100)/100;S.verified=true;toast('השער עודכן: '+S.rate)}else return toast('צריך למלא את שני המחירים')}
  else if(d.act==='exp')return copy(syncCode(),'הקוד הועתק. שלחו אותו בוואטסאפ');
  else if(d.act==='imp'){const v=($('imp').value||'').trim();try{if(!v.startsWith('ALP1:'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));const me=S.me;if(o.S){Object.assign(S,o.S);S.me=me}if(o.ORIG)Object.entries(o.ORIG).forEach(([id,v])=>{ORIG[id]=Object.assign({},ORIG[id]||{},v)});if(o.T)T=o.T;if(o.tour)tour=o.tour;const ids=new Set(SALES.map(s=>s.id));(o.SALES||[]).forEach(s=>{if(!ids.has(s.id))SALES.push(s)});toast('הנתונים נטענו. עכשיו שני המכשירים זהים')}catch(err){return toast('הקוד לא תקין. צריך להעתיק אותו בשלמותו')}}
  else return;persist();renderSettings();renderHome()});

/* ---------- utils + boot ---------- */
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function copy(t,msg){try{navigator.clipboard.writeText(t).then(()=>toast(msg||'הועתק'),()=>toast('ההעתקה נחסמה'))}catch(e){toast('ההעתקה נחסמה')}}
renderHome();
(function(){const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;let seen=false;try{seen=sessionStorage.getItem('alp_splash')}catch(e){}
  if(!standalone||seen||matchMedia('(prefers-reduced-motion: reduce)').matches)return;try{sessionStorage.setItem('alp_splash','1')}catch(e){}
  const s=document.createElement('div');s.id='splash';s.innerHTML='<div><div class="lg"><span class="A">A</span><b>Albert Levi</b></div><small>USA TOUR · PRICE GUIDE</small></div>';document.body.appendChild(s);
  setTimeout(()=>{s.style.opacity='0';setTimeout(()=>s.remove(),450)},1700)})();
if('serviceWorker' in navigator&&/github\.io$|localhost/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
</body></html>
